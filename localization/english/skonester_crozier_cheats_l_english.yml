l_english:
 SKONESTER_CROZIER_CHEATS_B_auto_ascension_OFF:0 "OFF  ·  Every ruler I play: best genes and +5 skills"
 SKONESTER_CROZIER_CHEATS_B_auto_ascension_ON:0 "ON  ·  Every ruler I play: best genes and +5 skills"
 SKONESTER_CROZIER_CHEATS_B_auto_ascension_TT:0 "The character you play gets Genius, Herculean and Beautiful plus +5 to all six skills. Each character only gets this once, so every heir you continue as receives it too.\nChecked when you turn it on and again at every auto-mode check (monthly by default, see the frequency buttons below)."
 SKONESTER_CROZIER_CHEATS_B_auto_forever_young_OFF:0 "OFF  ·  Stay 30 forever"
 SKONESTER_CROZIER_CHEATS_B_auto_forever_young_ON:0 "ON  ·  Stay 30 forever"
 SKONESTER_CROZIER_CHEATS_B_auto_forever_young_TT:0 "Whenever you are older than 30, your age is set back to 30.\nChecked when you turn it on and again at every auto-mode check (monthly by default, see the frequency buttons below)."
 SKONESTER_CROZIER_CHEATS_B_auto_gold_floor_OFF:0 "OFF  ·  Never below 1,000 gold"
 SKONESTER_CROZIER_CHEATS_B_auto_gold_floor_ON:0 "ON  ·  Never below 1,000 gold"
 SKONESTER_CROZIER_CHEATS_B_auto_gold_floor_TT:0 "Whenever you have less than 1,000 gold (including debt), you are topped back up to exactly 1,000.\nChecked when you turn it on and again at every auto-mode check (monthly by default, see the frequency buttons below)."
 SKONESTER_CROZIER_CHEATS_B_auto_no_prison_OFF:0 "OFF  ·  I cannot be imprisoned"
 SKONESTER_CROZIER_CHEATS_B_auto_no_prison_ON:0 "ON  ·  I cannot be imprisoned"
 SKONESTER_CROZIER_CHEATS_B_auto_no_prison_TT:0 "The moment you are imprisoned, you are released.\nAlso checked when you turn it on and at every auto-mode check."
 SKONESTER_CROZIER_CHEATS_B_auto_prestige_floor_OFF:0 "OFF  ·  Never below 1,000 prestige and piety"
 SKONESTER_CROZIER_CHEATS_B_auto_prestige_floor_ON:0 "ON  ·  Never below 1,000 prestige and piety"
 SKONESTER_CROZIER_CHEATS_B_auto_prestige_floor_TT:0 "Whenever your prestige or piety is below 1,000, it is topped back up to exactly 1,000.\nChecked when you turn it on and again at every auto-mode check (monthly by default, see the frequency buttons below)."
 SKONESTER_CROZIER_CHEATS_B_child_now:0 "Have a child with my spouse now"
 SKONESTER_CROZIER_CHEATS_B_child_now_TT:0 "A newborn child of you and one of your spouses appears at your court with Genius, Herculean and Beautiful. Requires a spouse. The child joins your dynasty."
 SKONESTER_CROZIER_CHEATS_B_combo_army:0 "Dream army"
 SKONESTER_CROZIER_CHEATS_B_combo_army_TT:0 "In order: every men-at-arms regiment grows (+1 / +2 / +5 per regiment, Amounts setting) and is filled to full strength; levies and garrisons in your provinces are refilled; 5 strong knights join your court (Prowess 40, Martial 18); you, your knights and your army commanders get Logistician, Military Engineer, Organizer and Aggressive Attacker."
 SKONESTER_CROZIER_CHEATS_B_combo_emergency:0 "Emergency rescue"
 SKONESTER_CROZIER_CHEATS_B_combo_emergency_TT:0 "In order: cure your diseases and wounds; free you from prison; win every war in which you are the main defender; pay off debt; cancel every scheme targeting you; bring home your relatives held as hostages."
 SKONESTER_CROZIER_CHEATS_B_combo_family:0 "Perfect family"
 SKONESTER_CROZIER_CHEATS_B_combo_family_TT:0 "In order: you, your spouses and children are cured of all diseases, wounds and defects; your heir gets Genius, Herculean, Beautiful and +10 to all skills; every living child of yours with an education trait gets the best level of it."
 SKONESTER_CROZIER_CHEATS_B_combo_golden_age:0 "Golden age"
 SKONESTER_CROZIER_CHEATS_B_combo_golden_age_TT:0 "In order: pay off any debt, double your gold, build every building possible in your whole realm, raise county development (+1 / +5 / +20, Amounts setting, Applies to setting) and raise your capital's development (+5 / +20 / +50, Amounts setting)."
 SKONESTER_CROZIER_CHEATS_B_combo_rise:0 "Rise to power"
 SKONESTER_CROZIER_CHEATS_B_combo_rise_TT:0 "In order: you become independent from your liege; if your highest title is below kingdom, a new kingdom is created for you; all unclaimed duchy, kingdom and empire titles over your counties are created for you."
 SKONESTER_CROZIER_CHEATS_B_combo_throne:0 "Path to the throne (for vassals)"
 SKONESTER_CROZIER_CHEATS_B_combo_throne_TT:0 "For when you are a vassal: your liege gets +100 opinion of you and names you their designated heir, all their other vassals are forced to vote for you for 10 years, and you get a pressed claim on your liege's primary title."
 SKONESTER_CROZIER_CHEATS_B_cooldowns_reset:0 "Reset all cooldowns"
 SKONESTER_CROZIER_CHEATS_B_cooldowns_reset_TT:0 "Removes your cooldowns on 501 decisions and 558 character interactions, so anything marked not ready yet can be used again."
 SKONESTER_CROZIER_CHEATS_B_disease_player_OFF:0 "OFF  ·  Disease immunity"
 SKONESTER_CROZIER_CHEATS_B_disease_player_ON:0 "ON  ·  Disease immunity"
 SKONESTER_CROZIER_CHEATS_B_disease_player_TT:0 "Gives you the Disease Protection trait (+50 health, blocks catching ordinary non-epidemic diseases) and cures any disease you have, including plague, smallpox and cancer. Diseases are cured again at every auto-mode check.\nEvents can still give you a disease directly.\nIf you switch to another character, the bonus moves to them at the next auto-mode check."
 SKONESTER_CROZIER_CHEATS_B_domain_OFF:0 "OFF  ·  Domain limit +50 × strength"
 SKONESTER_CROZIER_CHEATS_B_domain_ON:0 "ON  ·  Domain limit +50 × strength"
 SKONESTER_CROZIER_CHEATS_B_domain_TT:0 "Lets you hold +50 more counties personally without a penalty, per strength step.\nStrength is the multiplier picked at the top of the panel when you turn this on. To change it later, turn the toggle off, pick a new strength, and turn it on again.\nIf you switch to another character, the bonus moves to them at the next auto-mode check."
 SKONESTER_CROZIER_CHEATS_B_enemy_commander:0 "Remove their army commanders"
 SKONESTER_CROZIER_CHEATS_B_enemy_commander_TT:0 "Removes the commander from every army of the target. The AI may appoint new ones."
 SKONESTER_CROZIER_CHEATS_B_enemy_deplete:0 "Destroy 25% / 50% / 90% of their raised troops"
 SKONESTER_CROZIER_CHEATS_B_enemy_deplete_TT:0 "The target's raised armies lose a share of their soldiers permanently.\nAmount depends on the Amounts setting at the top of Skonester Cheats: Low 25%, Medium 50%, High 90%."
 SKONESTER_CROZIER_CHEATS_B_enemy_supply:0 "Empty their army supplies"
 SKONESTER_CROZIER_CHEATS_B_enemy_supply_TT:0 "Every raised army of the target loses all its supply."
 SKONESTER_CROZIER_CHEATS_B_forge_crown:0 "Create the Crown of the Sovereign"
 SKONESTER_CROZIER_CHEATS_B_forge_crown_TT:0 "Adds a new legendary crown to your inventory: +10 Diplomacy, +5 prestige per month, +25 vassal opinion and +10 general opinion. It never wears out."
 SKONESTER_CROZIER_CHEATS_B_freq_month:0 "Auto modes: check every month (default)"
 SKONESTER_CROZIER_CHEATS_B_freq_month_TT:0 "Auto modes and toggle upkeep run every 30 days. This is the default. Takes effect after the next check."
 SKONESTER_CROZIER_CHEATS_B_freq_quarter:0 "Auto modes: check every quarter"
 SKONESTER_CROZIER_CHEATS_B_freq_quarter_TT:0 "Auto modes and toggle upkeep run every 90 days. Lighter on game performance. Takes effect after the next check."
 SKONESTER_CROZIER_CHEATS_B_freq_week:0 "Auto modes: check every week"
 SKONESTER_CROZIER_CHEATS_B_freq_week_TT:0 "Auto modes and toggle upkeep run every 7 days. Takes effect after the next check."
 SKONESTER_CROZIER_CHEATS_B_gold:0 "Add gold: 1,000 / 10,000 / 100,000"
 SKONESTER_CROZIER_CHEATS_B_gold_TT:0 "Adds gold to your treasury.\nAmount depends on the Amounts setting at the top of Skonester Cheats: Low 1,000, Medium 10,000, High 100,000."
 SKONESTER_CROZIER_CHEATS_B_gold_double:0 "Double my gold"
 SKONESTER_CROZIER_CHEATS_B_gold_double_TT:0 "Adds as much gold as you have right now. Does nothing while you are in debt."
 SKONESTER_CROZIER_CHEATS_B_good_traits_me:0 "Give me the best congenital traits"
 SKONESTER_CROZIER_CHEATS_B_good_traits_me_TT:0 "Adds Genius, Beautiful, Herculean, Strong, Shrewd, Fecund and Pure-blooded."
 SKONESTER_CROZIER_CHEATS_B_gp_complete:0 "Finish all my great projects"
 SKONESTER_CROZIER_CHEATS_B_gp_complete_TT:0 "Every great project you own is completed immediately, with no contributions needed."
 SKONESTER_CROZIER_CHEATS_B_grandeur_max:0 "Court grandeur to maximum"
 SKONESTER_CROZIER_CHEATS_B_grandeur_max_TT:0 "Sets your court grandeur to 100. Only works if you have a royal court."
 SKONESTER_CROZIER_CHEATS_B_health_OFF:0 "OFF  ·  Health +50 × strength"
 SKONESTER_CROZIER_CHEATS_B_health_ON:0 "ON  ·  Health +50 × strength"
 SKONESTER_CROZIER_CHEATS_B_health_TT:0 "Adds +50 health per strength step. Normal health is single digits, so even ×1 means you will practically never die of poor health.\nStrength is the multiplier picked at the top of the panel when you turn this on. To change it later, turn the toggle off, pick a new strength, and turn it on again.\nIf you switch to another character, the bonus moves to them at the next auto-mode check."
 SKONESTER_CROZIER_CHEATS_B_immortal_player_OFF:0 "OFF  ·  Immortal: no death from old age"
 SKONESTER_CROZIER_CHEATS_B_immortal_player_ON:0 "ON  ·  Immortal: no death from old age"
 SKONESTER_CROZIER_CHEATS_B_immortal_player_TT:0 "Gives you the game's Immortal trait: you stop aging visually and cannot die of old age. You can still be murdered, executed, killed in battle or by events. It also cures the age ailments Withering Mind, Clouded Eyes, Faltering Heart, Fragile Bones and Infirm, and if you are older than 25 your appearance is frozen at 25 (your listed age still counts up).\nTurning this off removes the trait again, but only if this toggle added it.\nIf you switch to another character, the bonus moves to them at the next auto-mode check."
 SKONESTER_CROZIER_CHEATS_B_income_OFF:0 "OFF  ·  Income +400% × strength"
 SKONESTER_CROZIER_CHEATS_B_income_ON:0 "ON  ·  Income +400% × strength"
 SKONESTER_CROZIER_CHEATS_B_income_TT:0 "Raises all your monthly income by +400% per strength step (×1 = five times your normal income).\nStrength is the multiplier picked at the top of the panel when you turn this on. To change it later, turn the toggle off, pick a new strength, and turn it on again.\nIf you switch to another character, the bonus moves to them at the next auto-mode check."
 SKONESTER_CROZIER_CHEATS_B_income_year:0 "Get one year of income now"
 SKONESTER_CROZIER_CHEATS_B_income_year_TT:0 "Instantly adds gold equal to your current yearly income. Your normal income is not affected."
 SKONESTER_CROZIER_CHEATS_B_influence_OFF:0 "OFF  ·  Influence +5 per month × strength"
 SKONESTER_CROZIER_CHEATS_B_influence_ON:0 "ON  ·  Influence +5 per month × strength"
 SKONESTER_CROZIER_CHEATS_B_influence_TT:0 "You gain +5 influence every month per strength step. Influence is only used by administrative governments.\nStrength is the multiplier picked at the top of the panel when you turn this on. To change it later, turn the toggle off, pick a new strength, and turn it on again.\nIf you switch to another character, the bonus moves to them at the next auto-mode check."
 SKONESTER_CROZIER_CHEATS_B_innovation_OFF:0 "OFF  ·  Innovation speed +100% × strength"
 SKONESTER_CROZIER_CHEATS_B_innovation_ON:0 "ON  ·  Innovation speed +100% × strength"
 SKONESTER_CROZIER_CHEATS_B_innovation_TT:0 "Your culture discovers innovations +100% faster per strength step. Only works while you are the head of your culture.\nStrength is the multiplier picked at the top of the panel when you turn this on. To change it later, turn the toggle off, pick a new strength, and turn it on again.\nIf you switch to another character, the bonus moves to them at the next auto-mode check."
 SKONESTER_CROZIER_CHEATS_B_instant_empire:0 "Instant empire"
 SKONESTER_CROZIER_CHEATS_B_instant_empire_TT:0 "In order: all unclaimed duchy, kingdom and empire titles over your counties are created for you; you get a new empire title if you have none; independent rulers inside your de jure lands and all neighboring independent rulers swear fealty to you, if they rank below you; you take every de jure county of your duchies and higher titles (creating any further titles that unlocks); all levels go to maximum."
 SKONESTER_CROZIER_CHEATS_B_legend_spread_OFF:0 "OFF  ·  Legend spread +100% × strength"
 SKONESTER_CROZIER_CHEATS_B_legend_spread_ON:0 "ON  ·  Legend spread +100% × strength"
 SKONESTER_CROZIER_CHEATS_B_legend_spread_TT:0 "Legends you own spread +100% faster per strength step.\nStrength is the multiplier picked at the top of the panel when you turn this on. To change it later, turn the toggle off, pick a new strength, and turn it on again.\nIf you switch to another character, the bonus moves to them at the next auto-mode check."
 SKONESTER_CROZIER_CHEATS_B_legit_gain_OFF:0 "OFF  ·  Legitimacy +1 per month, gain +100% × strength"
 SKONESTER_CROZIER_CHEATS_B_legit_gain_ON:0 "ON  ·  Legitimacy +1 per month, gain +100% × strength"
 SKONESTER_CROZIER_CHEATS_B_legit_gain_TT:0 "You gain +1 legitimacy every month, and all legitimacy you earn is increased by +100%, per strength step.\nStrength is the multiplier picked at the top of the panel when you turn this on. To change it later, turn the toggle off, pick a new strength, and turn it on again.\nIf you switch to another character, the bonus moves to them at the next auto-mode check."
 SKONESTER_CROZIER_CHEATS_B_legit_level:0 "Legitimacy +1 level"
 SKONESTER_CROZIER_CHEATS_B_legit_level_TT:0 "Raises your legitimacy by one level. Only works if your character uses legitimacy (rulers do; most unlanded characters do not)."
 SKONESTER_CROZIER_CHEATS_B_levels_max_all:0 "All levels to maximum"
 SKONESTER_CROZIER_CHEATS_B_levels_max_all_TT:0 "Prestige level and piety level to 5, legitimacy +5 levels if your character uses legitimacy, and court grandeur to 100 if you have a royal court."
 SKONESTER_CROZIER_CHEATS_B_levy_OFF:0 "OFF  ·  Levy size +100% × strength"
 SKONESTER_CROZIER_CHEATS_B_levy_ON:0 "ON  ·  Levy size +100% × strength"
 SKONESTER_CROZIER_CHEATS_B_levy_TT:0 "All your holdings provide +100% more levies per strength step.\nStrength is the multiplier picked at the top of the panel when you turn this on. To change it later, turn the toggle off, pick a new strength, and turn it on again.\nIf you switch to another character, the bonus moves to them at the next auto-mode check."
 SKONESTER_CROZIER_CHEATS_B_life_OFF:0 "OFF  ·  Life expectancy +10 years × strength (family)"
 SKONESTER_CROZIER_CHEATS_B_life_ON:0 "ON  ·  Life expectancy +10 years × strength (family)"
 SKONESTER_CROZIER_CHEATS_B_life_TT:0 "You, your spouses and your children get +10 years of life expectancy per strength step.\nStrength is the multiplier picked at the top of the panel when you turn this on. To change it later, turn the toggle off, pick a new strength, and turn it on again.\nIf you switch to another character, the bonus moves to them at the next auto-mode check."
 SKONESTER_CROZIER_CHEATS_B_lifestyle_xp_OFF:0 "OFF  ·  Lifestyle experience +100% × strength"
 SKONESTER_CROZIER_CHEATS_B_lifestyle_xp_ON:0 "ON  ·  Lifestyle experience +100% × strength"
 SKONESTER_CROZIER_CHEATS_B_lifestyle_xp_TT:0 "Your lifestyle experience grows +100% faster per strength step, so you unlock perks sooner.\nStrength is the multiplier picked at the top of the panel when you turn this on. To change it later, turn the toggle off, pick a new strength, and turn it on again.\nIf you switch to another character, the bonus moves to them at the next auto-mode check."
 SKONESTER_CROZIER_CHEATS_B_lifestyle_xp_all:0 "Lifestyle experience: 500 / 2,000 / 10,000 each"
 SKONESTER_CROZIER_CHEATS_B_lifestyle_xp_all_TT:0 "Adds experience to all six lifestyles (Diplomacy, Martial, Stewardship, Intrigue, Learning, Wanderer).\nAmount depends on the Amounts setting at the top of Skonester Cheats: Low 500, Medium 2,000, High 10,000 per lifestyle."
 SKONESTER_CROZIER_CHEATS_B_long_reign_OFF:0 "OFF  ·  Long reign bonus +100% × strength"
 SKONESTER_CROZIER_CHEATS_B_long_reign_ON:0 "ON  ·  Long reign bonus +100% × strength"
 SKONESTER_CROZIER_CHEATS_B_long_reign_TT:0 "The bonus you get for ruling a long time builds up +100% faster per strength step.\nStrength is the multiplier picked at the top of the panel when you turn this on. To change it later, turn the toggle off, pick a new strength, and turn it on again.\nIf you switch to another character, the bonus moves to them at the next auto-mode check."
 SKONESTER_CROZIER_CHEATS_B_me_cure:0 "Remove my defects"
 SKONESTER_CROZIER_CHEATS_B_me_cure_TT:0 "Removes congenital and acquired defects: blind, one-eyed, disfigured, maimed, stuttering, clubfooted, hunchbacked, dwarf, inbred, wheezing, bleeder, spindly, scaly, albino, weak, dull, low intellect, ugliness, poor physique, infertile, depressed, lunatic, possessed, leper, sickly, infirm and incapable."
 SKONESTER_CROZIER_CHEATS_B_me_fit:0 "Normal weight"
 SKONESTER_CROZIER_CHEATS_B_me_fit_TT:0 "Sets your weight to normal and keeps it there as your target, removing penalties for being fat or underweight."
 SKONESTER_CROZIER_CHEATS_B_me_heal_all:0 "Cure my diseases and wounds"
 SKONESTER_CROZIER_CHEATS_B_me_heal_all_TT:0 "Removes every disease (illness, pneumonia, plague, smallpox, cancer, consumption, great pox, typhus, dysentery, measles, leprosy, gout and others), all wounds and Incapable."
 SKONESTER_CROZIER_CHEATS_B_me_immortal_trait:0 "Make me immortal (permanent)"
 SKONESTER_CROZIER_CHEATS_B_me_immortal_trait_TT:0 "Gives you the Immortal trait permanently. Unlike the Immortal toggle above, turning off toggles will not remove it. It also cures the age ailments Withering Mind, Clouded Eyes, Faltering Heart, Fragile Bones and Infirm, and if you are older than 25 your appearance is frozen at 25 (your listed age still counts up)."
 SKONESTER_CROZIER_CHEATS_B_me_take_culture:0 "Adopt their culture (me only)"
 SKONESTER_CROZIER_CHEATS_B_me_take_culture_TT:0 "You personally adopt the target's culture. Your lands do not change."
 SKONESTER_CROZIER_CHEATS_B_me_take_faith:0 "Adopt their faith (me only)"
 SKONESTER_CROZIER_CHEATS_B_me_take_faith_TT:0 "You personally adopt the target's faith. Your lands do not change."
 SKONESTER_CROZIER_CHEATS_B_me_young:0 "Make me 25"
 SKONESTER_CROZIER_CHEATS_B_me_young_TT:0 "If you are older than 25, your age is set to 25."
 SKONESTER_CROZIER_CHEATS_B_merit_gain_OFF:0 "OFF  ·  Merit gain +100% × strength"
 SKONESTER_CROZIER_CHEATS_B_merit_gain_ON:0 "ON  ·  Merit gain +100% × strength"
 SKONESTER_CROZIER_CHEATS_B_merit_gain_TT:0 "You earn merit +100% faster per strength step. Merit is only used by administrative governments.\nStrength is the multiplier picked at the top of the panel when you turn this on. To change it later, turn the toggle off, pick a new strength, and turn it on again.\nIf you switch to another character, the bonus moves to them at the next auto-mode check."
 SKONESTER_CROZIER_CHEATS_B_monthly_gold_OFF:0 "OFF  ·  Gold +10 per month × strength"
 SKONESTER_CROZIER_CHEATS_B_monthly_gold_ON:0 "ON  ·  Gold +10 per month × strength"
 SKONESTER_CROZIER_CHEATS_B_monthly_gold_TT:0 "Adds a flat +10 gold to your monthly income per strength step (×1 = +10, ×100 = +1,000, ×1000 = +10,000).\nStrength is the multiplier picked at the top of the panel when you turn this on. To change it later, turn the toggle off, pick a new strength, and turn it on again.\nIf you switch to another character, the bonus moves to them at the next auto-mode check."
 SKONESTER_CROZIER_CHEATS_B_perks_all:0 "Unlock every perk"
 SKONESTER_CROZIER_CHEATS_B_perks_all_TT:0 "Unlocks all 162 lifestyle perks at once."
 SKONESTER_CROZIER_CHEATS_B_piety_OFF:0 "OFF  ·  Piety +100 per month × strength"
 SKONESTER_CROZIER_CHEATS_B_piety_ON:0 "ON  ·  Piety +100 per month × strength"
 SKONESTER_CROZIER_CHEATS_B_piety_TT:0 "You gain +100 piety every month per strength step.\nStrength is the multiplier picked at the top of the panel when you turn this on. To change it later, turn the toggle off, pick a new strength, and turn it on again.\nIf you switch to another character, the bonus moves to them at the next auto-mode check."
 SKONESTER_CROZIER_CHEATS_B_piety_add:0 "Add piety: 1,000 / 10,000 / 100,000"
 SKONESTER_CROZIER_CHEATS_B_piety_add_TT:0 "Adds piety.\nAmount depends on the Amounts setting at the top of Skonester Cheats: Low 1,000, Medium 10,000, High 100,000."
 SKONESTER_CROZIER_CHEATS_B_piety_level_max:0 "Piety level to maximum"
 SKONESTER_CROZIER_CHEATS_B_piety_level_max_TT:0 "Sets your piety level to the highest level (5)."
 SKONESTER_CROZIER_CHEATS_B_play_heir:0 "Play as my heir now"
 SKONESTER_CROZIER_CHEATS_B_play_heir_TT:0 "You switch to playing your heir. Your current character stays alive and is controlled by the AI. Use Return to my previous character to switch back."
 SKONESTER_CROZIER_CHEATS_B_play_prev:0 "Return to my previous character"
 SKONESTER_CROZIER_CHEATS_B_play_prev_TT:0 "Switches you back to the character you played before using Play as my heir or Play as this character. Only works if that character is still alive."
 SKONESTER_CROZIER_CHEATS_B_prestige_OFF:0 "OFF  ·  Prestige +100 per month × strength"
 SKONESTER_CROZIER_CHEATS_B_prestige_ON:0 "ON  ·  Prestige +100 per month × strength"
 SKONESTER_CROZIER_CHEATS_B_prestige_TT:0 "You gain +100 prestige every month per strength step.\nStrength is the multiplier picked at the top of the panel when you turn this on. To change it later, turn the toggle off, pick a new strength, and turn it on again.\nIf you switch to another character, the bonus moves to them at the next auto-mode check."
 SKONESTER_CROZIER_CHEATS_B_prestige_add:0 "Add prestige: 1,000 / 10,000 / 100,000"
 SKONESTER_CROZIER_CHEATS_B_prestige_add_TT:0 "Adds prestige.\nAmount depends on the Amounts setting at the top of Skonester Cheats: Low 1,000, Medium 10,000, High 100,000."
 SKONESTER_CROZIER_CHEATS_B_prestige_level_max:0 "Prestige level to maximum"
 SKONESTER_CROZIER_CHEATS_B_prestige_level_max_TT:0 "Sets your prestige level to the highest level (5)."
 SKONESTER_CROZIER_CHEATS_B_prestige_mult_OFF:0 "OFF  ·  Prestige and piety gain +100% × strength"
 SKONESTER_CROZIER_CHEATS_B_prestige_mult_ON:0 "ON  ·  Prestige and piety gain +100% × strength"
 SKONESTER_CROZIER_CHEATS_B_prestige_mult_TT:0 "All prestige and piety you earn is increased by +100% per strength step.\nStrength is the multiplier picked at the top of the panel when you turn this on. To change it later, turn the toggle off, pick a new strength, and turn it on again.\nIf you switch to another character, the bonus moves to them at the next auto-mode check."
 SKONESTER_CROZIER_CHEATS_B_realm_take_culture:0 "Convert my counties to their culture"
 SKONESTER_CROZIER_CHEATS_B_realm_take_culture_TT:0 "Your counties switch to the target's culture.\nUses the Applies to setting at the top of Skonester Cheats: only counties you hold yourself, or your whole realm including vassals."
 SKONESTER_CROZIER_CHEATS_B_realm_take_faith:0 "Convert my counties to their faith"
 SKONESTER_CROZIER_CHEATS_B_realm_take_faith_TT:0 "Your counties switch to the target's faith.\nUses the Applies to setting at the top of Skonester Cheats: only counties you hold yourself, or your whole realm including vassals."
 SKONESTER_CROZIER_CHEATS_B_renown_OFF:0 "OFF  ·  Dynasty renown +5 per month × strength"
 SKONESTER_CROZIER_CHEATS_B_renown_ON:0 "ON  ·  Dynasty renown +5 per month × strength"
 SKONESTER_CROZIER_CHEATS_B_renown_TT:0 "Your dynasty gains +5 renown every month per strength step.\nStrength is the multiplier picked at the top of the panel when you turn this on. To change it later, turn the toggle off, pick a new strength, and turn it on again.\nIf you switch to another character, the bonus moves to them at the next auto-mode check."
 SKONESTER_CROZIER_CHEATS_B_renown_mult_OFF:0 "OFF  ·  Renown gain +100% × strength"
 SKONESTER_CROZIER_CHEATS_B_renown_mult_ON:0 "ON  ·  Renown gain +100% × strength"
 SKONESTER_CROZIER_CHEATS_B_renown_mult_TT:0 "All renown your dynasty earns is increased by +100% per strength step.\nStrength is the multiplier picked at the top of the panel when you turn this on. To change it later, turn the toggle off, pick a new strength, and turn it on again.\nIf you switch to another character, the bonus moves to them at the next auto-mode check."
 SKONESTER_CROZIER_CHEATS_B_skills_OFF:0 "OFF  ·  All six skills +50 × strength"
 SKONESTER_CROZIER_CHEATS_B_skills_ON:0 "ON  ·  All six skills +50 × strength"
 SKONESTER_CROZIER_CHEATS_B_skills_TT:0 "Adds +50 to Diplomacy, Martial, Stewardship, Intrigue, Learning and Prowess per strength step.\nStrength is the multiplier picked at the top of the panel when you turn this on. To change it later, turn the toggle off, pick a new strength, and turn it on again.\nIf you switch to another character, the bonus moves to them at the next auto-mode check."
 SKONESTER_CROZIER_CHEATS_B_skills_mult_OFF:0 "OFF  ·  All six skills +50% × strength"
 SKONESTER_CROZIER_CHEATS_B_skills_mult_ON:0 "ON  ·  All six skills +50% × strength"
 SKONESTER_CROZIER_CHEATS_B_skills_mult_TT:0 "All six of your skills are increased by +50% of their current value per strength step (×2 doubles them).\nStrength is the multiplier picked at the top of the panel when you turn this on. To change it later, turn the toggle off, pick a new strength, and turn it on again.\nIf you switch to another character, the bonus moves to them at the next auto-mode check."
 SKONESTER_CROZIER_CHEATS_B_slots_OFF:0 "OFF  ·  Building slots +1 × strength"
 SKONESTER_CROZIER_CHEATS_B_slots_ON:0 "ON  ·  Building slots +1 × strength"
 SKONESTER_CROZIER_CHEATS_B_slots_TT:0 "Every holding you own gets +1 extra building slot per strength step.\nIf Applies to is set to whole realm, all your vassals get the slots too.\nStrength is the multiplier picked at the top of the panel when you turn this on. To change it later, turn the toggle off, pick a new strength, and turn it on again.\nIf you switch to another character, the bonus moves to them at the next auto-mode check."
 SKONESTER_CROZIER_CHEATS_B_stress_OFF:0 "OFF  ·  Stress gain −99%"
 SKONESTER_CROZIER_CHEATS_B_stress_ON:0 "ON  ·  Stress gain −99%"
 SKONESTER_CROZIER_CHEATS_B_stress_TT:0 "You gain only 1% of the stress you normally would. Strength has no effect on this toggle.\nIf you switch to another character, the bonus moves to them at the next auto-mode check."
 SKONESTER_CROZIER_CHEATS_B_stress_zero:0 "Remove all stress"
 SKONESTER_CROZIER_CHEATS_B_stress_zero_TT:0 "Removes all of your stress."
 SKONESTER_CROZIER_CHEATS_B_t_adopt:0 "Adopt"
 SKONESTER_CROZIER_CHEATS_B_t_adopt_TT:0 "You adopt the target as your child."
 SKONESTER_CROZIER_CHEATS_B_t_armies_to:0 "Teleport my armies to their capital"
 SKONESTER_CROZIER_CHEATS_B_t_armies_to_TT:0 "Every army of yours that is not in battle instantly moves to the target's capital province. If enemies are there, a battle starts at once."
 SKONESTER_CROZIER_CHEATS_B_t_artifact_claims:0 "Give my house claims on their artifacts"
 SKONESTER_CROZIER_CHEATS_B_t_artifact_claims_TT:0 "Your house gets a claim on every artifact the target owns."
 SKONESTER_CROZIER_CHEATS_B_t_banish:0 "Banish"
 SKONESTER_CROZIER_CHEATS_B_t_banish_TT:0 "Banishes the target from the court they are at."
 SKONESTER_CROZIER_CHEATS_B_t_bind:0 "Bind: vassal, +100 opinion and a strong hook"
 SKONESTER_CROZIER_CHEATS_B_t_bind_TT:0 "In order: the target becomes your vassal with all their lands (only if their highest title ranks below yours), gets +100 opinion of you, and you get a strong hook on them."
 SKONESTER_CROZIER_CHEATS_B_t_blackmail_all:0 "Blackmail them with every known secret"
 SKONESTER_CROZIER_CHEATS_B_t_blackmail_all_TT:0 "You get a strong blackmail hook on the target for each of their secrets you know. Use Learn all their secrets first to get the most hooks."
 SKONESTER_CROZIER_CHEATS_B_t_blind:0 "Blind"
 SKONESTER_CROZIER_CHEATS_B_t_blind_TT:0 "Gives the target the Blind trait."
 SKONESTER_CROZIER_CHEATS_B_t_child_me:0 "Make pregnant with my child"
