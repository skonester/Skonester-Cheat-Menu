 SKONESTER_CROZIER_CHEATS_B_t_take_all:0 "Take all their titles"
 SKONESTER_CROZIER_CHEATS_B_t_take_all_TT:0 "You take every county and higher title the target holds, as if conquered. Baronies go with their county. A head-of-faith title is never taken."
 SKONESTER_CROZIER_CHEATS_B_t_take_primary:0 "Take their primary title"
 SKONESTER_CROZIER_CHEATS_B_t_take_primary_TT:0 "You take the target's primary title, as if usurped."
 SKONESTER_CROZIER_CHEATS_B_t_trait_tracks_max:0 "Max out their leveled traits"
 SKONESTER_CROZIER_CHEATS_B_t_trait_tracks_max_TT:0 "Adds +100 experience to every leveled trait the target already has (Blademaster, Hunter, commander traits and others)."
 SKONESTER_CROZIER_CHEATS_B_t_tributary:0 "Make my permanent tributary"
 SKONESTER_CROZIER_CHEATS_B_t_tributary_TT:0 "The target becomes your subjugated tributary, paying you tribute. Only works if the target is an independent ruler."
 SKONESTER_CROZIER_CHEATS_B_t_tributary_free:0 "Free from tribute"
 SKONESTER_CROZIER_CHEATS_B_t_tributary_free_TT:0 "Ends the target's tributary status."
 SKONESTER_CROZIER_CHEATS_B_t_truce:0 "10-year truce with me"
 SKONESTER_CROZIER_CHEATS_B_t_truce_TT:0 "Creates a 10-year truce between you and the target in both directions, replacing any existing truce."
 SKONESTER_CROZIER_CHEATS_B_t_truce_break:0 "Break truce with me"
 SKONESTER_CROZIER_CHEATS_B_t_truce_break_TT:0 "Removes any truce between you and the target in both directions."
 SKONESTER_CROZIER_CHEATS_B_t_unexcommunicate:0 "Lift excommunication"
 SKONESTER_CROZIER_CHEATS_B_t_unexcommunicate_TT:0 "Removes the Excommunicated trait from the target."
 SKONESTER_CROZIER_CHEATS_B_t_unrel_best_friend:0 "End best friendship with me"
 SKONESTER_CROZIER_CHEATS_B_t_unrel_best_friend_TT:0 "Removes the best friend relation between you and the target."
 SKONESTER_CROZIER_CHEATS_B_t_unrel_friend:0 "End friendship with me"
 SKONESTER_CROZIER_CHEATS_B_t_unrel_friend_TT:0 "Removes the friend relation between you and the target."
 SKONESTER_CROZIER_CHEATS_B_t_unrel_lover:0 "End love affair with me"
 SKONESTER_CROZIER_CHEATS_B_t_unrel_lover_TT:0 "Removes the lover relation between you and the target."
 SKONESTER_CROZIER_CHEATS_B_t_unrel_soulmate:0 "End soulmate bond with me"
 SKONESTER_CROZIER_CHEATS_B_t_unrel_soulmate_TT:0 "Removes the soulmate relation between you and the target."
 SKONESTER_CROZIER_CHEATS_B_t_vassalize:0 "Make my vassal"
 SKONESTER_CROZIER_CHEATS_B_t_vassalize_TT:0 "The target swears fealty to you and becomes your vassal with all their lands and vassals. Only works if their highest title ranks below yours."
 SKONESTER_CROZIER_CHEATS_B_t_war_claim:0 "Declare war for their primary title"
 SKONESTER_CROZIER_CHEATS_B_t_war_claim_TT:0 "You get a pressed claim on the target's primary title and immediately declare a claim war for it. Only works if the target holds land."
 SKONESTER_CROZIER_CHEATS_B_t_young:0 "Make them 20"
 SKONESTER_CROZIER_CHEATS_B_t_young_TT:0 "If the target is older than 20, their age is set to 20."
 SKONESTER_CROZIER_CHEATS_B_target_alliance:0 "Form an alliance"
 SKONESTER_CROZIER_CHEATS_B_target_alliance_TT:0 "You and the target become allies."
 SKONESTER_CROZIER_CHEATS_B_target_court:0 "Bring to my court"
 SKONESTER_CROZIER_CHEATS_B_target_court_TT:0 "The target joins your court as a courtier."
 SKONESTER_CROZIER_CHEATS_B_target_culture:0 "Convert them to my culture"
 SKONESTER_CROZIER_CHEATS_B_target_culture_TT:0 "The target adopts your culture."
 SKONESTER_CROZIER_CHEATS_B_target_divorce:0 "Divorce from all spouses"
 SKONESTER_CROZIER_CHEATS_B_target_divorce_TT:0 "The target divorces every spouse they have."
 SKONESTER_CROZIER_CHEATS_B_target_faith:0 "Convert them to my faith"
 SKONESTER_CROZIER_CHEATS_B_target_faith_TT:0 "The target adopts your faith."
 SKONESTER_CROZIER_CHEATS_B_target_garrison:0 "Refill their garrisons"
 SKONESTER_CROZIER_CHEATS_B_target_garrison_TT:0 "Refills the garrisons of every province in the target's realm, including their vassals."
 SKONESTER_CROZIER_CHEATS_B_target_gold_add:0 "Give gold: 100 / 1,000 / 10,000"
 SKONESTER_CROZIER_CHEATS_B_target_gold_add_TT:0 "Gives the target new gold (it does not come from your treasury).\nAmount depends on the Amounts setting at the top of Skonester Cheats: Low 100, Medium 1,000, High 10,000."
 SKONESTER_CROZIER_CHEATS_B_target_gold_take:0 "Remove gold: 100 / 1,000 / 10,000"
 SKONESTER_CROZIER_CHEATS_B_target_gold_take_TT:0 "Removes gold from the target (it is destroyed, not given to you).\nAmount depends on the Amounts setting at the top of Skonester Cheats: Low 100, Medium 1,000, High 10,000."
 SKONESTER_CROZIER_CHEATS_B_target_heal:0 "Heal illness and wounds"
 SKONESTER_CROZIER_CHEATS_B_target_heal_TT:0 "Removes Ill, Pneumonia and all wounds from the target. Use Cure all their diseases and wounds for serious diseases."
 SKONESTER_CROZIER_CHEATS_B_target_heir:0 "Make my designated heir"
 SKONESTER_CROZIER_CHEATS_B_target_heir_TT:0 "Sets the target as your designated heir."
 SKONESTER_CROZIER_CHEATS_B_target_imprison:0 "Imprison in my dungeon"
 SKONESTER_CROZIER_CHEATS_B_target_imprison_TT:0 "Throws the target into your dungeon. Does nothing if they are already imprisoned."
 SKONESTER_CROZIER_CHEATS_B_target_kill:0 "Kill"
 SKONESTER_CROZIER_CHEATS_B_target_kill_TT:0 "The target dies immediately, murdered, with you recorded as the killer."
 SKONESTER_CROZIER_CHEATS_B_target_maa_empty:0 "Empty their men-at-arms"
 SKONESTER_CROZIER_CHEATS_B_target_maa_empty_TT:0 "Removes all soldiers from the target's men-at-arms regiments. The regiments stay and slowly refill as normal."
 SKONESTER_CROZIER_CHEATS_B_target_maa_resize:0 "Shrink their regiments: −1 / −2 / −5"
 SKONESTER_CROZIER_CHEATS_B_target_maa_resize_TT:0 "Every men-at-arms regiment of the target loses regiment size permanently.\nAmount depends on the Amounts setting at the top of Skonester Cheats: Low −1, Medium −2, High −5 per regiment."
 SKONESTER_CROZIER_CHEATS_B_target_marry:0 "Marry them to the second character"
 SKONESTER_CROZIER_CHEATS_B_target_marry_TT:0 "Marries the target to the remembered second character.\nFirst open the other character and press Remember as second character, then come back here."
 SKONESTER_CROZIER_CHEATS_B_target_matrilineal:0 "Marry matrilineally to the second character"
 SKONESTER_CROZIER_CHEATS_B_target_matrilineal_TT:0 "Marries the target to the remembered second character, with children joining the mother's house.\nFirst open the other character and press Remember as second character, then come back here."
 SKONESTER_CROZIER_CHEATS_B_target_pregnancy:0 "Make pregnant by the second character"
 SKONESTER_CROZIER_CHEATS_B_target_pregnancy_TT:0 "The target becomes pregnant by the remembered second character. Requires the target to be a woman of 18 or older who is not pregnant, and the second character to be a living man of 18 or older.\nFirst open the other character and press Remember as second character, then come back here."
 SKONESTER_CROZIER_CHEATS_B_target_release:0 "Release from prison"
 SKONESTER_CROZIER_CHEATS_B_target_release_TT:0 "Frees the target from whoever is holding them."
 SKONESTER_CROZIER_CHEATS_B_target_stress:0 "Add stress: 50 / 100 / 300"
 SKONESTER_CROZIER_CHEATS_B_target_stress_TT:0 "Adds stress to the target.\nAmount depends on the Amounts setting at the top of Skonester Cheats: Low 50, Medium 100, High 300."
 SKONESTER_CROZIER_CHEATS_B_target_weak:0 "All skills −100"
 SKONESTER_CROZIER_CHEATS_B_target_weak_TT:0 "Lowers all six of the target's skills by 100, which takes them to 0 in practice."
 SKONESTER_CROZIER_CHEATS_B_toasts_toggle:0 "Notifications after using cheats: on/off"
 SKONESTER_CROZIER_CHEATS_B_toasts_toggle_TT:0 "Turns the small Cheat used / Cheat on / Cheat off pop-ups on or off."
 SKONESTER_CROZIER_CHEATS_B_trait_tracks_max:0 "Max out my leveled traits"
 SKONESTER_CROZIER_CHEATS_B_trait_tracks_max_TT:0 "Adds +100 experience to every leveled trait you already have (Blademaster, Hunter, Traveler, Reveler, Mystic, Physician, Pilgrim, commander traits, tournament traits and others). Does not give you new traits."
 SKONESTER_CROZIER_CHEATS_B_travel_arrive:0 "Arrive at my destination now"
 SKONESTER_CROZIER_CHEATS_B_travel_arrive_TT:0 "If you are travelling, your current journey ends at its destination immediately."
 SKONESTER_CROZIER_CHEATS_B_travel_safe_OFF:0 "OFF  ·  Travel speed and safety +100% × strength"
 SKONESTER_CROZIER_CHEATS_B_travel_safe_ON:0 "ON  ·  Travel speed and safety +100% × strength"
 SKONESTER_CROZIER_CHEATS_B_travel_safe_TT:0 "Your journeys are +100% faster and +100% safer per strength step.\nStrength is the multiplier picked at the top of the panel when you turn this on. To change it later, turn the toggle off, pick a new strength, and turn it on again.\nIf you switch to another character, the bonus moves to them at the next auto-mode check."
 SKONESTER_CROZIER_CHEATS_B_tt_enemy_army:0 "Cripple their armies: turn on"
 SKONESTER_CROZIER_CHEATS_B_tt_enemy_army_TT:0 "The target gets a lasting modifier: army damage −95%, army toughness −95% and −100 combat advantage. Stays until you turn it off with the next button."
 SKONESTER_CROZIER_CHEATS_B_tt_enemy_health:0 "Health −3: turn on"
 SKONESTER_CROZIER_CHEATS_B_tt_enemy_health_TT:0 "The target gets a lasting −3 health modifier until you turn it off with the next button."
 SKONESTER_CROZIER_CHEATS_B_tt_enemy_money:0 "Cut their income: turn on"
 SKONESTER_CROZIER_CHEATS_B_tt_enemy_money_TT:0 "The target gets a lasting −95% monthly income modifier until you turn it off with the next button."
 SKONESTER_CROZIER_CHEATS_B_tt_enemy_speed:0 "Slow their armies: turn on"
 SKONESTER_CROZIER_CHEATS_B_tt_enemy_speed_TT:0 "The target gets a lasting −90% army movement speed modifier until you turn it off with the next button."
 SKONESTER_CROZIER_CHEATS_B_tt_off_enemy_army:0 "Cripple their armies: turn off"
 SKONESTER_CROZIER_CHEATS_B_tt_off_enemy_army_TT:0 "Removes the army-crippling modifier from the target."
 SKONESTER_CROZIER_CHEATS_B_tt_off_enemy_health:0 "Health −3: turn off"
 SKONESTER_CROZIER_CHEATS_B_tt_off_enemy_health_TT:0 "Removes the −3 health modifier from the target."
 SKONESTER_CROZIER_CHEATS_B_tt_off_enemy_money:0 "Cut their income: turn off"
 SKONESTER_CROZIER_CHEATS_B_tt_off_enemy_money_TT:0 "Removes the income modifier from the target."
 SKONESTER_CROZIER_CHEATS_B_tt_off_enemy_speed:0 "Slow their armies: turn off"
 SKONESTER_CROZIER_CHEATS_B_tt_off_enemy_speed_TT:0 "Removes the movement speed modifier from the target."
 SKONESTER_CROZIER_CHEATS_B_vassals_OFF:0 "OFF  ·  Vassal limit +100 × strength"
 SKONESTER_CROZIER_CHEATS_B_vassals_ON:0 "ON  ·  Vassal limit +100 × strength"
 SKONESTER_CROZIER_CHEATS_B_vassals_TT:0 "Raises your vassal limit by +100 per strength step.\nStrength is the multiplier picked at the top of the panel when you turn this on. To change it later, turn the toggle off, pick a new strength, and turn it on again.\nIf you switch to another character, the bonus moves to them at the next auto-mode check."
