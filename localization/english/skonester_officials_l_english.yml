 skonester_officials.9084.exempt_dynasty_off: "Revoke Dynasty Exemption"

 skonester_officials.9087.t: "Dynasty Male Single Child Restriction"
 skonester_officials.9087.desc: "#bold Within your [dynasty|E], each AI male may have at most one living child#!. Judged by living child count only: if the father already has 1 living child, the newborn is culled. Dead children do not count — after the only living child dies, another child may be kept. Applies only to dynasties with an active human player character. If the standard Single Child Rule is also active, player dynasties follow this restriction first. #bold Does not apply#! when the biological father is a human player. No effect when disabled."
 skonester_officials.9087.enable: "Enable Dynasty Male Child Limit"
