 skonester_learn_all_realm_officials_secrets_decision_confirm: "Investigate"
 skonester_learn_all_secrets_prestige_cost_desc: "Realm-Wide Inquiry"

 skonester_seduce_shield_for_consorts_decision_title_on: "#bold 【ON】#! Inner-Chamber Vigil"
 skonester_seduce_shield_for_consorts_decision_title_off: "#bold 【OFF】#! Inner-Chamber Vigil"
 skonester_seduce_shield_for_consorts_decision_desc_on: "Vigil is active. Outsiders may not seduce your consorts, and your consorts may not seduce others (including AI), except towards you. Universal Rules: All AI are barred from Seduction, Courtship and Elopement; extramarital lover ties for married AI are cleared daily. Daily Effects: Refreshes Chaste and Loyal traits; ends all incoming and outgoing romance, abduction and elopement schemes involving your household; removes lover bonds to anyone other than yourself. A yearly trait refresh acts as additional backup. Click to disable."
 skonester_seduce_shield_for_consorts_decision_desc_off: "Vigil is inactive. New campaigns enable the vigil by default until manually disabled, after which it remains off. When active, consorts are protected from seduction, global AI romance restrictions apply, hostile schemes are cleared daily and unrelated lover bonds are removed. Chaste and Loyal traits receive daily and yearly refreshes."
 skonester_seduce_shield_for_consorts_decision_tooltip_on: "Vigil is active. Click to disable."
 skonester_seduce_shield_for_consorts_decision_tooltip_off: "Vigil is inactive. Click to enable."
 skonester_seduce_shield_for_consorts_decision_confirm_disable: "Disable Vigil"
 skonester_seduce_shield_for_consorts_decision_confirm_enable: "Enable Vigil"

