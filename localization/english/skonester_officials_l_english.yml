 skonester_boost_world_ai_rulers_decision: "Empower All Independent AI Realms"
 skonester_boost_world_ai_rulers_decision_desc: "Bestow full military, economic and diplomatic buffs to all landed AI lords to fuel expansion and warfare. If the player becomes overwhelmingly dominant, AI nations are far more prone to form coalitions against your hegemony for balanced gameplay."
