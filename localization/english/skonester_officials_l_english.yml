 trait_warlord_god: "God of a Hundred Battles"
 trait_warlord_god_desc: "#bold Cheat Trait#! for commanders. Greatly increases [martial|e] and #bold Prowess#! ($game_concept_prowess$). Raises #bold knight#! limits and battlefield effectiveness, boosts #bold army#! damage, toughness and #bold siege#! strength. Grants higher base #bold Dread#!, accelerates #bold levy#! replenishment and cuts #bold army upkeep#!. Movement and terrain bonuses are granted via personality modifiers. #bold Non-heritable#!. Excluded from Ruler Designer and random trait pools. Does not grant an unbeatable combat flag. Can be applied by right-clicking a character in the Skonester main menu, or via command: #bold add_trait = warlord_god#!. This trait stacks separately with #bold Celestial Immortal#!. Icon: #bold Golden Helm & Crossed Swords#! ([commander|e] theme)."

