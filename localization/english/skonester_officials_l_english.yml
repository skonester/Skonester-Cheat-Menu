 skonester_cheat_menu_same_house_interaction: "Unite Under Your House"
 skonester_cheat_menu_same_house_interaction_desc: "Move this character into your dynasty and noble house, sharing your family name. Does not alter parentage. Requires you to lead a dynasty and house. Hidden automatically if they already belong to your house."

