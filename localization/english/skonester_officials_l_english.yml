 skonester_seduce_blocked_player_consort_tt: "While Inner-Chamber Vigil is #bold enabled#!, #bold all characters including AI#! cannot launch a Seduce [scheme|E] against your spouses and concubines. Exceptions apply only if the spouse or their liege is the scheme's initiator or target. Each day, all ongoing romance, abduction and elopement schemes targeting household members are terminated, and lover bonds between household members and non-rulers are broken. This setting defaults to enabled on new campaigns; once disabled manually, it will no longer reactivate automatically."
 skonester_seduce_blocked_harem_outgoing_tt: "While Inner-Chamber Vigil is enabled, your spouses and concubines #bold cannot#! initiate Seduce [scheme|E] against others (including #bold AI#!), save for seducing you. The vigil also terminates all outward romance, abduction and elopement schemes started by your consorts each day."

 skonester_learn_all_realm_officials_secrets_decision: "Realm-Wide Inquisition"
