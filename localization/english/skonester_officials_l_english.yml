 skonester_cheat_menu_force_pregnancy_interaction: "Force Pregnancy"
 skonester_cheat_menu_force_pregnancy_interaction_desc: "Target any living female character other than yourself. If she is not your spouse, lover, soulmate or concubine, she will become pregnant with you as the biological father. This pregnancy will be treated as an unknown bastard, with her current spouse listed as the presumed father if available, lowering the risk of adultery exposure. If she is your spouse, lover, soulmate or concubine, you will be listed as both biological and presumed father. This action ignores fertility restrictions and will not create lover relations or adultery secrets. Minors and characters who cannot become pregnant will not be affected."
 skonester_cheat_menu_pregnancy_manage_interaction: "Pregnancy Management"
 skonester_cheat_menu_pregnancy_manage_interaction_desc: "Adjust pregnancy status for the target character."
 skonester_cheat_menu_relation_confirm_interaction: "Verify Family Relation"
 skonester_cheat_menu_relation_confirm_interaction_desc: "Confirm existing family ties between characters."
 skonester_cheat_menu_add_concubine_interaction: "Take Concubine"
 skonester_cheat_menu_add_concubine_interaction_desc: "Appoint the target as your concubine."
 skonester_cheat_menu_join_court_interaction: "Recruit to Court"
 skonester_cheat_menu_join_court_interaction_desc: "Force a landless character to join your court."
 skonester_cheat_menu_make_my_vassal_interaction: "Make Direct Vassal"
 skonester_cheat_menu_make_my_vassal_interaction_desc: "Force the target to swear fealty and become your direct vassal. Works for all landed rulers, whether AI or player. Has no effect if they are already your direct vassal. Both you and the target must hold land. Their primary title tier cannot exceed yours, and they cannot be your liege or sit above you in the vassal chain. Certain government types, tributary status and other game rules may still block this action."
 skonester_cheat_menu_declare_war_interaction: "Declare War"
 skonester_cheat_menu_declare_war_interaction_desc: "Launch war against an independent ruler. Choose to force them into tributary status or conquer their entire realm. Existing truces will be cleared beforehand, and no new truce will be created after the war."
 skonester_cheat_menu_war_cb_tributary: "Force Tributary"
 skonester_cheat_menu_war_cb_conquer_realm: "Conquer Entire Realm"
