 skonester_officials.9084.t: "Single Child Rule & Dynasty Protection"
 skonester_officials.9084.desc: "#bold Single Child Rule#!: applies to all AI fathers. Judged by living child count — if the father already has 1 living child, the newborn is culled. Dead children do not count; after the only living child dies, another child may be kept. Only AI children of AI fathers are culled; human player fathers are exempt. Optional dynasty protection excludes the player dynasty. Mutually exclusive with Dynasty Male Single Child Restriction."
