### --- X-Entscheidungen ---
 X1_decision_title:0 "Den Weg der Tapferkeit beschreiten"
 X1_decision_desc:0 "Die Stimme der Ehre und der Ritterlichkeit ruft nach mir. Mit dieser Entscheidung soll mein Name als der eines edlen und tugendhaften Ritters in Erinnerung bleiben."
 X1_decision_confirm:0 "So möge sich meine Tapferkeit beweisen."

 X_build_title:0 "Große Bauwerke errichten"
 X_build_desc:0 "Die Felder liegen brach und das Volk verlangt nach Brot und Schutz. Durch Stein und Holz soll mein Reich erstarken."
 X_build_confirm:0 "Ruft die Baumeister und Verwalter."

 X_city_title:0 "Eine Stadt gründen"
 X_city_desc:0 "Wo heute Wildnis und kleine Weiler liegen, soll eine blühende Handelsstadt entstehen. Kaufleute werden herbeiströmen und Zünfte unter meinem Banner gedeihen."
 X_city_confirm:0 "Die Stadt soll errichtet werden."

 X_temple_title:0 "Ein Gotteshaus errichten"
 X_temple_desc:0 "Die Gläubigen sehnen sich nach einem Ort des Gebets, an dem Glockenklang zum Himmel aufsteigt. Auf meinen Befehl soll ein Tempel entstehen."
 X_temple_confirm:0 "Weiht diesen Boden."

 X_castle_title:0 "Eine Burg errichten"
 X_castle_desc:0 "Nichts festigt die Herrschaft eines Fürsten mehr als Mauern aus Stein. Eine mächtige Burg soll entstehen – Bollwerk meiner Macht und Sitz meines Hauses."
 X_castle_confirm:0 "Errichtet die Festung."

 X_unify_title:0 "Das Reich in Glauben und Kultur vereinen"
 X_unify_desc:0 "Meine Vasallen unterscheiden sich in Sprache, Glauben und Brauchtum. Doch unter einem Banner sollen Blut, Glaube und Sitten vereint werden."
 X_unify_confirm:0 "Ein Reich, ein Glaube, eine Kultur."