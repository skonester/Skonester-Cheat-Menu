 sarc_char_design.dyn.choice.event.t:1 "Dynastie-Auswahl"
 sarc_char_design.dyn.choice.event.d:0 "Wähle, ob deine Dynastiemitglieder getötet oder lediglich teilweise enterbt werden sollen.\n\nDies dient dazu, sicherzustellen, dass dein Charakter die Titel des Herrschers erbt.\n\nDas Töten der Dynastiemitglieder vermittelt das Gefühl, eine nahezu ausgestorbene Dynastie neu aufzubauen, während durch das Enterben die Dynastie größtenteils erhalten bleibt.\n\nFür Mehrspielerpartien empfehle ich die Enterbungsoption, damit das Auslöschen der Dynastie keine Auswirkungen auf andere Spieler hat."

