 sarc_char_design.1001.t:1 "Charakterdesigner"
 sarc_char_design.1001.desc.5:0 "Möchtest du einen eigenen Herrscher erstellen? (WARNUNG: Deine unmittelbare Dynastie wird ausgelöscht oder enterbt, und dein derzeitiger Herrscher stirbt nach Abschluss der Erstellung.) (Nach der Auswahl des Alters beginnt dein Charakter mit 5 Punkten in allen Fertigkeiten. Der erstellte Charakter wird als Sohn deines derzeitigen Herrschers eingesetzt.)"
 sarc_char_design.1001.desc.10:0 "Möchtest du einen eigenen Herrscher erstellen? (WARNUNG: Deine unmittelbare Dynastie wird ausgelöscht oder enterbt, und dein derzeitiger Herrscher stirbt nach Abschluss der Erstellung.) (Nach der Auswahl des Alters beginnt dein Charakter mit 10 Punkten in allen Fertigkeiten. Der erstellte Charakter wird als Sohn deines derzeitigen Herrschers eingesetzt.)"

 sarc_char_design.1002.t:1 "Altersgruppe"
 sarc_char_design.1002.desc:0 "Wähle die Altersgruppe deines eigenen Charakters. Es können nur Altersstufen gewählt werden, die unter dem Alter des derzeitigen Herrschers liegen."

 sarc_char_design.age.event.t:1 "Alter"
 sarc_char_design.age.event.d:0 "Wähle das Alter deines eigenen Charakters."

 sarc_char_design.skill.event.t:1 "Fertigkeiten"
 sarc_char_design.skill.event.d.5:0 "Wähle eine Fertigkeit aus, um ihren Wert zu verändern. Alle Fertigkeiten deines eigenen Charakters beginnen bei 5. Änderungen werden erst nach einem Tag vollständig angezeigt. Du kannst den Mauszeiger über den Fertigkeitswert im Charakterfenster bewegen, um den tatsächlichen Wert zu sehen."
 sarc_char_design.skill.event.d.10:0 "Wähle eine Fertigkeit aus, um ihren Wert zu verändern. Alle Fertigkeiten deines eigenen Charakters beginnen bei 10. Änderungen werden erst nach einem Tag vollständig angezeigt. Du kannst den Mauszeiger über den Fertigkeitswert im Charakterfenster bewegen, um den tatsächlichen Wert zu sehen."

