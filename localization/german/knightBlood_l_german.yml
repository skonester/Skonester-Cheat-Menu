 # --- Katze ---
 trait_blood_ancester_1:0 "Katzenhafte Anmut"
 trait_blood_ancester_1_desc:0 "Diese Person stammt von einem legendären Ritter ab, der einen Pakt mit einer Großen Katze schloss. Das Blut in ihren Adern trägt die Macht dieses Ahnen in sich – die Eleganz der Katze."
 trait_blood_ancester_1_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] stammt von einem legendären Ritter ab, der einen Pakt mit einer Großen Katze schloss. Das Blut in ihren Adern trägt noch immer die Macht dieses Ahnen."

 # --- Hund ---
 trait_blood_ancester_2:0 "Treuer Hund"
 trait_blood_ancester_2_desc:0 "Diese Person stammt von einem legendären Ritter ab, der sich mit dem großen Hachikō verband. Das Blut in ihren Adern trägt die Macht dieses Ahnen – die unerschütterliche Treue des Hundes."
 trait_blood_ancester_2_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] stammt von einem legendären Ritter ab, der sich mit dem großen Hachikō verband. Das Blut in ihren Adern trägt noch immer die Macht dieses Ahnen."

 # --- Mond ---
 trait_blood_ancester_4:0 "Mondlicht"
 trait_blood_ancester_4_desc:0 "Diese Person stammt von einem legendären Ritter ab, der vom Silbernen Mond gesegnet wurde. Das Blut in ihren Adern trägt die Macht ihrer Ahnen – klar und rein wie das Mondlicht."
 trait_blood_ancester_4_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] stammt von einem legendären Ritter ab, der vom Silbernen Mond gesegnet wurde. Das Blut in ihren Adern trägt noch immer die Macht dieses Ahnen."

 # --- Wind ---
 trait_blood_ancester_7:0 "Windläufer"
 trait_blood_ancester_7_desc:0 "Diese Person stammt von einem legendären Ritter ab, der mit den Engeln des Windes tanzte. Das Blut in ihren Adern trägt die Macht ihrer Ahnen – Geschwindigkeit und Freiheit."
 trait_blood_ancester_7_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] stammt von einem legendären Ritter ab, der mit den Engeln des Windes tanzte. Das Blut in ihren Adern trägt noch immer die Macht dieses Ahnen."

 # --- Wildschwein ---
 trait_blood_ancester_5:0 "Wildschwein"
 trait_blood_ancester_5_desc:0 "Diese Person stammt von einem legendären Ritter ab, der den Geist eines wilden Ebers in sich trug. Das Blut in ihren Adern trägt die Macht ihrer Ahnen – unbändigen Ansturm und Zerstörung."
 trait_blood_ancester_5_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] stammt von einem legendären Ritter ab, der den Geist eines wilden Ebers in sich trug. Das Blut in ihren Adern trägt noch immer die Macht dieses Ahnen."

 # --- Dunkelheit ---
 trait_blood_ancester_6:0 "Dunkle Nacht"
 trait_blood_ancester_6_desc:0 "Diese Person stammt von einem legendären Ritter ab, der vom Herrn der Nacht gesegnet wurde. Das Blut in ihren Adern trägt die Macht ihrer Ahnen – die Allgegenwart der Schatten."
 trait_blood_ancester_6_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] stammt von einem legendären Ritter ab, der vom Herrn der Nacht gesegnet wurde. Das Blut in ihren Adern trägt noch immer die Macht dieses Ahnen."

 # --- Venus/Hoffnung ---
 trait_blood_ancester_8:0 "Venus"
 trait_blood_ancester_8_desc:0 "Diese Person stammt von einem legendären Ritter ab, der selbst in tiefster Finsternis nach dem Licht suchte und der Verzweiflung trotzte. Das Blut in ihren Adern trägt die Macht ihrer Ahnen – Hoffnung inmitten des Untergangs."
 trait_blood_ancester_8_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] stammt von einem legendären Ritter ab, der selbst in der Dunkelheit nach dem Licht suchte. Das Blut in ihren Adern trägt noch immer die Macht dieses Ahnen."

 # --- Narr ---
 trait_blood_ancester_9:0 "Narr"
 trait_blood_ancester_9_desc:0 "Diese Person stammt von einem legendären Ritter ab, der von der Welt betrogen wurde und dennoch beschloss, anderen ein Lächeln zu schenken. Das Blut in ihren Adern trägt die Macht ihrer Ahnen – den Spott über die Liebe."
 trait_blood_ancester_9_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] stammt von einem legendären Ritter ab, der von der Welt betrogen wurde und sich dennoch sein Lächeln bewahrte. Das Blut in ihren Adern trägt noch immer die Macht dieses Ahnen."

 # --- Rabe ---
 trait_blood_ancester_10:0 "Rabe"
 trait_blood_ancester_10_desc:0 "Diese Person stammt von einem legendären Ritter ab, der zum Vogel der Weisheit betete, um den Tod vorherzusehen. Das Blut in ihren Adern trägt die Macht ihrer Ahnen – Weisheit, geboren aus dem Unglück."
 trait_blood_ancester_10_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] stammt von einem legendären Ritter ab, der zum Vogel der Weisheit betete. Das Blut in ihren Adern trägt noch immer die Macht dieses Ahnen."

 # --- Drache ---
 trait_blood_ancester_11:0 "Silberdrache"
 trait_blood_ancester_11_desc:0 "Diese Person stammt von einem legendären Ritter ab, der ein Tabu gegen den Großen Silberdrachen brach. Das Blut in ihren Adern trägt die Macht ihrer Ahnen – den Atem des Drachen."
 trait_blood_ancester_11_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] stammt von einem legendären Ritter ab, der ein Tabu gegen den Großen Silberdrachen brach. Das Blut in ihren Adern trägt noch immer die Macht dieses Ahnen."

 # --- Kampfkunst ---
 trait_blood_art_1:0 "Taiji"
 trait_blood_art_1_desc:0 "Seit seiner Kindheit wurde diese Person stark von ihrem Großvater geprägt und erlernte durch Beobachtung und Übung eine große Kampfkunst aus dem Fernen Osten – Taiji."
 trait_blood_art_1_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] wurde seit der Kindheit vom Großvater geprägt und erlernte die große Kampfkunst Taiji aus dem Fernen Osten."

 # --- Ritterränge ---
 trait_blood_knight_1:0 "Ritterknappe"
 trait_blood_knight_1_desc:0 "Durch Fleiß, Ausdauer, Glauben und ein wenig Glück hat diese Person ihr Blut erweckt und ist zum Ritterknappen geworden."
 trait_blood_knight_1_character_desc:0 "Durch Fleiß, Ausdauer, Glauben und ein wenig Glück hat [ROOT.GetCharacter.GetFirstNameNoTooltip] das eigene Blut erweckt und ist zum Ritterknappen geworden."

 trait_blood_knight_2:0 "Ritter"
 trait_blood_knight_2_desc:0 "Nach unermüdlichem Einsatz hat diese Person den Pfad der Macht beschritten und den Rang eines Ritters erreicht."
 trait_blood_knight_2_character_desc:0 "Nach unermüdlichem Einsatz hat [ROOT.GetCharacter.GetFirstNameNoTooltip] den Pfad der Macht beschritten und ist zum Ritter geworden."

 trait_blood_knight_3:0 "Großritter"
 trait_blood_knight_3_desc:0 "Gesegnet mit Talent, Fleiß und Schicksal hat diese Person die Macht ihres Blutes gemeistert und ist zu einem Großritter aufgestiegen."
 trait_blood_knight_3_character_desc:0 "Gesegnet mit Talent, Fleiß und Schicksal hat [ROOT.GetCharacter.GetFirstNameNoTooltip] die Macht des eigenen Blutes gemeistert und ist zu einem Großritter geworden."

 trait_blood_knight_4:0 "Himmelsritter"
 trait_blood_knight_4_desc:0 "Diese Person hat die Erde bezwungen, den Himmel erobert und vor allem sich selbst überwunden. Sie steht auf dem Gipfel menschlicher Macht."
 trait_blood_knight_4_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] hat Erde, Himmel und sich selbst überwunden und steht nun auf dem Gipfel menschlicher Macht."