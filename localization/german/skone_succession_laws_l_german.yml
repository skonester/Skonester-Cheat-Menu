l_german:
 oligarchic_elective_succession_law: "Oligarchische Wahl"
 oligarchic_elective_succession_law_effects: "Der [Herrscher|E] und alle [mächtigen_Vasallen|E] des Reiches können unter sich selbst sowie den [engen_Familienmitgliedern|E] des Herrschers einen [Titelerben|E] nominieren."
 oligarchic_elective_candidates: "Enge Familie und Wahlberechtigte"
 oligarchic_elective_candidates_tooltip:1 "Um bei der oligarchischen Wahl als gültiger Kandidat infrage zu kommen, muss ein Charakter eine der folgenden Bedingungen erfüllen:\n$EFFECT_LIST_BULLET$Ein legitimes [enges_Familienmitglied|E] des derzeitigen Herrschers sein, das keine Theokratie oder Republik erbt. Kinder eines Kandidaten können nicht nominiert werden.\n$EFFECT_LIST_BULLET$Ein gültiger oligarchischer [Wahlberechtigter|E] für den Titel sein."
 oligarchic_elective_electors:0 "$feudal_elective_electors$"
 oligarchic_elective_electors_tooltip:1 "Um bei der oligarchischen Wahl ein gültiger [Wahlberechtigter|E] zu sein, muss ein Charakter eine der folgenden Bedingungen erfüllen:\n$EFFECT_LIST_BULLET$Der aktuelle Titelinhaber sein.\n$EFFECT_LIST_BULLET$Ein [mächtiger_Vasall|E] sein, der direkter Vasall des Titels ist."

