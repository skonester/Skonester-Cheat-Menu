l_german:
 skonester_cheat_menu_ai_ai_interaction: "Intimität"
 skonester_cheat_menu_ai_ai_interaction_desc: "Eine private Nacht mit [recipient.GetShortUIName] – Kerzen tief heruntergebrannt, Vorhänge zugezogen. Gib dich ganz hin, oder halte inne, kurz vor dem Punkt, von dem es kein Zurück mehr gibt."
 skonester_cheat_menu.0010.t: "Intimität – Die Nacht erwartet dich"
 skonester_cheat_menu.0010.desc: "Die Dienerschaft ist entlassen, du und [skonester_cheat_menu_target.GetShortUIName] seid allein. Seidene Vorhänge schließen die Welt aus; [skonester_cheat_menu_target.GetHerHis] Atem streift deine Haut, Kerzenlicht flackert in [skonester_cheat_menu_target.GetHerHis] Augen. Krieg und Rat können warten."
 skonester_cheat_menu.0010.desc_lover: "Bei deinem Liebhaber / deiner Liebhaberin [skonester_cheat_menu_target.GetShortUIName] fällt jede Fassade. Jede Berührung trägt noch die Hitze eures letzten Stelldicheins; Weihrauch und Haut verschmelzen, als ob die Nacht selbst euch zusammenhielte."
 skonester_cheat_menu.0010.desc_spouse: "Dein Ehepartner / deine Ehepartnerin [skonester_cheat_menu_target.GetShortUIName] entkleidet dich mit geübter Leichtigkeit, die Augen voll vertrauter Sehnsucht. Das Ehebett steht [skonester_cheat_menu_target.GetHerHis] von Rechts wegen zu – und heute Nacht will [skonester_cheat_menu_target.GetSheHe] dich daran erinnern, warum."
 skonester_cheat_menu.0010.desc_concubine: "Deine Konkubine [skonester_cheat_menu_target.GetShortUIName] senkt den Blick, während [skonester_cheat_menu_target.GetSheHe] [skonester_cheat_menu_target.GetHerHis] Gewänder lockert. [skonester_cheat_menu_target.GetSheHe|U] kennt [skonester_cheat_menu_target.GetHerHis] Platz – und weiß, wie sie dich mit einem Flüstern und einer Fingerspitze auf dieser Liege festhält."
 skonester_cheat_menu.0010.desc_camp: "Draußen peitscht der Wind das Lager; im Zelt Wärme und Duft. Du und [skonester_cheat_menu_target.GetShortUIName] auf dem Feldbett – das Kettenhemd noch warm, die Haut noch heißer. Eine gestohlene Stunde im Krieg, süßer als jeder Siegesruf."
 skonester_cheat_menu.0010.continue: "Gib nach …"
 skonester_cheat_menu.0010.cancel: "Zieh dich zurück"
 skonester_cheat_menu.0012.t: "Intimität – Danach"
 skonester_cheat_menu.0012.desc: "Erschöpft verweilt ihr noch auf demselben Bett. [skonester_cheat_menu_target.GetShortUIName]s Wangen sind gerötet, [skonester_cheat_menu_target.GetHerHis] Finger ruhen auf deinem Handgelenk; die Nachtwache vergeht jenseits der Vorhänge, doch die Hitze zwischen euch will nicht weichen."
 skonester_cheat_menu.0012.ok: "Hilf ihr / ihm, sich anzuziehen"
