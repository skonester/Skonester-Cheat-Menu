l_german:
 SKONESTER_CROZIER_CHEATS_B_auto_ascension_OFF:0 "AUS  ·  Jeder Herrscher, den ich spiele: beste Gene und +5 Werte"
 SKONESTER_CROZIER_CHEATS_B_auto_ascension_ON:0 "AN  ·  Jeder Herrscher, den ich spiele: beste Gene und +5 Werte"
 SKONESTER_CROZIER_CHEATS_B_auto_ascension_TT:0 "Der Charakter, den du spielst, erhält Genie, Herkules und Wunderschön sowie +5 auf alle sechs Werte. Jeder Charakter erhält dies nur einmal, sodass auch jeder Erbe, mit dem du weiterspielst, es bekommt.\nWird beim Einschalten und bei jeder Auto-Modus-Prüfung erneut geprüft (standardmäßig monatlich, siehe die Häufigkeits-Schaltflächen unten)."
 SKONESTER_CROZIER_CHEATS_B_auto_forever_young_OFF:0 "AUS  ·  Für immer 30 bleiben"
 SKONESTER_CROZIER_CHEATS_B_auto_forever_young_ON:0 "AN  ·  Für immer 30 bleiben"
 SKONESTER_CROZIER_CHEATS_B_auto_forever_young_TT:0 "Sobald du älter als 30 bist, wird dein Alter wieder auf 30 gesetzt.\nWird beim Einschalten und bei jeder Auto-Modus-Prüfung erneut geprüft (standardmäßig monatlich, siehe die Häufigkeits-Schaltflächen unten)."
 SKONESTER_CROZIER_CHEATS_B_auto_gold_floor_OFF:0 "AUS  ·  Nie unter 1.000 Gold"
 SKONESTER_CROZIER_CHEATS_B_auto_gold_floor_ON:0 "AN  ·  Nie unter 1.000 Gold"
 SKONESTER_CROZIER_CHEATS_B_auto_gold_floor_TT:0 "Sobald du weniger als 1.000 Gold hast (einschließlich Schulden), wird es wieder auf genau 1.000 aufgefüllt.\nWird beim Einschalten und bei jeder Auto-Modus-Prüfung erneut geprüft (standardmäßig monatlich, siehe die Häufigkeits-Schaltflächen unten)."
 SKONESTER_CROZIER_CHEATS_B_auto_no_prison_OFF:0 "AUS  ·  Ich kann nicht eingekerkert werden"
 SKONESTER_CROZIER_CHEATS_B_auto_no_prison_ON:0 "AN  ·  Ich kann nicht eingekerkert werden"
 SKONESTER_CROZIER_CHEATS_B_auto_no_prison_TT:0 "Sobald du eingekerkert wirst, wirst du freigelassen.\nWird außerdem beim Einschalten und bei jeder Auto-Modus-Prüfung geprüft."
 SKONESTER_CROZIER_CHEATS_B_auto_prestige_floor_OFF:0 "AUS  ·  Nie unter 1.000 Prestige und Frömmigkeit"
 SKONESTER_CROZIER_CHEATS_B_auto_prestige_floor_ON:0 "AN  ·  Nie unter 1.000 Prestige und Frömmigkeit"
 SKONESTER_CROZIER_CHEATS_B_auto_prestige_floor_TT:0 "Sobald dein Prestige oder deine Frömmigkeit unter 1.000 liegt, wird der Wert wieder auf genau 1.000 aufgefüllt.\nWird beim Einschalten und bei jeder Auto-Modus-Prüfung erneut geprüft (standardmäßig monatlich, siehe die Häufigkeits-Schaltflächen unten)."
 SKONESTER_CROZIER_CHEATS_B_child_now:0 "Jetzt ein Kind mit meinem Ehepartner bekommen"
 SKONESTER_CROZIER_CHEATS_B_child_now_TT:0 "Ein neugeborenes Kind von dir und einem deiner Ehepartner erscheint mit Genie, Herkules und Wunderschön an deinem Hof. Erfordert einen Ehepartner. Das Kind gehört deiner Dynastie an."
 SKONESTER_CROZIER_CHEATS_B_combo_army:0 "Traumarmee"
 SKONESTER_CROZIER_CHEATS_B_combo_army_TT:0 "Der Reihe nach: Jedes Kriegsvolk-Regiment wächst (+1 / +2 / +5 pro Regiment, Einstellung „Mengen“) und wird auf volle Stärke aufgefüllt; Aufgebote und Garnisonen in deinen Provinzen werden aufgefüllt; 5 starke Ritter treten deinem Hof bei (Kampfgeschick 40, Kriegsführung 18); du, deine Ritter und deine Armeebefehlshaber erhalten Logistiker, Pionier, Organisator und Aggressiver Angreifer."
 SKONESTER_CROZIER_CHEATS_B_combo_emergency:0 "Notfallrettung"
 SKONESTER_CROZIER_CHEATS_B_combo_emergency_TT:0 "Der Reihe nach: Deine Krankheiten und Wunden werden geheilt; du wirst aus dem Kerker befreit; du gewinnst jeden Krieg, in dem du Hauptverteidiger bist; deine Schulden werden beglichen; jedes Komplott gegen dich wird abgebrochen; deine Verwandten, die als Geiseln gehalten werden, kehren heim."
 SKONESTER_CROZIER_CHEATS_B_combo_family:0 "Perfekte Familie"
 SKONESTER_CROZIER_CHEATS_B_combo_family_TT:0 "Der Reihe nach: Du, deine Ehepartner und Kinder werden von allen Krankheiten, Wunden und Makeln geheilt; dein Erbe erhält Genie, Herkules, Wunderschön und +10 auf alle Werte; jedes deiner lebenden Kinder mit einer Ausbildungseigenschaft erhält deren beste Stufe."
 SKONESTER_CROZIER_CHEATS_B_combo_golden_age:0 "Goldenes Zeitalter"
 SKONESTER_CROZIER_CHEATS_B_combo_golden_age_TT:0 "Der Reihe nach: Alle Schulden werden beglichen, dein Gold wird verdoppelt, jedes mögliche Gebäude in deinem ganzen Reich wird errichtet, die Grafschaftsentwicklung steigt (+1 / +5 / +20, Einstellungen „Mengen“ und „Gilt für“) und die Entwicklung deines Hauptsitzes steigt (+5 / +20 / +50, Einstellung „Mengen“)."
 SKONESTER_CROZIER_CHEATS_B_combo_rise:0 "Machtergreifung"
 SKONESTER_CROZIER_CHEATS_B_combo_rise_TT:0 "Der Reihe nach: Du wirst von deinem Lehnsherrn unabhängig; liegt dein höchster Titel unter Königreichsrang, wird ein neues Königreich für dich geschaffen; alle unbeanspruchten Herzogtums-, Königreichs- und Kaiserreichstitel über deinen Grafschaften werden für dich geschaffen."
 SKONESTER_CROZIER_CHEATS_B_combo_throne:0 "Weg zum Thron (für Vasallen)"
 SKONESTER_CROZIER_CHEATS_B_combo_throne_TT:0 "Für den Fall, dass du Vasall bist: Dein Lehnsherr erhält +100 Meinung von dir und ernennt dich zu seinem designierten Nachfolger, alle seine anderen Vasallen müssen 10 Jahre lang für dich stimmen, und du erhältst einen durchgesetzten Anspruch auf den Haupttitel deines Lehnsherrn."
 SKONESTER_CROZIER_CHEATS_B_cooldowns_reset:0 "Alle Abklingzeiten zurücksetzen"
 SKONESTER_CROZIER_CHEATS_B_cooldowns_reset_TT:0 "Entfernt deine Abklingzeiten für 501 Entscheidungen und 558 Charakter-Interaktionen, sodass alles, was als noch nicht bereit markiert ist, wieder genutzt werden kann."
 SKONESTER_CROZIER_CHEATS_B_disease_player_OFF:0 "AUS  ·  Krankheitsimmunität"
 SKONESTER_CROZIER_CHEATS_B_disease_player_ON:0 "AN  ·  Krankheitsimmunität"
 SKONESTER_CROZIER_CHEATS_B_disease_player_TT:0 "Gibt dir die Eigenschaft Krankheitsschutz (+50 Gesundheit, verhindert die Ansteckung mit gewöhnlichen Krankheiten, die keine Seuchen sind) und heilt jede Krankheit, die du hast, einschließlich Pest, Blattern und Krebs. Krankheiten werden bei jeder Auto-Modus-Prüfung erneut geheilt.\nEreignisse können dir weiterhin direkt eine Krankheit geben.\nWechselst du zu einem anderen Charakter, geht der Bonus bei der nächsten Auto-Modus-Prüfung auf ihn über."
 SKONESTER_CROZIER_CHEATS_B_domain_OFF:0 "AUS  ·  Domänenschwelle +50 × Stärke"
 SKONESTER_CROZIER_CHEATS_B_domain_ON:0 "AN  ·  Domänenschwelle +50 × Stärke"
 SKONESTER_CROZIER_CHEATS_B_domain_TT:0 "Erlaubt dir, pro Stärkestufe +50 Grafschaften mehr ohne Malus selbst zu halten.\nDie Stärke ist der Multiplikator, der beim Einschalten oben im Panel ausgewählt ist. Um sie später zu ändern, schalte den Schalter aus, wähle eine neue Stärke und schalte ihn wieder ein.\nWechselst du zu einem anderen Charakter, geht der Bonus bei der nächsten Auto-Modus-Prüfung auf ihn über."
 SKONESTER_CROZIER_CHEATS_B_enemy_commander:0 "Armeebefehlshaber entfernen"
 SKONESTER_CROZIER_CHEATS_B_enemy_commander_TT:0 "Entfernt den Befehlshaber aus jeder Armee des Ziels. Die KI kann neue ernennen."
 SKONESTER_CROZIER_CHEATS_B_enemy_deplete:0 "25 % / 50 % / 90 % der ausgehobenen Truppen vernichten"
 SKONESTER_CROZIER_CHEATS_B_enemy_deplete_TT:0 "Die ausgehobenen Armeen des Ziels verlieren dauerhaft einen Teil ihrer Soldaten.\nDie Menge hängt von der Einstellung „Mengen“ oben in Skonester Cheats ab: Niedrig 25 %, Mittel 50 %, Hoch 90 %."
 SKONESTER_CROZIER_CHEATS_B_enemy_supply:0 "Armeevorräte leeren"
 SKONESTER_CROZIER_CHEATS_B_enemy_supply_TT:0 "Jede ausgehobene Armee des Ziels verliert ihren gesamten Nachschub."
 SKONESTER_CROZIER_CHEATS_B_forge_crown:0 "Die Krone des Souveräns erschaffen"
 SKONESTER_CROZIER_CHEATS_B_forge_crown_TT:0 "Fügt deinem Inventar eine neue legendäre Krone hinzu: +10 Diplomatie, +5 Prestige pro Monat, +25 Meinung der Vasallen und +10 allgemeine Meinung. Sie nutzt sich nie ab."
 SKONESTER_CROZIER_CHEATS_B_freq_month:0 "Auto-Modi: jeden Monat prüfen (Standard)"
 SKONESTER_CROZIER_CHEATS_B_freq_month_TT:0 "Auto-Modi und die Pflege der Schalter laufen alle 30 Tage. Dies ist die Standardeinstellung. Wirkt nach der nächsten Prüfung."
 SKONESTER_CROZIER_CHEATS_B_freq_quarter:0 "Auto-Modi: jedes Quartal prüfen"
 SKONESTER_CROZIER_CHEATS_B_freq_quarter_TT:0 "Auto-Modi und die Pflege der Schalter laufen alle 90 Tage. Schont die Spielleistung. Wirkt nach der nächsten Prüfung."
 SKONESTER_CROZIER_CHEATS_B_freq_week:0 "Auto-Modi: jede Woche prüfen"
 SKONESTER_CROZIER_CHEATS_B_freq_week_TT:0 "Auto-Modi und die Pflege der Schalter laufen alle 7 Tage. Wirkt nach der nächsten Prüfung."
 SKONESTER_CROZIER_CHEATS_B_gold:0 "Gold hinzufügen: 1.000 / 10.000 / 100.000"
 SKONESTER_CROZIER_CHEATS_B_gold_TT:0 "Fügt deiner Schatzkammer Gold hinzu.\nDie Menge hängt von der Einstellung „Mengen“ oben in Skonester Cheats ab: Niedrig 1.000, Mittel 10.000, Hoch 100.000."
 SKONESTER_CROZIER_CHEATS_B_gold_double:0 "Mein Gold verdoppeln"
 SKONESTER_CROZIER_CHEATS_B_gold_double_TT:0 "Fügt so viel Gold hinzu, wie du gerade besitzt. Bewirkt nichts, solange du verschuldet bist."
 SKONESTER_CROZIER_CHEATS_B_good_traits_me:0 "Gib mir die besten vererblichen Eigenschaften"
 SKONESTER_CROZIER_CHEATS_B_good_traits_me_TT:0 "Fügt Genie, Wunderschön, Herkules, Stark, Gescheit, Fruchtbar und Reinblütig hinzu."
 SKONESTER_CROZIER_CHEATS_B_gp_complete:0 "Alle meine Großvorhaben fertigstellen"
 SKONESTER_CROZIER_CHEATS_B_gp_complete_TT:0 "Jedes Großvorhaben, das dir gehört, wird sofort fertiggestellt, ohne dass Beiträge nötig sind."
 SKONESTER_CROZIER_CHEATS_B_grandeur_max:0 "Hofpracht auf Maximum"
 SKONESTER_CROZIER_CHEATS_B_grandeur_max_TT:0 "Setzt deine Hofpracht auf 100. Funktioniert nur, wenn du einen Königshof hast."
 SKONESTER_CROZIER_CHEATS_B_health_OFF:0 "AUS  ·  Gesundheit +50 × Stärke"
 SKONESTER_CROZIER_CHEATS_B_health_ON:0 "AN  ·  Gesundheit +50 × Stärke"
 SKONESTER_CROZIER_CHEATS_B_health_TT:0 "Fügt +50 Gesundheit pro Stärkestufe hinzu. Normale Gesundheit ist einstellig, sodass du schon bei ×1 praktisch nie an schlechter Gesundheit stirbst.\nDie Stärke ist der Multiplikator, der beim Einschalten oben im Panel ausgewählt ist. Um sie später zu ändern, schalte den Schalter aus, wähle eine neue Stärke und schalte ihn wieder ein.\nWechselst du zu einem anderen Charakter, geht der Bonus bei der nächsten Auto-Modus-Prüfung auf ihn über."
 SKONESTER_CROZIER_CHEATS_B_immortal_player_OFF:0 "AUS  ·  Unsterblich: kein Tod durch Alter"
 SKONESTER_CROZIER_CHEATS_B_immortal_player_ON:0 "AN  ·  Unsterblich: kein Tod durch Alter"
 SKONESTER_CROZIER_CHEATS_B_immortal_player_TT:0 "Gibt dir die Spieleigenschaft Unsterblich: Du alterst optisch nicht mehr und kannst nicht an Altersschwäche sterben. Du kannst weiterhin ermordet, hingerichtet oder in der Schlacht bzw. durch Ereignisse getötet werden. Außerdem heilt sie die Altersleiden Welkender Verstand, Trübe Augen, Schwaches Herz, Brüchige Knochen und Gebrechlich, und bist du älter als 25, wird dein Aussehen auf 25 eingefroren (dein angezeigtes Alter zählt weiter).\nBeim Ausschalten wird die Eigenschaft wieder entfernt, aber nur, wenn dieser Schalter sie hinzugefügt hat.\nWechselst du zu einem anderen Charakter, geht der Bonus bei der nächsten Auto-Modus-Prüfung auf ihn über."
 SKONESTER_CROZIER_CHEATS_B_income_OFF:0 "AUS  ·  Einnahmen +400 % × Stärke"
 SKONESTER_CROZIER_CHEATS_B_income_ON:0 "AN  ·  Einnahmen +400 % × Stärke"
 SKONESTER_CROZIER_CHEATS_B_income_TT:0 "Erhöht all deine monatlichen Einnahmen um +400 % pro Stärkestufe (×1 = das Fünffache deiner normalen Einnahmen).\nDie Stärke ist der Multiplikator, der beim Einschalten oben im Panel ausgewählt ist. Um sie später zu ändern, schalte den Schalter aus, wähle eine neue Stärke und schalte ihn wieder ein.\nWechselst du zu einem anderen Charakter, geht der Bonus bei der nächsten Auto-Modus-Prüfung auf ihn über."
 SKONESTER_CROZIER_CHEATS_B_income_year:0 "Jetzt ein Jahreseinkommen erhalten"
 SKONESTER_CROZIER_CHEATS_B_income_year_TT:0 "Fügt sofort Gold in Höhe deines aktuellen Jahreseinkommens hinzu. Deine normalen Einnahmen bleiben unberührt."
 SKONESTER_CROZIER_CHEATS_B_influence_OFF:0 "AUS  ·  Einfluss +5 pro Monat × Stärke"
 SKONESTER_CROZIER_CHEATS_B_influence_ON:0 "AN  ·  Einfluss +5 pro Monat × Stärke"
 SKONESTER_CROZIER_CHEATS_B_influence_TT:0 "Du erhältst jeden Monat +5 Einfluss pro Stärkestufe. Einfluss wird nur von Verwaltungsregierungen genutzt.\nDie Stärke ist der Multiplikator, der beim Einschalten oben im Panel ausgewählt ist. Um sie später zu ändern, schalte den Schalter aus, wähle eine neue Stärke und schalte ihn wieder ein.\nWechselst du zu einem anderen Charakter, geht der Bonus bei der nächsten Auto-Modus-Prüfung auf ihn über."
 SKONESTER_CROZIER_CHEATS_B_innovation_OFF:0 "AUS  ·  Innovationstempo +100 % × Stärke"
 SKONESTER_CROZIER_CHEATS_B_innovation_ON:0 "AN  ·  Innovationstempo +100 % × Stärke"
 SKONESTER_CROZIER_CHEATS_B_innovation_TT:0 "Deine Kultur entdeckt Innovationen pro Stärkestufe +100 % schneller. Funktioniert nur, solange du das Kulturoberhaupt bist.\nDie Stärke ist der Multiplikator, der beim Einschalten oben im Panel ausgewählt ist. Um sie später zu ändern, schalte den Schalter aus, wähle eine neue Stärke und schalte ihn wieder ein.\nWechselst du zu einem anderen Charakter, geht der Bonus bei der nächsten Auto-Modus-Prüfung auf ihn über."
 SKONESTER_CROZIER_CHEATS_B_instant_empire:0 "Sofortiges Kaiserreich"
 SKONESTER_CROZIER_CHEATS_B_instant_empire_TT:0 "Der Reihe nach: Alle unbeanspruchten Herzogtums-, Königreichs- und Kaiserreichstitel über deinen Grafschaften werden für dich geschaffen; du erhältst einen neuen Kaiserreichstitel, falls du keinen hast; unabhängige Herrscher innerhalb deiner De-jure-Gebiete und alle benachbarten unabhängigen Herrscher schwören dir Treue, sofern sie unter dir stehen; du übernimmst jede De-jure-Grafschaft deiner Herzogtümer und höheren Titel (und schaffst alle weiteren Titel, die dadurch möglich werden); alle Stufen werden auf Maximum gesetzt."
 SKONESTER_CROZIER_CHEATS_B_legend_spread_OFF:0 "AUS  ·  Legendenverbreitung +100 % × Stärke"
 SKONESTER_CROZIER_CHEATS_B_legend_spread_ON:0 "AN  ·  Legendenverbreitung +100 % × Stärke"
 SKONESTER_CROZIER_CHEATS_B_legend_spread_TT:0 "Legenden, die dir gehören, verbreiten sich pro Stärkestufe +100 % schneller.\nDie Stärke ist der Multiplikator, der beim Einschalten oben im Panel ausgewählt ist. Um sie später zu ändern, schalte den Schalter aus, wähle eine neue Stärke und schalte ihn wieder ein.\nWechselst du zu einem anderen Charakter, geht der Bonus bei der nächsten Auto-Modus-Prüfung auf ihn über."
 SKONESTER_CROZIER_CHEATS_B_legit_gain_OFF:0 "AUS  ·  Legitimität +1 pro Monat, Zuwachs +100 % × Stärke"
 SKONESTER_CROZIER_CHEATS_B_legit_gain_ON:0 "AN  ·  Legitimität +1 pro Monat, Zuwachs +100 % × Stärke"
 SKONESTER_CROZIER_CHEATS_B_legit_gain_TT:0 "Du erhältst jeden Monat +1 Legitimität, und sämtliche Legitimität, die du erhältst, steigt um +100 %, jeweils pro Stärkestufe.\nDie Stärke ist der Multiplikator, der beim Einschalten oben im Panel ausgewählt ist. Um sie später zu ändern, schalte den Schalter aus, wähle eine neue Stärke und schalte ihn wieder ein.\nWechselst du zu einem anderen Charakter, geht der Bonus bei der nächsten Auto-Modus-Prüfung auf ihn über."
 SKONESTER_CROZIER_CHEATS_B_legit_level:0 "Legitimität +1 Stufe"
 SKONESTER_CROZIER_CHEATS_B_legit_level_TT:0 "Erhöht deine Legitimität um eine Stufe. Funktioniert nur, wenn dein Charakter Legitimität nutzt (Herrscher tun das, die meisten landlosen Charaktere nicht)."
 SKONESTER_CROZIER_CHEATS_B_levels_max_all:0 "Alle Stufen auf Maximum"
 SKONESTER_CROZIER_CHEATS_B_levels_max_all_TT:0 "Prestigestufe und Frömmigkeitsstufe auf 5, Legitimität +5 Stufen, falls dein Charakter Legitimität nutzt, und Hofpracht auf 100, falls du einen Königshof hast."
 SKONESTER_CROZIER_CHEATS_B_levy_OFF:0 "AUS  ·  Aufgebotsgröße +100 % × Stärke"
 SKONESTER_CROZIER_CHEATS_B_levy_ON:0 "AN  ·  Aufgebotsgröße +100 % × Stärke"
 SKONESTER_CROZIER_CHEATS_B_levy_TT:0 "Alle deine Besitztümer stellen pro Stärkestufe +100 % mehr Aufgebote.\nDie Stärke ist der Multiplikator, der beim Einschalten oben im Panel ausgewählt ist. Um sie später zu ändern, schalte den Schalter aus, wähle eine neue Stärke und schalte ihn wieder ein.\nWechselst du zu einem anderen Charakter, geht der Bonus bei der nächsten Auto-Modus-Prüfung auf ihn über."
 SKONESTER_CROZIER_CHEATS_B_life_OFF:0 "AUS  ·  Lebenserwartung +10 Jahre × Stärke (Familie)"
 SKONESTER_CROZIER_CHEATS_B_life_ON:0 "AN  ·  Lebenserwartung +10 Jahre × Stärke (Familie)"
 SKONESTER_CROZIER_CHEATS_B_life_TT:0 "Du, deine Ehepartner und deine Kinder erhalten pro Stärkestufe +10 Jahre Lebenserwartung.\nDie Stärke ist der Multiplikator, der beim Einschalten oben im Panel ausgewählt ist. Um sie später zu ändern, schalte den Schalter aus, wähle eine neue Stärke und schalte ihn wieder ein.\nWechselst du zu einem anderen Charakter, geht der Bonus bei der nächsten Auto-Modus-Prüfung auf ihn über."
 SKONESTER_CROZIER_CHEATS_B_lifestyle_xp_OFF:0 "AUS  ·  Lebenswandelerfahrung +100 % × Stärke"
 SKONESTER_CROZIER_CHEATS_B_lifestyle_xp_ON:0 "AN  ·  Lebenswandelerfahrung +100 % × Stärke"
 SKONESTER_CROZIER_CHEATS_B_lifestyle_xp_TT:0 "Deine Lebenswandelerfahrung wächst pro Stärkestufe +100 % schneller, sodass du Vorzüge früher freischaltest.\nDie Stärke ist der Multiplikator, der beim Einschalten oben im Panel ausgewählt ist. Um sie später zu ändern, schalte den Schalter aus, wähle eine neue Stärke und schalte ihn wieder ein.\nWechselst du zu einem anderen Charakter, geht der Bonus bei der nächsten Auto-Modus-Prüfung auf ihn über."
 SKONESTER_CROZIER_CHEATS_B_lifestyle_xp_all:0 "Lebenswandelerfahrung: je 500 / 2.000 / 10.000"
 SKONESTER_CROZIER_CHEATS_B_lifestyle_xp_all_TT:0 "Fügt allen sechs Lebenswandeln Erfahrung hinzu (Diplomatie, Kriegsführung, Verwaltung, Ränkespiel, Bildung, Wanderer).\nDie Menge hängt von der Einstellung „Mengen“ oben in Skonester Cheats ab: Niedrig 500, Mittel 2.000, Hoch 10.000 pro Lebenswandel."
 SKONESTER_CROZIER_CHEATS_B_long_reign_OFF:0 "AUS  ·  Bonus für lange Herrschaft +100 % × Stärke"
 SKONESTER_CROZIER_CHEATS_B_long_reign_ON:0 "AN  ·  Bonus für lange Herrschaft +100 % × Stärke"
 SKONESTER_CROZIER_CHEATS_B_long_reign_TT:0 "Der Bonus für lange Herrschaft baut sich pro Stärkestufe +100 % schneller auf.\nDie Stärke ist der Multiplikator, der beim Einschalten oben im Panel ausgewählt ist. Um sie später zu ändern, schalte den Schalter aus, wähle eine neue Stärke und schalte ihn wieder ein.\nWechselst du zu einem anderen Charakter, geht der Bonus bei der nächsten Auto-Modus-Prüfung auf ihn über."
 SKONESTER_CROZIER_CHEATS_B_me_cure:0 "Meine Makel entfernen"
 SKONESTER_CROZIER_CHEATS_B_me_cure_TT:0 "Entfernt angeborene und erworbene Makel: blind, einäugig, entstellt, verstümmelt, Stottern, klumpfüßig, bucklig, Zwerg, inzüchtig, Keucher, Bluter, spindeldürr, schuppig, Albino, schwach, dümmlich, geringer Intellekt, Hässlichkeit, schwacher Körperbau, unfruchtbar, niedergeschlagen, wahnsinnig, besessen, aussätzig, kränklich, gebrechlich und untauglich."
 SKONESTER_CROZIER_CHEATS_B_me_fit:0 "Normalgewicht"
 SKONESTER_CROZIER_CHEATS_B_me_fit_TT:0 "Setzt dein Gewicht auf normal und hält es dort als Zielgewicht, wodurch Mali für Übergewicht oder Untergewicht entfallen."
 SKONESTER_CROZIER_CHEATS_B_me_heal_all:0 "Meine Krankheiten und Wunden heilen"
 SKONESTER_CROZIER_CHEATS_B_me_heal_all_TT:0 "Entfernt jede Krankheit (Krank, Lungenentzündung, Pest, Blattern, Krebs, Schwindsucht, Lues, Typhus, Blutdurchfall, Masern, Lepra, Gicht und weitere), alle Wunden und Untauglich."
 SKONESTER_CROZIER_CHEATS_B_me_immortal_trait:0 "Mach mich unsterblich (dauerhaft)"
 SKONESTER_CROZIER_CHEATS_B_me_immortal_trait_TT:0 "Gibt dir dauerhaft die Eigenschaft Unsterblich. Anders als beim Unsterblich-Schalter oben wird sie durch das Ausschalten der Schalter nicht entfernt. Außerdem heilt sie die Altersleiden Welkender Verstand, Trübe Augen, Schwaches Herz, Brüchige Knochen und Gebrechlich, und bist du älter als 25, wird dein Aussehen auf 25 eingefroren (dein angezeigtes Alter zählt weiter)."
 SKONESTER_CROZIER_CHEATS_B_me_take_culture:0 "Kultur des Ziels annehmen (nur ich)"
 SKONESTER_CROZIER_CHEATS_B_me_take_culture_TT:0 "Du nimmst persönlich die Kultur des Ziels an. Deine Ländereien ändern sich nicht."
 SKONESTER_CROZIER_CHEATS_B_me_take_faith:0 "Glauben des Ziels annehmen (nur ich)"
 SKONESTER_CROZIER_CHEATS_B_me_take_faith_TT:0 "Du nimmst persönlich den Glauben des Ziels an. Deine Ländereien ändern sich nicht."
 SKONESTER_CROZIER_CHEATS_B_me_young:0 "Mach mich 25"
 SKONESTER_CROZIER_CHEATS_B_me_young_TT:0 "Bist du älter als 25, wird dein Alter auf 25 gesetzt."
 SKONESTER_CROZIER_CHEATS_B_merit_gain_OFF:0 "AUS  ·  Verdienstzuwachs +100 % × Stärke"
 SKONESTER_CROZIER_CHEATS_B_merit_gain_ON:0 "AN  ·  Verdienstzuwachs +100 % × Stärke"
 SKONESTER_CROZIER_CHEATS_B_merit_gain_TT:0 "Du erhältst Verdienst pro Stärkestufe +100 % schneller. Verdienst wird nur von Verwaltungsregierungen genutzt.\nDie Stärke ist der Multiplikator, der beim Einschalten oben im Panel ausgewählt ist. Um sie später zu ändern, schalte den Schalter aus, wähle eine neue Stärke und schalte ihn wieder ein.\nWechselst du zu einem anderen Charakter, geht der Bonus bei der nächsten Auto-Modus-Prüfung auf ihn über."
 SKONESTER_CROZIER_CHEATS_B_monthly_gold_OFF:0 "AUS  ·  Gold +10 pro Monat × Stärke"
 SKONESTER_CROZIER_CHEATS_B_monthly_gold_ON:0 "AN  ·  Gold +10 pro Monat × Stärke"
 SKONESTER_CROZIER_CHEATS_B_monthly_gold_TT:0 "Fügt deinen monatlichen Einnahmen pauschal +10 Gold pro Stärkestufe hinzu (×1 = +10, ×100 = +1.000, ×1000 = +10.000).\nDie Stärke ist der Multiplikator, der beim Einschalten oben im Panel ausgewählt ist. Um sie später zu ändern, schalte den Schalter aus, wähle eine neue Stärke und schalte ihn wieder ein.\nWechselst du zu einem anderen Charakter, geht der Bonus bei der nächsten Auto-Modus-Prüfung auf ihn über."
 SKONESTER_CROZIER_CHEATS_B_perks_all:0 "Jeden Vorzug freischalten"
 SKONESTER_CROZIER_CHEATS_B_perks_all_TT:0 "Schaltet alle 162 Lebenswandel-Vorzüge auf einmal frei."
 SKONESTER_CROZIER_CHEATS_B_piety_OFF:0 "AUS  ·  Frömmigkeit +100 pro Monat × Stärke"
 SKONESTER_CROZIER_CHEATS_B_piety_ON:0 "AN  ·  Frömmigkeit +100 pro Monat × Stärke"
 SKONESTER_CROZIER_CHEATS_B_piety_TT:0 "Du erhältst jeden Monat +100 Frömmigkeit pro Stärkestufe.\nDie Stärke ist der Multiplikator, der beim Einschalten oben im Panel ausgewählt ist. Um sie später zu ändern, schalte den Schalter aus, wähle eine neue Stärke und schalte ihn wieder ein.\nWechselst du zu einem anderen Charakter, geht der Bonus bei der nächsten Auto-Modus-Prüfung auf ihn über."
 SKONESTER_CROZIER_CHEATS_B_piety_add:0 "Frömmigkeit hinzufügen: 1.000 / 10.000 / 100.000"
 SKONESTER_CROZIER_CHEATS_B_piety_add_TT:0 "Fügt Frömmigkeit hinzu.\nDie Menge hängt von der Einstellung „Mengen“ oben in Skonester Cheats ab: Niedrig 1.000, Mittel 10.000, Hoch 100.000."
 SKONESTER_CROZIER_CHEATS_B_piety_level_max:0 "Frömmigkeitsstufe auf Maximum"
 SKONESTER_CROZIER_CHEATS_B_piety_level_max_TT:0 "Setzt deine Frömmigkeitsstufe auf die höchste Stufe (5)."
 SKONESTER_CROZIER_CHEATS_B_play_heir:0 "Jetzt als mein Erbe spielen"
 SKONESTER_CROZIER_CHEATS_B_play_heir_TT:0 "Du wechselst zu deinem Erben. Dein aktueller Charakter bleibt am Leben und wird von der KI gesteuert. Nutze „Zu meinem vorherigen Charakter zurückkehren“, um zurückzuwechseln."
 SKONESTER_CROZIER_CHEATS_B_play_prev:0 "Zu meinem vorherigen Charakter zurückkehren"
 SKONESTER_CROZIER_CHEATS_B_play_prev_TT:0 "Wechselt zurück zu dem Charakter, den du vor „Jetzt als mein Erbe spielen“ oder „Als dieser Charakter spielen“ gespielt hast. Funktioniert nur, wenn dieser Charakter noch lebt."
 SKONESTER_CROZIER_CHEATS_B_prestige_OFF:0 "AUS  ·  Prestige +100 pro Monat × Stärke"
 SKONESTER_CROZIER_CHEATS_B_prestige_ON:0 "AN  ·  Prestige +100 pro Monat × Stärke"
 SKONESTER_CROZIER_CHEATS_B_prestige_TT:0 "Du erhältst jeden Monat +100 Prestige pro Stärkestufe.\nDie Stärke ist der Multiplikator, der beim Einschalten oben im Panel ausgewählt ist. Um sie später zu ändern, schalte den Schalter aus, wähle eine neue Stärke und schalte ihn wieder ein.\nWechselst du zu einem anderen Charakter, geht der Bonus bei der nächsten Auto-Modus-Prüfung auf ihn über."
 SKONESTER_CROZIER_CHEATS_B_prestige_add:0 "Prestige hinzufügen: 1.000 / 10.000 / 100.000"
 SKONESTER_CROZIER_CHEATS_B_prestige_add_TT:0 "Fügt Prestige hinzu.\nDie Menge hängt von der Einstellung „Mengen“ oben in Skonester Cheats ab: Niedrig 1.000, Mittel 10.000, Hoch 100.000."
 SKONESTER_CROZIER_CHEATS_B_prestige_level_max:0 "Prestigestufe auf Maximum"
 SKONESTER_CROZIER_CHEATS_B_prestige_level_max_TT:0 "Setzt deine Prestigestufe auf die höchste Stufe (5)."
 SKONESTER_CROZIER_CHEATS_B_prestige_mult_OFF:0 "AUS  ·  Prestige- und Frömmigkeitszuwachs +100 % × Stärke"
 SKONESTER_CROZIER_CHEATS_B_prestige_mult_ON:0 "AN  ·  Prestige- und Frömmigkeitszuwachs +100 % × Stärke"
 SKONESTER_CROZIER_CHEATS_B_prestige_mult_TT:0 "Sämtliches Prestige und sämtliche Frömmigkeit, die du erhältst, steigen um +100 % pro Stärkestufe.\nDie Stärke ist der Multiplikator, der beim Einschalten oben im Panel ausgewählt ist. Um sie später zu ändern, schalte den Schalter aus, wähle eine neue Stärke und schalte ihn wieder ein.\nWechselst du zu einem anderen Charakter, geht der Bonus bei der nächsten Auto-Modus-Prüfung auf ihn über."
 SKONESTER_CROZIER_CHEATS_B_realm_take_culture:0 "Meine Grafschaften zur Kultur des Ziels bekehren"
 SKONESTER_CROZIER_CHEATS_B_realm_take_culture_TT:0 "Deine Grafschaften wechseln zur Kultur des Ziels.\nNutzt die Einstellung „Gilt für“ oben in Skonester Cheats: nur Grafschaften, die du selbst hältst, oder dein ganzes Reich einschließlich Vasallen."
 SKONESTER_CROZIER_CHEATS_B_realm_take_faith:0 "Meine Grafschaften zum Glauben des Ziels bekehren"
 SKONESTER_CROZIER_CHEATS_B_realm_take_faith_TT:0 "Deine Grafschaften wechseln zum Glauben des Ziels.\nNutzt die Einstellung „Gilt für“ oben in Skonester Cheats: nur Grafschaften, die du selbst hältst, oder dein ganzes Reich einschließlich Vasallen."
 SKONESTER_CROZIER_CHEATS_B_renown_OFF:0 "AUS  ·  Dynastie-Bekanntheit +5 pro Monat × Stärke"
 SKONESTER_CROZIER_CHEATS_B_renown_ON:0 "AN  ·  Dynastie-Bekanntheit +5 pro Monat × Stärke"
 SKONESTER_CROZIER_CHEATS_B_renown_TT:0 "Deine Dynastie erhält jeden Monat +5 Bekanntheit pro Stärkestufe.\nDie Stärke ist der Multiplikator, der beim Einschalten oben im Panel ausgewählt ist. Um sie später zu ändern, schalte den Schalter aus, wähle eine neue Stärke und schalte ihn wieder ein.\nWechselst du zu einem anderen Charakter, geht der Bonus bei der nächsten Auto-Modus-Prüfung auf ihn über."
 SKONESTER_CROZIER_CHEATS_B_renown_mult_OFF:0 "AUS  ·  Bekanntheitszuwachs +100 % × Stärke"
 SKONESTER_CROZIER_CHEATS_B_renown_mult_ON:0 "AN  ·  Bekanntheitszuwachs +100 % × Stärke"
 SKONESTER_CROZIER_CHEATS_B_renown_mult_TT:0 "Sämtliche Bekanntheit, die deine Dynastie erhält, steigt um +100 % pro Stärkestufe.\nDie Stärke ist der Multiplikator, der beim Einschalten oben im Panel ausgewählt ist. Um sie später zu ändern, schalte den Schalter aus, wähle eine neue Stärke und schalte ihn wieder ein.\nWechselst du zu einem anderen Charakter, geht der Bonus bei der nächsten Auto-Modus-Prüfung auf ihn über."
 SKONESTER_CROZIER_CHEATS_B_skills_OFF:0 "AUS  ·  Alle sechs Werte +50 × Stärke"
 SKONESTER_CROZIER_CHEATS_B_skills_ON:0 "AN  ·  Alle sechs Werte +50 × Stärke"
 SKONESTER_CROZIER_CHEATS_B_skills_TT:0 "Erhöht Diplomatie, Kriegsführung, Verwaltung, Ränkespiel, Bildung und Kampfgeschick um +50 pro Stärkestufe.\nDie Stärke ist der Multiplikator, der beim Einschalten oben im Panel ausgewählt ist. Um sie später zu ändern, schalte den Schalter aus, wähle eine neue Stärke und schalte ihn wieder ein.\nWechselst du zu einem anderen Charakter, geht der Bonus bei der nächsten Auto-Modus-Prüfung auf ihn über."
 SKONESTER_CROZIER_CHEATS_B_skills_mult_OFF:0 "AUS  ·  Alle sechs Werte +50 % × Stärke"
 SKONESTER_CROZIER_CHEATS_B_skills_mult_ON:0 "AN  ·  Alle sechs Werte +50 % × Stärke"
 SKONESTER_CROZIER_CHEATS_B_skills_mult_TT:0 "Alle sechs deiner Werte steigen um +50 % ihres aktuellen Werts pro Stärkestufe (×2 verdoppelt sie).\nDie Stärke ist der Multiplikator, der beim Einschalten oben im Panel ausgewählt ist. Um sie später zu ändern, schalte den Schalter aus, wähle eine neue Stärke und schalte ihn wieder ein.\nWechselst du zu einem anderen Charakter, geht der Bonus bei der nächsten Auto-Modus-Prüfung auf ihn über."
 SKONESTER_CROZIER_CHEATS_B_slots_OFF:0 "AUS  ·  Gebäudeplätze +1 × Stärke"
 SKONESTER_CROZIER_CHEATS_B_slots_ON:0 "AN  ·  Gebäudeplätze +1 × Stärke"
 SKONESTER_CROZIER_CHEATS_B_slots_TT:0 "Jedes Besitztum, das dir gehört, erhält +1 zusätzlichen Gebäudeplatz pro Stärkestufe.\nIst „Gilt für“ auf „ganzes Reich“ gesetzt, erhalten auch alle deine Vasallen die Plätze.\nDie Stärke ist der Multiplikator, der beim Einschalten oben im Panel ausgewählt ist. Um sie später zu ändern, schalte den Schalter aus, wähle eine neue Stärke und schalte ihn wieder ein.\nWechselst du zu einem anderen Charakter, geht der Bonus bei der nächsten Auto-Modus-Prüfung auf ihn über."
 SKONESTER_CROZIER_CHEATS_B_stress_OFF:0 "AUS  ·  Anspannungszuwachs −99 %"
 SKONESTER_CROZIER_CHEATS_B_stress_ON:0 "AN  ·  Anspannungszuwachs −99 %"
 SKONESTER_CROZIER_CHEATS_B_stress_TT:0 "Du erhältst nur noch 1 % der Anspannung, die du normalerweise bekämst. Die Stärke hat bei diesem Schalter keine Wirkung.\nWechselst du zu einem anderen Charakter, geht der Bonus bei der nächsten Auto-Modus-Prüfung auf ihn über."
 SKONESTER_CROZIER_CHEATS_B_stress_zero:0 "Alle Anspannung entfernen"
 SKONESTER_CROZIER_CHEATS_B_stress_zero_TT:0 "Entfernt deine gesamte Anspannung."
 SKONESTER_CROZIER_CHEATS_B_t_adopt:0 "Adoptieren"
 SKONESTER_CROZIER_CHEATS_B_t_adopt_TT:0 "Du adoptierst das Ziel als dein Kind."
 SKONESTER_CROZIER_CHEATS_B_t_armies_to:0 "Meine Armeen zu seinem Hauptsitz teleportieren"
 SKONESTER_CROZIER_CHEATS_B_t_armies_to_TT:0 "Jede deiner Armeen, die sich nicht in einer Schlacht befindet, wird sofort in die Hauptsitzprovinz des Ziels versetzt. Stehen dort Feinde, beginnt sofort eine Schlacht."
 SKONESTER_CROZIER_CHEATS_B_t_artifact_claims:0 "Meinem Haus Ansprüche auf seine Artefakte geben"
 SKONESTER_CROZIER_CHEATS_B_t_artifact_claims_TT:0 "Dein Haus erhält einen Anspruch auf jedes Artefakt, das dem Ziel gehört."
 SKONESTER_CROZIER_CHEATS_B_t_banish:0 "Verbannen"
 SKONESTER_CROZIER_CHEATS_B_t_banish_TT:0 "Verbannt das Ziel von dem Hof, an dem es sich aufhält."
 SKONESTER_CROZIER_CHEATS_B_t_bind:0 "Binden: Vasall, +100 Meinung und ein starkes Druckmittel"
 SKONESTER_CROZIER_CHEATS_B_t_bind_TT:0 "Der Reihe nach: Das Ziel wird mit all seinen Ländereien dein Vasall (nur wenn sein höchster Titel unter deinem steht), erhält +100 Meinung von dir, und du erhältst ein starkes Druckmittel gegen es."
 SKONESTER_CROZIER_CHEATS_B_t_blackmail_all:0 "Mit jedem bekannten Geheimnis erpressen"
 SKONESTER_CROZIER_CHEATS_B_t_blackmail_all_TT:0 "Du erhältst für jedes Geheimnis des Ziels, das du kennst, ein starkes Erpressungs-Druckmittel. Nutze zuerst „Alle Geheimnisse erfahren“, um die meisten Druckmittel zu erhalten."
 SKONESTER_CROZIER_CHEATS_B_t_blind:0 "Blenden"
 SKONESTER_CROZIER_CHEATS_B_t_blind_TT:0 "Gibt dem Ziel die Eigenschaft Blind."
 SKONESTER_CROZIER_CHEATS_B_t_child_me:0 "Mit meinem Kind schwängern"
 SKONESTER_CROZIER_CHEATS_B_t_child_me_TT:0 "Wer von euch beiden die Frau ist, wird mit eurem Kind schwanger. Erfordert unterschiedliche Geschlechter, und die Frau darf nicht bereits schwanger sein."
 SKONESTER_CROZIER_CHEATS_B_t_child_now:0 "Jetzt ein Kind mit diesem Charakter bekommen"
 SKONESTER_CROZIER_CHEATS_B_t_child_now_TT:0 "Ein neugeborenes Kind von dir und dem Ziel erscheint mit Genie, Herkules und Wunderschön an deinem Hof. Erfordert unterschiedliche Geschlechter."
 SKONESTER_CROZIER_CHEATS_B_t_claim_all:0 "Ansprüche auf alle seine Titel"
 SKONESTER_CROZIER_CHEATS_B_t_claim_all_TT:0 "Du erhältst einen durchgesetzten Anspruch auf jeden Titel, den das Ziel hält."
 SKONESTER_CROZIER_CHEATS_B_t_claim_primary:0 "Anspruch auf seinen Haupttitel"
 SKONESTER_CROZIER_CHEATS_B_t_claim_primary_TT:0 "Du erhältst einen durchgesetzten Anspruch auf den Haupttitel des Ziels."
 SKONESTER_CROZIER_CHEATS_B_t_concubine:0 "Zu meiner Konkubine nehmen"
 SKONESTER_CROZIER_CHEATS_B_t_concubine_TT:0 "Das Ziel wird deine Konkubine. Funktioniert nur bei unverheirateten Erwachsenen, die nicht eingekerkert sind."
 SKONESTER_CROZIER_CHEATS_B_t_copy_look:0 "Sein Aussehen auf mich übertragen"
 SKONESTER_CROZIER_CHEATS_B_t_copy_look_TT:0 "Deine Aussehens-Gene werden durch die des Ziels ersetzt, sodass du wie es aussiehst. Deine künftigen Kinder erben die neuen Gene."
 SKONESTER_CROZIER_CHEATS_B_t_councillor_chancellor:0 "Zum Ratskanzler ernennen"
 SKONESTER_CROZIER_CHEATS_B_t_councillor_chancellor_TT:0 "Das Ziel übernimmt deinen Sitz als Ratskanzler. Der bisherige Ratskanzler bleibt an deinem Hof.\nDas Ziel muss dafür infrage kommen: in der Regel dein Höfling oder Vasall."
 SKONESTER_CROZIER_CHEATS_B_t_councillor_court_chaplain:0 "Zum Ratsprediger ernennen"
 SKONESTER_CROZIER_CHEATS_B_t_councillor_court_chaplain_TT:0 "Das Ziel übernimmt deinen Sitz als Ratsprediger. Der bisherige Ratsprediger bleibt an deinem Hof.\nDas Ziel muss dafür infrage kommen: in der Regel dein Höfling oder Vasall."
 SKONESTER_CROZIER_CHEATS_B_t_councillor_marshal:0 "Zum Ratsmarschall ernennen"
 SKONESTER_CROZIER_CHEATS_B_t_councillor_marshal_TT:0 "Das Ziel übernimmt deinen Sitz als Ratsmarschall. Der bisherige Ratsmarschall bleibt an deinem Hof.\nDas Ziel muss dafür infrage kommen: in der Regel dein Höfling oder Vasall."
 SKONESTER_CROZIER_CHEATS_B_t_councillor_spymaster:0 "Zum Ratsspitzel ernennen"
 SKONESTER_CROZIER_CHEATS_B_t_councillor_spymaster_TT:0 "Das Ziel übernimmt deinen Sitz als Ratsspitzel. Der bisherige Ratsspitzel bleibt an deinem Hof.\nDas Ziel muss dafür infrage kommen: in der Regel dein Höfling oder Vasall."
 SKONESTER_CROZIER_CHEATS_B_t_councillor_steward:0 "Zum Ratsverwalter ernennen"
 SKONESTER_CROZIER_CHEATS_B_t_councillor_steward_TT:0 "Das Ziel übernimmt deinen Sitz als Ratsverwalter. Der bisherige Ratsverwalter bleibt an deinem Hof.\nDas Ziel muss dafür infrage kommen: in der Regel dein Höfling oder Vasall."
 SKONESTER_CROZIER_CHEATS_B_t_cp_bodyguard:0 "Zu meinem Leibwächter ernennen"
 SKONESTER_CROZIER_CHEATS_B_t_cp_bodyguard_TT:0 "Das Ziel wird in ein Leibwächter-Amt an deinem Hof ernannt.\nDas Ziel muss dafür infrage kommen: in der Regel dein Höfling oder Vasall."
 SKONESTER_CROZIER_CHEATS_B_t_cp_champion:0 "Zu meinem Persönlichen Streiter ernennen"
 SKONESTER_CROZIER_CHEATS_B_t_cp_champion_TT:0 "Das Ziel wird in dein Amt des Persönlichen Streiters ernannt.\nDas Ziel muss dafür infrage kommen: in der Regel dein Höfling oder Vasall."
 SKONESTER_CROZIER_CHEATS_B_t_cp_court_physician:0 "Zu meinem Leibarzt ernennen"
 SKONESTER_CROZIER_CHEATS_B_t_cp_court_physician_TT:0 "Das Ziel wird in dein Amt des Leibarztes ernannt.\nDas Ziel muss dafür infrage kommen: in der Regel dein Höfling oder Vasall."
 SKONESTER_CROZIER_CHEATS_B_t_cp_court_tutor:0 "Zu meinem Tutor ernennen"
 SKONESTER_CROZIER_CHEATS_B_t_cp_court_tutor_TT:0 "Das Ziel wird in dein Amt des Tutors ernannt.\nDas Ziel muss dafür infrage kommen: in der Regel dein Höfling oder Vasall."
 SKONESTER_CROZIER_CHEATS_B_t_cp_master_assassin:0 "Zu meinem Meistermeuchler ernennen"
 SKONESTER_CROZIER_CHEATS_B_t_cp_master_assassin_TT:0 "Das Ziel wird in dein Amt des Meistermeuchlers ernannt.\nDas Ziel muss dafür infrage kommen: in der Regel dein Höfling oder Vasall."
 SKONESTER_CROZIER_CHEATS_B_t_cp_royal_architect:0 "Zu meinem Hofbaumeister ernennen"
 SKONESTER_CROZIER_CHEATS_B_t_cp_royal_architect_TT:0 "Das Ziel wird in dein Amt des Hofbaumeisters ernannt.\nDas Ziel muss dafür infrage kommen: in der Regel dein Höfling oder Vasall."
 SKONESTER_CROZIER_CHEATS_B_t_crush:0 "Zerschmettern: alles nehmen und einkerkern"
 SKONESTER_CROZIER_CHEATS_B_t_crush_TT:0 "Der Reihe nach: Nimm dem Ziel sein gesamtes Gold, all seine Artefakte und all seine Titel ab Grafschaftsrang (außer einem Glaubensoberhaupt-Titel), dann wirf es in deinen Kerker."
 SKONESTER_CROZIER_CHEATS_B_t_culture_innovations:0 "Innovationen seiner Kultur kopieren"
 SKONESTER_CROZIER_CHEATS_B_t_culture_innovations_TT:0 "Deine Kultur erhält jede Innovation, die die Kultur des Ziels entdeckt hat."
 SKONESTER_CROZIER_CHEATS_B_t_culture_traditions:0 "Traditionen seiner Kultur kopieren"
 SKONESTER_CROZIER_CHEATS_B_t_culture_traditions_TT:0 "Die Traditionen deiner Kultur werden durch die Traditionen der Kultur des Ziels ersetzt."
 SKONESTER_CROZIER_CHEATS_B_t_cure:0 "Makel entfernen"
 SKONESTER_CROZIER_CHEATS_B_t_cure_TT:0 "Entfernt angeborene und erworbene Makel vom Ziel: blind, einäugig, entstellt, verstümmelt, Stottern, klumpfüßig, bucklig, Zwerg, inzüchtig, Keucher, Bluter, spindeldürr, schuppig, Albino, schwach, dümmlich, geringer Intellekt, Hässlichkeit, schwacher Körperbau, unfruchtbar, niedergeschlagen, wahnsinnig, besessen, aussätzig, kränklich, gebrechlich und untauglich."
 SKONESTER_CROZIER_CHEATS_B_t_depose:0 "Absetzen"
 SKONESTER_CROZIER_CHEATS_B_t_depose_TT:0 "Das Ziel verliert all seine Titel, die an seinen Erben übergehen."
 SKONESTER_CROZIER_CHEATS_B_t_disfigure:0 "Entstellen"
 SKONESTER_CROZIER_CHEATS_B_t_disfigure_TT:0 "Gibt dem Ziel die Eigenschaft Entstellt."
 SKONESTER_CROZIER_CHEATS_B_t_elevate:0 "Erheben: beste Eigenschaften, +5 Werte und Gold"
 SKONESTER_CROZIER_CHEATS_B_t_elevate_TT:0 "Gibt dem Ziel Genie, Wunderschön, Herkules, Stark, Gescheit, Fruchtbar und Reinblütig, +5 auf alle Werte und Gold.\nDie Menge hängt von der Einstellung „Mengen“ oben in Skonester Cheats ab: Niedrig 100, Mittel 1.000, Hoch 10.000 Gold."
 SKONESTER_CROZIER_CHEATS_B_t_epidemic_bubonic_plague:0 "Pest-Ausbruch im Hauptsitz auslösen"
 SKONESTER_CROZIER_CHEATS_B_t_epidemic_bubonic_plague_TT:0 "Löst in der Hauptsitzprovinz des Ziels einen schweren Ausbruch der Pest aus. Er kann sich wie jede Seuche ausbreiten, auch auf dich."
 SKONESTER_CROZIER_CHEATS_B_t_epidemic_consumption:0 "Schwindsucht-Ausbruch im Hauptsitz auslösen"
 SKONESTER_CROZIER_CHEATS_B_t_epidemic_consumption_TT:0 "Löst in der Hauptsitzprovinz des Ziels einen schweren Ausbruch der Schwindsucht aus. Er kann sich wie jede Seuche ausbreiten, auch auf dich."
 SKONESTER_CROZIER_CHEATS_B_t_epidemic_dysentery:0 "Blutdurchfall-Ausbruch im Hauptsitz auslösen"
 SKONESTER_CROZIER_CHEATS_B_t_epidemic_dysentery_TT:0 "Löst in der Hauptsitzprovinz des Ziels einen schweren Ausbruch des Blutdurchfalls aus. Er kann sich wie jede Seuche ausbreiten, auch auf dich."
 SKONESTER_CROZIER_CHEATS_B_t_epidemic_ergotism:0 "Antoniusfeuer-Ausbruch im Hauptsitz auslösen"
 SKONESTER_CROZIER_CHEATS_B_t_epidemic_ergotism_TT:0 "Löst in der Hauptsitzprovinz des Ziels einen schweren Ausbruch des Antoniusfeuers (Mutterkornvergiftung) aus. Er kann sich wie jede Seuche ausbreiten, auch auf dich."
 SKONESTER_CROZIER_CHEATS_B_t_epidemic_measles:0 "Masern-Ausbruch im Hauptsitz auslösen"
 SKONESTER_CROZIER_CHEATS_B_t_epidemic_measles_TT:0 "Löst in der Hauptsitzprovinz des Ziels einen schweren Ausbruch der Masern aus. Er kann sich wie jede Seuche ausbreiten, auch auf dich."
 SKONESTER_CROZIER_CHEATS_B_t_epidemic_smallpox:0 "Blattern-Ausbruch im Hauptsitz auslösen"
 SKONESTER_CROZIER_CHEATS_B_t_epidemic_smallpox_TT:0 "Löst in der Hauptsitzprovinz des Ziels einen schweren Ausbruch der Blattern aus. Er kann sich wie jede Seuche ausbreiten, auch auf dich."
 SKONESTER_CROZIER_CHEATS_B_t_epidemic_typhus:0 "Typhus-Ausbruch im Hauptsitz auslösen"
 SKONESTER_CROZIER_CHEATS_B_t_epidemic_typhus_TT:0 "Löst in der Hauptsitzprovinz des Ziels einen schweren Ausbruch des Typhus aus. Er kann sich wie jede Seuche ausbreiten, auch auf dich."
 SKONESTER_CROZIER_CHEATS_B_t_excommunicate:0 "Exkommunizieren"
 SKONESTER_CROZIER_CHEATS_B_t_excommunicate_TT:0 "Gibt dem Ziel die Eigenschaft Exkommuniziert."
 SKONESTER_CROZIER_CHEATS_B_t_execute:0 "Hinrichten"
 SKONESTER_CROZIER_CHEATS_B_t_execute_TT:0 "Das Ziel stirbt sofort durch Hinrichtung, mit dir als Henker vermerkt."
 SKONESTER_CROZIER_CHEATS_B_t_faith_fervor_down:0 "Sein Glaube: Eifer −100"
 SKONESTER_CROZIER_CHEATS_B_t_faith_fervor_down_TT:0 "Der Glaube des Ziels verliert 100 Eifer, wodurch seine Anhänger leichter zu bekehren und Ketzereien wahrscheinlicher werden."
 SKONESTER_CROZIER_CHEATS_B_t_faith_fervor_up:0 "Sein Glaube: Eifer +100"
 SKONESTER_CROZIER_CHEATS_B_t_faith_fervor_up_TT:0 "Der Glaube des Ziels erhält 100 Eifer."
 SKONESTER_CROZIER_CHEATS_B_t_faith_holy_sites:0 "Heilige Stätten seines Glaubens zu meinen hinzufügen"
 SKONESTER_CROZIER_CHEATS_B_t_faith_holy_sites_TT:0 "Jede Heilige Stätte des Glaubens des Ziels wird auch zu einer Heiligen Stätte deines Glaubens."
 SKONESTER_CROZIER_CHEATS_B_t_family_hostages:0 "Alle seine Kinder als Geiseln nehmen"
 SKONESTER_CROZIER_CHEATS_B_t_family_hostages_TT:0 "Jedes lebende Kind des Ziels, das kein Herrscher und noch keine Geisel ist, wird als Geisel an deinen Hof gebracht."
 SKONESTER_CROZIER_CHEATS_B_t_forget:0 "Zweiten Charakter vergessen"
 SKONESTER_CROZIER_CHEATS_B_t_forget_TT:0 "Löscht den gemerkten zweiten Charakter."
 SKONESTER_CROZIER_CHEATS_B_t_ghw:0 "Großen Religionskrieg gegen ihn beginnen"
 SKONESTER_CROZIER_CHEATS_B_t_ghw_TT:0 "Dein Glaube erklärt einen Großen Religionskrieg um den Haupttitel des Ziels. Die Armeen brechen nach 30 Tagen auf. Funktioniert nur, wenn dein Glaube keinen laufenden Großen Religionskrieg hat und das Ziel Land besitzt."
 SKONESTER_CROZIER_CHEATS_B_t_good_traits:0 "Die besten vererblichen Eigenschaften geben"
 SKONESTER_CROZIER_CHEATS_B_t_good_traits_TT:0 "Fügt dem Ziel Genie, Wunderschön, Herkules, Stark, Gescheit, Fruchtbar und Reinblütig hinzu."
 SKONESTER_CROZIER_CHEATS_B_t_guest:0 "Als Gast einladen"
 SKONESTER_CROZIER_CHEATS_B_t_guest_TT:0 "Das Ziel reist als Gast an deinen Hof, wo du es anwerben oder verheiraten kannst."
 SKONESTER_CROZIER_CHEATS_B_t_heal_all:0 "Alle seine Krankheiten und Wunden heilen"
 SKONESTER_CROZIER_CHEATS_B_t_heal_all_TT:0 "Entfernt jede Krankheit, alle Wunden und Untauglich vom Ziel."
 SKONESTER_CROZIER_CHEATS_B_t_hook:0 "Starkes Druckmittel"
 SKONESTER_CROZIER_CHEATS_B_t_hook_TT:0 "Du erhältst ein starkes Druckmittel gegen das Ziel."
 SKONESTER_CROZIER_CHEATS_B_t_hostage:0 "Als meine Geisel nehmen"
 SKONESTER_CROZIER_CHEATS_B_t_hostage_TT:0 "Das Ziel wird als Geisel an deinen Hof gebracht. Funktioniert nicht bei Herrschern oder bei jemandem, der bereits eine Geisel ist."
 SKONESTER_CROZIER_CHEATS_B_t_hostage_free:0 "Geisel nach Hause schicken"
 SKONESTER_CROZIER_CHEATS_B_t_hostage_free_TT:0 "Ist das Ziel eine Geisel, kehrt es nach Hause zurück."
 SKONESTER_CROZIER_CHEATS_B_t_house_name:0 "Meinem Haus seinen Hausnamen geben"
 SKONESTER_CROZIER_CHEATS_B_t_house_name_TT:0 "Dein Haus wird nach dem Haus des Ziels umbenannt. Ihr müsst beide einem Haus angehören."
 SKONESTER_CROZIER_CHEATS_B_t_hybrid_culture:0 "Mischkultur mit seiner Kultur erschaffen"
 SKONESTER_CROZIER_CHEATS_B_t_hybrid_culture_TT:0 "Erschafft eine neue Mischkultur aus deiner Kultur und der des Ziels, genau wie die normale Aktion zum Erschaffen einer Mischkultur, einschließlich der üblichen Prestigekosten. Bewirkt nichts, wenn ihr dieselbe Kultur habt."
 SKONESTER_CROZIER_CHEATS_B_t_ill:0 "Krank machen"
 SKONESTER_CROZIER_CHEATS_B_t_ill_TT:0 "Gibt dem Ziel die Eigenschaft Krank (eine leichte Erkrankung)."
 SKONESTER_CROZIER_CHEATS_B_t_immortal:0 "Unsterblich machen"
 SKONESTER_CROZIER_CHEATS_B_t_immortal_TT:0 "Gibt dem Ziel die Eigenschaft Unsterblich: Es altert optisch nicht mehr und kann nicht an Altersschwäche sterben. Außerdem heilt es die Altersleiden Welkender Verstand, Trübe Augen, Schwaches Herz, Brüchige Knochen und Gebrechlich, und ist das Ziel älter als 25, wird sein Aussehen auf 25 eingefroren (das angezeigte Alter zählt weiter)."
 SKONESTER_CROZIER_CHEATS_B_t_incapable:0 "Untauglich machen"
 SKONESTER_CROZIER_CHEATS_B_t_incapable_TT:0 "Gibt dem Ziel die Eigenschaft Untauglich: Es kann nicht regieren, und ein Regent übernimmt."
 SKONESTER_CROZIER_CHEATS_B_t_independent:0 "Unabhängig machen"
 SKONESTER_CROZIER_CHEATS_B_t_independent_TT:0 "Das Ziel löst sich von seinem Lehnsherrn und wird unabhängig."
 SKONESTER_CROZIER_CHEATS_B_t_infertile:0 "Unfruchtbar machen"
 SKONESTER_CROZIER_CHEATS_B_t_infertile_TT:0 "Gibt dem Ziel die Eigenschaft Unfruchtbar."
 SKONESTER_CROZIER_CHEATS_B_t_knight_force:0 "Immer Ritter"
 SKONESTER_CROZIER_CHEATS_B_t_knight_force_TT:0 "Setzt den Ritterstatus des Ziels auf „immer“, sodass es seinem Lehnsherrn stets als Ritter dient. Funktioniert nur, wenn es an seinem aktuellen Hof Ritter sein kann."
 SKONESTER_CROZIER_CHEATS_B_t_knight_off:0 "Nie Ritter"
 SKONESTER_CROZIER_CHEATS_B_t_knight_off_TT:0 "Setzt den Ritterstatus des Ziels auf „nie“, sodass es nicht als Ritter dient."
 SKONESTER_CROZIER_CHEATS_B_t_lands_faith:0 "Seine Ländereien zu meinem Glauben und meiner Kultur bekehren"
 SKONESTER_CROZIER_CHEATS_B_t_lands_faith_TT:0 "Jede Grafschaft im Reich des Ziels, einschließlich der Grafschaften seiner Vasallen, wechselt zu deinem Glauben und deiner Kultur."
 SKONESTER_CROZIER_CHEATS_B_t_language:0 "Seine Sprache lernen"
 SKONESTER_CROZIER_CHEATS_B_t_language_TT:0 "Du lernst die Sprache der Kultur des Ziels."
 SKONESTER_CROZIER_CHEATS_B_t_legitimize:0 "Bastard legitimieren"
 SKONESTER_CROZIER_CHEATS_B_t_legitimize_TT:0 "Ersetzt die Eigenschaft Bastard des Ziels durch Legitimierter Bastard."
 SKONESTER_CROZIER_CHEATS_B_t_lowborn:0 "Zu niederer Geburt machen"
 SKONESTER_CROZIER_CHEATS_B_t_lowborn_TT:0 "Entfernt das Ziel aus seiner Dynastie und seinem Haus."
 SKONESTER_CROZIER_CHEATS_B_t_marry_me:0 "Heirate mich"
 SKONESTER_CROZIER_CHEATS_B_t_marry_me_TT:0 "Du heiratest das Ziel sofort."
 SKONESTER_CROZIER_CHEATS_B_t_mortal:0 "Unsterblichkeit entfernen"
 SKONESTER_CROZIER_CHEATS_B_t_mortal_TT:0 "Entfernt die Eigenschaft Unsterblich vom Ziel."
 SKONESTER_CROZIER_CHEATS_B_t_old:0 "Auf 75 setzen"
 SKONESTER_CROZIER_CHEATS_B_t_old_TT:0 "Ist das Ziel jünger als 75, wird sein Alter auf 75 gesetzt."
 SKONESTER_CROZIER_CHEATS_B_t_opinion:0 "Meinung von mir +100"
 SKONESTER_CROZIER_CHEATS_B_t_opinion_TT:0 "Das Ziel erhält +100 Meinung von dir."
 SKONESTER_CROZIER_CHEATS_B_t_play_as:0 "ALS DIESER CHARAKTER SPIELEN"
 SKONESTER_CROZIER_CHEATS_B_t_play_as_TT:0 "Du wechselst sofort zu diesem Charakter. Dein aktueller Charakter bleibt am Leben und wird von der KI gesteuert. Nutze „Zu meinem vorherigen Charakter zurückkehren“ in Skonester Cheats, um zurückzuwechseln."
 SKONESTER_CROZIER_CHEATS_B_t_pneumonic:0 "Lungenentzündung geben"
 SKONESTER_CROZIER_CHEATS_B_t_pneumonic_TT:0 "Gibt dem Ziel eine Lungenentzündung, eine schwere und oft tödliche Krankheit."
 SKONESTER_CROZIER_CHEATS_B_t_prestige_zero:0 "Prestige und Frömmigkeit entziehen"
 SKONESTER_CROZIER_CHEATS_B_t_prestige_zero_TT:0 "Nimmt dem Ziel 10.000 Prestige und 10.000 Frömmigkeit, was es tief ins Minus bringen kann."
 SKONESTER_CROZIER_CHEATS_B_t_primary_spouse:0 "Zu meinem Hauptehepartner machen"
 SKONESTER_CROZIER_CHEATS_B_t_primary_spouse_TT:0 "Das Ziel (bereits dein Ehepartner) wird dein Hauptehepartner."
 SKONESTER_CROZIER_CHEATS_B_t_rel_best_friend:0 "Zu meinem besten Freund machen"
 SKONESTER_CROZIER_CHEATS_B_t_rel_best_friend_TT:0 "Das Ziel wird dein bester Freund."
 SKONESTER_CROZIER_CHEATS_B_t_rel_blood_brother:0 "Zu meinem Blutsbruder machen"
 SKONESTER_CROZIER_CHEATS_B_t_rel_blood_brother_TT:0 "Das Ziel wird dein Blutsbruder."
 SKONESTER_CROZIER_CHEATS_B_t_rel_friend:0 "Zu meinem Freund machen"
 SKONESTER_CROZIER_CHEATS_B_t_rel_friend_TT:0 "Das Ziel wird dein Freund."
 SKONESTER_CROZIER_CHEATS_B_t_rel_lover:0 "Zu meiner Affäre machen"
 SKONESTER_CROZIER_CHEATS_B_t_rel_lover_TT:0 "Das Ziel wird deine Affäre."
 SKONESTER_CROZIER_CHEATS_B_t_rel_mentor:0 "Zu meinem Mentor machen"
 SKONESTER_CROZIER_CHEATS_B_t_rel_mentor_TT:0 "Das Ziel wird dein Mentor."
 SKONESTER_CROZIER_CHEATS_B_t_rel_peace:0 "Rivalität mit mir beenden"
 SKONESTER_CROZIER_CHEATS_B_t_rel_peace_TT:0 "Entfernt jede Rivalen- oder Erzfeind-Beziehung zwischen dir und dem Ziel."
 SKONESTER_CROZIER_CHEATS_B_t_rel_rival:0 "Zu meinem Rivalen machen"
 SKONESTER_CROZIER_CHEATS_B_t_rel_rival_TT:0 "Das Ziel wird dein Rivale."
 SKONESTER_CROZIER_CHEATS_B_t_rel_soulmate:0 "Zu meinem Seelengefährten machen"
 SKONESTER_CROZIER_CHEATS_B_t_rel_soulmate_TT:0 "Das Ziel wird dein Seelengefährte."
 SKONESTER_CROZIER_CHEATS_B_t_remember:0 "Als zweiten Charakter merken"
 SKONESTER_CROZIER_CHEATS_B_t_remember_TT:0 "Speichert diesen Charakter als zweiten Charakter. Er wird von den Schaltflächen „Mit dem zweiten Charakter verheiraten“, „Matrilinear mit dem zweiten Charakter verheiraten“ und „Vom zweiten Charakter schwängern“ bei einem anderen Charakter verwendet."
 SKONESTER_CROZIER_CHEATS_B_t_rob_artifacts:0 "Alle seine Artefakte nehmen"
 SKONESTER_CROZIER_CHEATS_B_t_rob_artifacts_TT:0 "Verschiebt jedes Artefakt des Ziels in dein Inventar."
 SKONESTER_CROZIER_CHEATS_B_t_rob_gold:0 "Sein gesamtes Gold nehmen"
 SKONESTER_CROZIER_CHEATS_B_t_rob_gold_TT:0 "Überträgt das gesamte Gold des Ziels an dich."
 SKONESTER_CROZIER_CHEATS_B_t_saint:0 "Heiligsprechen"
 SKONESTER_CROZIER_CHEATS_B_t_saint_TT:0 "Gibt dem Ziel die Eigenschaft Heiliger."
 SKONESTER_CROZIER_CHEATS_B_t_schemes_end:0 "Alle seine Komplotte beenden"
 SKONESTER_CROZIER_CHEATS_B_t_schemes_end_TT:0 "Beendet jedes Komplott, das das Ziel betreibt."
 SKONESTER_CROZIER_CHEATS_B_t_schemes_expose:0 "Alle seine Komplotte aufdecken"
 SKONESTER_CROZIER_CHEATS_B_t_schemes_expose_TT:0 "Jedes verborgene Komplott, das das Ziel betreibt, wird aufgedeckt."
 SKONESTER_CROZIER_CHEATS_B_t_secret_cannibal:0 "Geheimnis geben: Kannibalismus"
 SKONESTER_CROZIER_CHEATS_B_t_secret_cannibal_TT:0 "Das Ziel erhält ein Kannibalen-Geheimnis, das du bereits kennst, sodass du es erpressen oder bloßstellen kannst. Bewirkt nichts, wenn es offen Kannibale ist."
 SKONESTER_CROZIER_CHEATS_B_t_secret_deviant:0 "Geheimnis geben: Perversion"
 SKONESTER_CROZIER_CHEATS_B_t_secret_deviant_TT:0 "Das Ziel erhält ein Perversen-Geheimnis, das du bereits kennst, sodass du es erpressen oder bloßstellen kannst. Funktioniert nur bei Erwachsenen, die nicht bereits offen pervers sind."
 SKONESTER_CROZIER_CHEATS_B_t_secret_homosexual:0 "Geheimnis geben: Sodomie"
 SKONESTER_CROZIER_CHEATS_B_t_secret_homosexual_TT:0 "Das Ziel erhält ein Sodomiten-Geheimnis, das du bereits kennst, sodass du es erpressen oder bloßstellen kannst. Funktioniert nur bei erwachsenen Männern, die nicht offen Sodomiten sind."
 SKONESTER_CROZIER_CHEATS_B_t_secret_witch:0 "Geheimnis geben: Hexerei"
 SKONESTER_CROZIER_CHEATS_B_t_secret_witch_TT:0 "Das Ziel erhält ein Hexen-Geheimnis, das du bereits kennst, sodass du es erpressen oder bloßstellen kannst. Bewirkt nichts, wenn es offen eine Hexe ist."
 SKONESTER_CROZIER_CHEATS_B_t_secrets:0 "Alle Geheimnisse erfahren"
 SKONESTER_CROZIER_CHEATS_B_t_secrets_TT:0 "Jedes Geheimnis des Ziels wird dir enthüllt."
 SKONESTER_CROZIER_CHEATS_B_t_secrets_erase:0 "Alle seine Geheimnisse löschen"
 SKONESTER_CROZIER_CHEATS_B_t_secrets_erase_TT:0 "Löscht jedes Geheimnis des Ziels, sodass niemand es erpressen oder bloßstellen kann."
 SKONESTER_CROZIER_CHEATS_B_t_sex_asexual:0 "Sexuelle Orientierung: asexuell"
 SKONESTER_CROZIER_CHEATS_B_t_sex_asexual_TT:0 "Setzt die sexuelle Orientierung des Ziels auf asexuell."
 SKONESTER_CROZIER_CHEATS_B_t_sex_bisexual:0 "Sexuelle Orientierung: bisexuell"
 SKONESTER_CROZIER_CHEATS_B_t_sex_bisexual_TT:0 "Setzt die sexuelle Orientierung des Ziels auf bisexuell."
 SKONESTER_CROZIER_CHEATS_B_t_sex_heterosexual:0 "Sexuelle Orientierung: heterosexuell"
 SKONESTER_CROZIER_CHEATS_B_t_sex_heterosexual_TT:0 "Setzt die sexuelle Orientierung des Ziels auf heterosexuell."
 SKONESTER_CROZIER_CHEATS_B_t_sex_homosexual:0 "Sexuelle Orientierung: homosexuell"
 SKONESTER_CROZIER_CHEATS_B_t_sex_homosexual_TT:0 "Setzt die sexuelle Orientierung des Ziels auf homosexuell."
 SKONESTER_CROZIER_CHEATS_B_t_skills_down:0 "Alle Werte −5"
 SKONESTER_CROZIER_CHEATS_B_t_skills_down_TT:0 "Senkt alle sechs Werte des Ziels um 5."
 SKONESTER_CROZIER_CHEATS_B_t_skills_up:0 "Alle Werte +5"
 SKONESTER_CROZIER_CHEATS_B_t_skills_up_TT:0 "Erhöht alle sechs Werte des Ziels um 5."
 SKONESTER_CROZIER_CHEATS_B_t_take_all:0 "Alle seine Titel nehmen"
 SKONESTER_CROZIER_CHEATS_B_t_take_all_TT:0 "Du nimmst jeden Titel ab Grafschaftsrang, den das Ziel hält, als wäre er erobert. Baronien gehen mit ihrer Grafschaft. Ein Glaubensoberhaupt-Titel wird nie genommen."
 SKONESTER_CROZIER_CHEATS_B_t_take_primary:0 "Seinen Haupttitel nehmen"
 SKONESTER_CROZIER_CHEATS_B_t_take_primary_TT:0 "Du nimmst den Haupttitel des Ziels, als wäre er übernommen worden."
 SKONESTER_CROZIER_CHEATS_B_t_trait_tracks_max:0 "Seine Stufen-Eigenschaften maximieren"
 SKONESTER_CROZIER_CHEATS_B_t_trait_tracks_max_TT:0 "Fügt jeder Stufen-Eigenschaft, die das Ziel bereits hat, +100 Erfahrung hinzu (Schwertmeister, Jäger, Befehlshabereigenschaften und andere)."
 SKONESTER_CROZIER_CHEATS_B_t_tributary:0 "Zu meinem dauerhaften Tributzahler machen"
 SKONESTER_CROZIER_CHEATS_B_t_tributary_TT:0 "Das Ziel wird dein unterworfener Tributzahler und zahlt dir Tribut. Funktioniert nur, wenn das Ziel ein unabhängiger Herrscher ist."
 SKONESTER_CROZIER_CHEATS_B_t_tributary_free:0 "Vom Tribut befreien"
 SKONESTER_CROZIER_CHEATS_B_t_tributary_free_TT:0 "Beendet den Tributzahler-Status des Ziels."
 SKONESTER_CROZIER_CHEATS_B_t_truce:0 "10 Jahre Waffenstillstand mit mir"
 SKONESTER_CROZIER_CHEATS_B_t_truce_TT:0 "Schließt einen 10-jährigen Waffenstillstand zwischen dir und dem Ziel in beide Richtungen und ersetzt jeden bestehenden Waffenstillstand."
 SKONESTER_CROZIER_CHEATS_B_t_truce_break:0 "Waffenstillstand mit mir brechen"
 SKONESTER_CROZIER_CHEATS_B_t_truce_break_TT:0 "Entfernt jeden Waffenstillstand zwischen dir und dem Ziel in beide Richtungen."
 SKONESTER_CROZIER_CHEATS_B_t_unexcommunicate:0 "Exkommunikation aufheben"
 SKONESTER_CROZIER_CHEATS_B_t_unexcommunicate_TT:0 "Entfernt die Eigenschaft Exkommuniziert vom Ziel."
 SKONESTER_CROZIER_CHEATS_B_t_unrel_best_friend:0 "Beste Freundschaft mit mir beenden"
 SKONESTER_CROZIER_CHEATS_B_t_unrel_best_friend_TT:0 "Entfernt die Beziehung „Bester Freund“ zwischen dir und dem Ziel."
 SKONESTER_CROZIER_CHEATS_B_t_unrel_friend:0 "Freundschaft mit mir beenden"
 SKONESTER_CROZIER_CHEATS_B_t_unrel_friend_TT:0 "Entfernt die Beziehung „Freund“ zwischen dir und dem Ziel."
 SKONESTER_CROZIER_CHEATS_B_t_unrel_lover:0 "Affäre mit mir beenden"
 SKONESTER_CROZIER_CHEATS_B_t_unrel_lover_TT:0 "Entfernt die Beziehung „Affäre“ zwischen dir und dem Ziel."
 SKONESTER_CROZIER_CHEATS_B_t_unrel_soulmate:0 "Seelenverwandtschaft mit mir beenden"
 SKONESTER_CROZIER_CHEATS_B_t_unrel_soulmate_TT:0 "Entfernt die Beziehung „Seelengefährte“ zwischen dir und dem Ziel."
 SKONESTER_CROZIER_CHEATS_B_t_vassalize:0 "Zu meinem Vasallen machen"
 SKONESTER_CROZIER_CHEATS_B_t_vassalize_TT:0 "Das Ziel schwört dir Treue und wird mit all seinen Ländereien und Vasallen dein Vasall. Funktioniert nur, wenn sein höchster Titel unter deinem steht."
 SKONESTER_CROZIER_CHEATS_B_t_war_claim:0 "Krieg um seinen Haupttitel erklären"
 SKONESTER_CROZIER_CHEATS_B_t_war_claim_TT:0 "Du erhältst einen durchgesetzten Anspruch auf den Haupttitel des Ziels und erklärst sofort einen Anspruchskrieg darum. Funktioniert nur, wenn das Ziel Land besitzt."
 SKONESTER_CROZIER_CHEATS_B_t_young:0 "Auf 20 setzen"
 SKONESTER_CROZIER_CHEATS_B_t_young_TT:0 "Ist das Ziel älter als 20, wird sein Alter auf 20 gesetzt."
 SKONESTER_CROZIER_CHEATS_B_target_alliance:0 "Bündnis schließen"
 SKONESTER_CROZIER_CHEATS_B_target_alliance_TT:0 "Du und das Ziel werdet Verbündete."
 SKONESTER_CROZIER_CHEATS_B_target_court:0 "An meinen Hof holen"
 SKONESTER_CROZIER_CHEATS_B_target_court_TT:0 "Das Ziel tritt deinem Hof als Höfling bei."
 SKONESTER_CROZIER_CHEATS_B_target_culture:0 "Zu meiner Kultur bekehren"
 SKONESTER_CROZIER_CHEATS_B_target_culture_TT:0 "Das Ziel nimmt deine Kultur an."
 SKONESTER_CROZIER_CHEATS_B_target_divorce:0 "Von allen Ehepartnern scheiden"
 SKONESTER_CROZIER_CHEATS_B_target_divorce_TT:0 "Das Ziel lässt sich von all seinen Ehepartnern scheiden."
 SKONESTER_CROZIER_CHEATS_B_target_faith:0 "Zu meinem Glauben bekehren"
 SKONESTER_CROZIER_CHEATS_B_target_faith_TT:0 "Das Ziel nimmt deinen Glauben an."
 SKONESTER_CROZIER_CHEATS_B_target_garrison:0 "Seine Garnisonen auffüllen"
 SKONESTER_CROZIER_CHEATS_B_target_garrison_TT:0 "Füllt die Garnisonen jeder Provinz im Reich des Ziels auf, einschließlich seiner Vasallen."
 SKONESTER_CROZIER_CHEATS_B_target_gold_add:0 "Gold geben: 100 / 1.000 / 10.000"
 SKONESTER_CROZIER_CHEATS_B_target_gold_add_TT:0 "Gibt dem Ziel neues Gold (es stammt nicht aus deiner Schatzkammer).\nDie Menge hängt von der Einstellung „Mengen“ oben in Skonester Cheats ab: Niedrig 100, Mittel 1.000, Hoch 10.000."
 SKONESTER_CROZIER_CHEATS_B_target_gold_take:0 "Gold entfernen: 100 / 1.000 / 10.000"
 SKONESTER_CROZIER_CHEATS_B_target_gold_take_TT:0 "Entfernt Gold vom Ziel (es wird vernichtet, nicht dir gegeben).\nDie Menge hängt von der Einstellung „Mengen“ oben in Skonester Cheats ab: Niedrig 100, Mittel 1.000, Hoch 10.000."
 SKONESTER_CROZIER_CHEATS_B_target_heal:0 "Krankheit und Wunden heilen"
 SKONESTER_CROZIER_CHEATS_B_target_heal_TT:0 "Entfernt Krank, Lungenentzündung und alle Wunden vom Ziel. Nutze „Alle seine Krankheiten und Wunden heilen“ für schwere Krankheiten."
 SKONESTER_CROZIER_CHEATS_B_target_heir:0 "Zu meinem designierten Nachfolger machen"
 SKONESTER_CROZIER_CHEATS_B_target_heir_TT:0 "Setzt das Ziel als deinen designierten Nachfolger ein."
 SKONESTER_CROZIER_CHEATS_B_target_imprison:0 "In meinen Kerker werfen"
 SKONESTER_CROZIER_CHEATS_B_target_imprison_TT:0 "Wirft das Ziel in deinen Kerker. Bewirkt nichts, wenn es bereits eingekerkert ist."
 SKONESTER_CROZIER_CHEATS_B_target_kill:0 "Töten"
 SKONESTER_CROZIER_CHEATS_B_target_kill_TT:0 "Das Ziel stirbt sofort durch Mord, mit dir als Mörder vermerkt."
 SKONESTER_CROZIER_CHEATS_B_target_maa_empty:0 "Sein Kriegsvolk leeren"
 SKONESTER_CROZIER_CHEATS_B_target_maa_empty_TT:0 "Entfernt alle Soldaten aus den Kriegsvolk-Regimentern des Ziels. Die Regimenter bleiben bestehen und füllen sich wie gewohnt langsam wieder auf."
 SKONESTER_CROZIER_CHEATS_B_target_maa_resize:0 "Seine Regimenter verkleinern: −1 / −2 / −5"
 SKONESTER_CROZIER_CHEATS_B_target_maa_resize_TT:0 "Jedes Kriegsvolk-Regiment des Ziels verliert dauerhaft an Regimentsgröße.\nDie Menge hängt von der Einstellung „Mengen“ oben in Skonester Cheats ab: Niedrig −1, Mittel −2, Hoch −5 pro Regiment."
 SKONESTER_CROZIER_CHEATS_B_target_marry:0 "Mit dem zweiten Charakter verheiraten"
 SKONESTER_CROZIER_CHEATS_B_target_marry_TT:0 "Verheiratet das Ziel mit dem gemerkten zweiten Charakter.\nÖffne zuerst den anderen Charakter und klicke auf „Als zweiten Charakter merken“, dann kehre hierher zurück."
 SKONESTER_CROZIER_CHEATS_B_target_matrilineal:0 "Matrilinear mit dem zweiten Charakter verheiraten"
 SKONESTER_CROZIER_CHEATS_B_target_matrilineal_TT:0 "Verheiratet das Ziel mit dem gemerkten zweiten Charakter, wobei die Kinder dem Haus der Mutter angehören.\nÖffne zuerst den anderen Charakter und klicke auf „Als zweiten Charakter merken“, dann kehre hierher zurück."
 SKONESTER_CROZIER_CHEATS_B_target_pregnancy:0 "Vom zweiten Charakter schwängern"
 SKONESTER_CROZIER_CHEATS_B_target_pregnancy_TT:0 "Das Ziel wird vom gemerkten zweiten Charakter schwanger. Das Ziel muss eine Frau ab 18 Jahren sein, die nicht schwanger ist, und der zweite Charakter ein lebender Mann ab 18 Jahren.\nÖffne zuerst den anderen Charakter und klicke auf „Als zweiten Charakter merken“, dann kehre hierher zurück."
 SKONESTER_CROZIER_CHEATS_B_target_release:0 "Aus dem Kerker freilassen"
 SKONESTER_CROZIER_CHEATS_B_target_release_TT:0 "Befreit das Ziel von demjenigen, der es gefangen hält."
 SKONESTER_CROZIER_CHEATS_B_target_stress:0 "Anspannung hinzufügen: 50 / 100 / 300"
 SKONESTER_CROZIER_CHEATS_B_target_stress_TT:0 "Fügt dem Ziel Anspannung hinzu.\nDie Menge hängt von der Einstellung „Mengen“ oben in Skonester Cheats ab: Niedrig 50, Mittel 100, Hoch 300."
 SKONESTER_CROZIER_CHEATS_B_target_weak:0 "Alle Werte −100"
 SKONESTER_CROZIER_CHEATS_B_target_weak_TT:0 "Senkt alle sechs Werte des Ziels um 100, was sie praktisch auf 0 bringt."
 SKONESTER_CROZIER_CHEATS_B_toasts_toggle:0 "Benachrichtigungen nach Cheats: an/aus"
 SKONESTER_CROZIER_CHEATS_B_toasts_toggle_TT:0 "Schaltet die kleinen Einblendungen „Cheat benutzt“ / „Cheat an“ / „Cheat aus“ ein oder aus."
 SKONESTER_CROZIER_CHEATS_B_trait_tracks_max:0 "Meine Stufen-Eigenschaften maximieren"
 SKONESTER_CROZIER_CHEATS_B_trait_tracks_max_TT:0 "Fügt jeder Stufen-Eigenschaft, die du bereits hast, +100 Erfahrung hinzu (Schwertmeister, Jäger, Reisender, Frohnatur, Mystiker, Arzt, Pilger, Befehlshabereigenschaften, Turniereigenschaften und andere). Gibt dir keine neuen Eigenschaften."
 SKONESTER_CROZIER_CHEATS_B_travel_arrive:0 "Jetzt an meinem Ziel ankommen"
 SKONESTER_CROZIER_CHEATS_B_travel_arrive_TT:0 "Bist du auf Reisen, endet deine aktuelle Reise sofort an ihrem Ziel."
 SKONESTER_CROZIER_CHEATS_B_travel_safe_OFF:0 "AUS  ·  Reisetempo und Reisesicherheit +100 % × Stärke"
 SKONESTER_CROZIER_CHEATS_B_travel_safe_ON:0 "AN  ·  Reisetempo und Reisesicherheit +100 % × Stärke"
 SKONESTER_CROZIER_CHEATS_B_travel_safe_TT:0 "Deine Reisen sind pro Stärkestufe +100 % schneller und +100 % sicherer.\nDie Stärke ist der Multiplikator, der beim Einschalten oben im Panel ausgewählt ist. Um sie später zu ändern, schalte den Schalter aus, wähle eine neue Stärke und schalte ihn wieder ein.\nWechselst du zu einem anderen Charakter, geht der Bonus bei der nächsten Auto-Modus-Prüfung auf ihn über."
 SKONESTER_CROZIER_CHEATS_B_tt_enemy_army:0 "Armeen lähmen: einschalten"
 SKONESTER_CROZIER_CHEATS_B_tt_enemy_army_TT:0 "Das Ziel erhält einen dauerhaften Modifikator: Armeeschaden −95 %, Armeezähigkeit −95 % und −100 Kampfvorteil. Er bleibt bestehen, bis du ihn mit der nächsten Schaltfläche wieder ausschaltest."
 SKONESTER_CROZIER_CHEATS_B_tt_enemy_health:0 "Gesundheit −3: einschalten"
 SKONESTER_CROZIER_CHEATS_B_tt_enemy_health_TT:0 "Das Ziel erhält einen dauerhaften Gesundheitsmodifikator von −3, bis du ihn mit der nächsten Schaltfläche wieder ausschaltest."
 SKONESTER_CROZIER_CHEATS_B_tt_enemy_money:0 "Einnahmen kürzen: einschalten"
 SKONESTER_CROZIER_CHEATS_B_tt_enemy_money_TT:0 "Das Ziel erhält einen dauerhaften Modifikator von −95 % auf die monatlichen Einnahmen, bis du ihn mit der nächsten Schaltfläche wieder ausschaltest."
 SKONESTER_CROZIER_CHEATS_B_tt_enemy_speed:0 "Armeen verlangsamen: einschalten"
 SKONESTER_CROZIER_CHEATS_B_tt_enemy_speed_TT:0 "Das Ziel erhält einen dauerhaften Modifikator von −90 % auf das Bewegungstempo seiner Armeen, bis du ihn mit der nächsten Schaltfläche wieder ausschaltest."
 SKONESTER_CROZIER_CHEATS_B_tt_off_enemy_army:0 "Armeen lähmen: ausschalten"
 SKONESTER_CROZIER_CHEATS_B_tt_off_enemy_army_TT:0 "Entfernt den Armee-Lähmungsmodifikator vom Ziel."
 SKONESTER_CROZIER_CHEATS_B_tt_off_enemy_health:0 "Gesundheit −3: ausschalten"
 SKONESTER_CROZIER_CHEATS_B_tt_off_enemy_health_TT:0 "Entfernt den Gesundheitsmodifikator von −3 vom Ziel."
 SKONESTER_CROZIER_CHEATS_B_tt_off_enemy_money:0 "Einnahmen kürzen: ausschalten"
 SKONESTER_CROZIER_CHEATS_B_tt_off_enemy_money_TT:0 "Entfernt den Einnahmenmodifikator vom Ziel."
 SKONESTER_CROZIER_CHEATS_B_tt_off_enemy_speed:0 "Armeen verlangsamen: ausschalten"
 SKONESTER_CROZIER_CHEATS_B_tt_off_enemy_speed_TT:0 "Entfernt den Bewegungstempo-Modifikator vom Ziel."
 SKONESTER_CROZIER_CHEATS_B_vassals_OFF:0 "AUS  ·  Vasallenschwelle +100 × Stärke"
 SKONESTER_CROZIER_CHEATS_B_vassals_ON:0 "AN  ·  Vasallenschwelle +100 × Stärke"
 SKONESTER_CROZIER_CHEATS_B_vassals_TT:0 "Erhöht deine Vasallenschwelle um +100 pro Stärkestufe.\nDie Stärke ist der Multiplikator, der beim Einschalten oben im Panel ausgewählt ist. Um sie später zu ändern, schalte den Schalter aus, wähle eine neue Stärke und schalte ihn wieder ein.\nWechselst du zu einem anderen Charakter, geht der Bonus bei der nächsten Auto-Modus-Prüfung auf ihn über."
 SKONESTER_CROZIER_CHEATS_CLOSE_TT:0 "Das Cheat-Panel schließen."
