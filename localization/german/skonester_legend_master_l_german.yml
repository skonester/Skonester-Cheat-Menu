 skonester_legend_master.0902.t: "Legenden-Ausbreitungsgeschwindigkeit"
 skonester_legend_master.spread_speed_desc: "Bestimme, wie schnell die Legenden dieses Charakters auf angrenzende Provinzen übergreifen (gilt für alle zugehörigen Legenden)."
 skonester_legend_master.0902.speed_normal: "🔄 Normale Geschwindigkeit (keine Beschleunigung)"
 skonester_legend_master.0902.speed_fast: "・ Schneller (+50%)"
 skonester_legend_master.0902.speed_very_fast: "・ Sehr schnell (+100%)"
 skonester_legend_master.0902.speed_instant: "💥 Sofortige Ausbreitung (+5000%)"

 skonester_legend_spread_speed_fast_modifier: "Legendenausbreitung · Schneller"
 skonester_legend_spread_speed_fast_modifier_desc: "Legenden breiten sich um +50% schneller auf angrenzende Provinzen aus."
 skonester_legend_spread_speed_very_fast_modifier: "Legendenausbreitung · Sehr schnell"
 skonester_legend_spread_speed_very_fast_modifier_desc: "Legenden breiten sich um +100% schneller auf angrenzende Provinzen aus."
 skonester_legend_spread_speed_instant_modifier: "Legendenausbreitung · Sofort"
 skonester_legend_spread_speed_instant_modifier_desc: "Legenden breiten sich um +5000% schneller auf angrenzende Provinzen aus."

 skonester_legend_master_spread_cheat_modifier: "Legendenausbreitung · Maximale Geschwindigkeit"
 skonester_legend_master_spread_cheat_modifier_desc: "Die Ausbreitungsgeschwindigkeit der Legenden wurde stark erhöht (kompatibel mit älteren Versionen)."
 legend_spread_debug_modifier: "Legendenausbreitung · Debug"
 legend_spread_debug_modifier_desc: "Debug-Modifikator: Extrem schnelle Legendenausbreitung."

 skonester_legend_spread_barony_modifier: "Legendenausbreitung · Baronie"
 skonester_legend_spread_barony_modifier_desc: "Durch die Legende erhalten die Baronie Boni auf Entwicklungsfortschritt, Meinungen und Truppengröße."
 skonester_legend_spread_county_modifier: "Legendenausbreitung · Grafschaft"
 skonester_legend_spread_county_modifier_desc: "Durch die Legende erhalten die Grafschaft Boni auf Entwicklungsfortschritt, Meinungen und Truppengröße (rechtsgültig)."
