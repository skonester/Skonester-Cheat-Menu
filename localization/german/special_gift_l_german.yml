l_german:
 special_gift_interaction:0 "#bold #X L#!#N e#!#X b#!#N e#!#X n#!#N d#!#X i#!#N g#!#X e#!#N s#! #X W#!#N a#!#X s#!#N s#!#X e#!#N r#! #!"
 special_gift_interaction_desc:0 "Gewährt [recipient.GetShortUINameNoTooltip] die Wahrheit, die Clavius im leeren Grab fand – einen Trank, der den Geist von den Ketten der Materie befreit."
 special_gift_interaction_tooltip:0 "Erhebt Euch, [recipient.GetShortUINameNoTooltip]. Reiche vergehen zu Staub, doch wir bleiben bestehen. Trinkt und findet den #E Frieden#! in Euch selbst."

 special_gift_interaction_2:0 "#bold #X L#!#N e#!#X b#!#N e#!#X n#!#N d#!#X i#!#N g#!#X e#!#N s#! #X W#!#N a#!#X s#!#N s#!#X e#!#N r#! #!"
 special_gift_interaction_desc_2:0 "Teilt den Kelch mit [recipient.GetShortUINameNoTooltip] und verbindet Eure Seelen jenseits der Mächte, die über diese Welt herrschen."
 special_gift_interaction_tooltip_2:0 "Mein geliebter [recipient.GetFirstNameNoTooltip], »Zwei Dinge, die sich niemals versöhnen konnten«, haben ihre Vereinigung in uns gefunden. Trinkt, damit wir gemeinsam für immer in der Stille verweilen."

 special_gift_interaction_3:0 "#bold #X L#!#N e#!#X b#!#N e#!#X n#!#N d#!#X i#!#N g#!#X e#!#N s#! #X W#!#N a#!#X s#!#N s#!#X e#!#N r#! #!"
 special_gift_interaction_desc_3:0 "Übertragt [recipient.GetShortUINameNoTooltip] die Bürde der Wacht und sorgt dafür, dass die Linie Mariens sich über die Vergänglichkeit der Natur erhebt."
 special_gift_interaction_tooltip_3:0 "Mein Kind, der #E Menschensohn#! lebt in Euch. Folgt ihm nach! Trinkt und werdet zum Anker, der den Strom der Zeit überdauert."

 special_gift_interaction_4:0 "#bold #X L#!#N e#!#X b#!#N e#!#X n#!#N d#!#X i#!#N g#!#X e#!#N s#! #X W#!#N a#!#X s#!#N s#!#X e#!#N r#! #!"
 special_gift_interaction_desc_4:0 "Gewährt [recipient.GetShortUINameNoTooltip] die Lebenskraft der Zehnten Legion – eine Treue, die nicht durch Gold, sondern durch die Ewigkeit des Geistes geschmiedet wurde."
 special_gift_interaction_tooltip_4:0 "Waffenbruder [recipient.GetShortUINameNoTooltip] – trinkt. Der Krieg währt lange, und der Tod ist ein Schlaf, den wir uns nicht länger leisten können. Haltet mit mir die Stellung."

 trait_water_of_life:0 "Wächter des Wortes"
 trait_water_of_life_desc:0 "Dieser Charakter hat aus dem von Clavius Aquila bewachten Kelch getrunken und trägt nun die Pflicht des Ewigen Wächters. Die Zeit kann weder den Körper schwächen noch den Geist trüben. Jahrhunderte des Dienstes verheißen Weisheit, Stärke und einen unerschütterlichen Willen.\n\n#P Erneuerung:#! Bestehende Altersleiden, Handlungsunfähigkeit, Wunden und Krankheiten werden beim Empfang des Segens, beim Laden des Spielstands und während der monatlichen Erneuerung beseitigt."
 trait_water_of_life_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] hat als Wächter des Wortes die Wacht von Clavius Aquila übernommen. Ein altersloser Körper, ein unermüdlicher Geist und beständiger Glaube stärken den Hüter des Grals.\n\n#P Erneuerung:#! Altersleiden, Handlungsunfähigkeit, Wunden und Krankheiten werden beim Laden des Spielstands und während der monatlichen Erneuerung beseitigt."