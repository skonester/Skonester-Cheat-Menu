l_german:

 start_searching_for_water_of_life_decision:0 "Ein Tag ohne Tod"
 start_searching_for_water_of_life_decision_tooltip:1 "Clavius fand den Frieden, den er suchte, nicht in Rom, sondern im #E Nous#! Marias. So bewahrt er ihre Blutlinie auf ewig."

 start_searching_for_water_of_life_decision_desc:0 "#F »Ich habe zwei Dinge gesehen, die sich nicht miteinander vereinbaren lassen: einen Mann, der zweifellos tot war, und eben diesen Mann, der wieder lebte.«#!\n\nAls Tribun Clavius Aquila dem Wahnsinn Roms entfloh, folgte er jener, die von den anderen verworfen wurde. Wie das *Evangelium der Maria* berichtet, stellte Petrus sie infrage: »Hat Er wirklich mit einer Frau gesprochen, ohne unser Wissen?« Doch Levi entgegnete: »Wenn der Erlöser sie für würdig hielt – wer bist du, sie zurückzuweisen?«\n\nClavius wurde zum Schwert dieser Würdigkeit. Um Maria – verborgen hinter Haaren, rot gefärbt wie römischer Lehm – und ihre geheimen Kinder zu schützen, trank er aus dem Kelch. Er wurde zum Anker gegen die Auflösung der Materie und bewahrte die Wahrheit, die sie lehrte: #'Der Menschensohn ist in euch. Folgt ihm nach!'#!\n\n#P Der Tribun starb niemals. Noch immer wandelt er über die Erde – der ewige Wächter der Gnosis.#!\n\n#X #bold ~ TRIBUN DER ZEHNTEN, HÜTER DER STILLE ~\n   ~ »ER LIEBTE SIE MEHR ALS UNS.« ~\n~ BARBARA, DIE WIEDERGEBORENE, WIRD SICH ERHEBEN ~ #!#!"

 start_searching_for_water_of_life_decision_start:0 "#Y #bold *»Friede sei mit euch. Tragt meinen Frieden in euch selbst.«#!"

 start_searching_for_water_of_life_decision_proceed:0 "Das Siegel des Grabes wurde gebrochen – und mit ihm die Macht des Todes. Clavius lebt im Verborgenen weiter und wartet auf den Nachkommen, der das #E Nous#! (den Geist) seiner geliebten Maria in sich trägt. Nehmt Euren Platz in der #P Linie Barbaras#! – der wiedergeborenen Magdalena – ein. Erlangt #Z den Schutz des Tribunen#! sowie einen #E Anspruch auf den Gral#!, doch hütet Euch vor der Eifersucht der Orthodoxen."

 start_searching_for_water_of_life_decision_stress:0 "Maria lehrte: »Wo der Geist ist, dort ist auch der Schatz.« Doch Clavius verweilte über Jahrhunderte im Fleisch, während sie in die Stille einging. Kann ich diese Trennung ertragen?"

 start_searching_for_water_of_life_decision_stress_lazy:0 "#N »Hütet euch, damit euch niemand in die Irre führt.« Ein Wächter darf nicht schlafen. Mit der Eigenschaft [GetTrait('lazy').GetName( GetPlayer )] zerfällt die Disziplin, die nötig ist, um den #E Menschensohn in sich selbst#! zu suchen.#!"

 start_searching_for_water_of_life_decision_confirm:0 "Alle Naturen kehren zu ihrem Ursprung zurück."

