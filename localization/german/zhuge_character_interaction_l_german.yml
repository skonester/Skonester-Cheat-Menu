l_german:
 zhuge_organize_titles:0 "De-jure-Struktur ordnen"
 zhuge_organize_titles_desc:0 "Auf Geheiß von Krone und Zepter sollen sich alle Ländereien und Vasallen ihrem rechtmäßigen Lehnsherrn unterwerfen und in dessen Herrschaft eingegliedert werden."

 zhuge_destroy_title:0 "Primärtitel zerstören"
 zhuge_destroy_title_desc:0 "Zerschmettere deine eigene Krone und tilge den Titel aus der Geschichte, als hätte er niemals existiert – ein kühner Schritt, doch für die meisten reine Torheit."

 zhuge_buff_01:0 "Kaiserliche Ermächtigung"
 zhuge_buff_01_desc:0 "Trinke tief aus dem Kelch der Macht, auch wenn jeder Schluck die Kerze deines Lebens ein wenig schneller abbrennen lässt."

 zhuge_buff_01_tt:0 "Die Eigenschaft „Kaiserliche Ermächtigung“ umschalten?"

 zhuge_buff_02:0 "Großmarschall"
 zhuge_buff_02_desc:0 "Befehlshaber zahlloser Banner, Hüter der Grenzen und Schrecken aller Eidbrecher. Eine Gestalt, deren Taten in den Met-Hallen besungen werden."

 zhuge_buff_02_tt:0 "Die Eigenschaft „Großmarschall“ umschalten?"

 zhuge_buff_03:0 "Großgelehrter"
 zhuge_buff_03_desc:0 "Hüter uralten Wissens und Schreiber der Weisheit, dessen Feder das Reich besser lenkt als hundert Schwerter."
 zhuge_buff_03_tt:0 "Die Eigenschaft „Großgelehrter“ umschalten?"

 zhuge_buff_04:0 "Ihre Sprache erlernen"
 zhuge_buff_04_desc:0 "Durch Verstand oder Zauberei eignest du dir die Sprache eines fremden Volkes nahezu augenblicklich an."
 zhuge_buff_04_tt:0 "Diese Sprache erlernen?"

 zhuge_buff_05:0 "Ritterehre verleihen"
 zhuge_buff_05_desc:0 "Verleihe diesem Ritter Ruhm und Ehre, damit sein Name in Hallen und an Herden gleichermaßen gepriesen werde."
 zhuge_buff_05_tt:0 "Die Eigenschaft „Ritterehre“ umschalten?"
 zhuge_buff_05_high_tt:0 "2.500 Ruhm hinzufügen (füllt die [accolade|E] vollständig)."
 zhuge_buff_05_low_tt:0 "500 Ruhm hinzufügen."
 zhuge_buff_05_delete01_tt:0 "500 Ruhm entfernen."
 zhuge_buff_05_delete02_tt:0 "Ruhm auf null zurücksetzen."

 daddy_pika_add_strong_hook:0 "Starkes Druckmittel erhalten"
 daddy_pika_add_strong_hook_desc:0 "Erringe ein mächtiges Druckmittel über diese Person – eine verborgene Kette, unsichtbar und doch unzerbrechlich."

 strong_test_hook:0 "Göttliche Bindung"
 strong_hook:0 "Göttliche Bindung"
 strong_hook_desc:0 "Diese Seele richtet ihre Gebete an eine unsichtbare Macht. Ob die Götter erhören oder sich bei Met und Gelächter über sie amüsieren, bleibt ein Geheimnis."

 zhuge_bloodline_03:0 "Von Barbara gesalbt"
 zhuge_bloodline_03_desc:0 "Diese Person ist unter allen hervorgehoben; ihr Blut trägt einen besonderen göttlichen Segen."
 zhuge_bloodline_03_tt:0 "Die Eigenschaft „Göttliche Blutlinie“ umschalten?"

 zhuge_yixue_01:0 "Medizinisches Wunder"
 zhuge_yixue_01_desc:0 "Heile Leib und Seele von allen Gebrechen und verwandle Schwäche in eine Kraft, um die selbst die Götter beneiden könnten."
 zhuge_yixue_01_tt:0 "Das medizinische Wunder anwenden?"

 zhuge_yixue_02:0 "Persönlichkeit korrigieren"
 zhuge_yixue_02_desc:0 "Was einst durch schlechte Charakterzüge verdorben war, wird wieder ins Gleichgewicht gebracht, als hätte ein Heiliger selbst den Geist berührt."
 zhuge_yixue_02_tt:0 "Die Persönlichkeit dieses Charakters korrigieren?"

 zhueg_yixue_03:0 "Laster entfernen"
 zhueg_yixue_03_desc:0 "Rauch, Trunk und andere Laster werden ausgetrieben – auch wenn die Schankwirte den Verlust eines treuen Stammgastes beklagen dürften."
 zhueg_yixue_03_tt:0 "Diese Laster entfernen?"

 zhuge_yixue_04:0 "Angeborene Eigenschaften verleihen"
 zhuge_yixue_04_desc:0 "Verleihe außergewöhnliche Gaben des Geistes und Körpers – Genie, Stärke, Schönheit und Scharfsinn."
 zhuge_yixue_04_tt:0 "Angeborene Eigenschaften verleihen?"

 zhuge_yixue_05:0 "Immun gegen Seuchen"
 zhuge_yixue_05_desc:0 "Keine schwere Krankheit kann diese Seele heimsuchen (kleine Erkrankungen können dich jedoch weiterhin treffen, liebes Kind)."
 zhuge_yixue_05_tt:0 "Seuchenimmunität umschalten?"

 zhuge_yixue_06:0 "Arzt- oder Bildungsstufe verbessern"
 zhuge_yixue_06_desc:0 "Erhebe die Bildung dieser Person auf höchste Stufen, als wäre sie von den größten Gelehrten vergangener Zeiten unterrichtet worden ... oder zumindest von einem ausgesprochen trinkfesten Skalden."
 zhuge_yixue_06_tt:0 "Bildungsstufe verbessern?"

 zhuge_set_relation_interaction:0 "Beziehung festlegen"
 zhuge_set_relation_interaction_desc:0 "Bestimme das Verhältnis zwischen dir und [recipient.GetShortUIName] neu – Freund, Feind oder irgendetwas dazwischen."
 
 zhuge_add_truce_interaction:0 "Waffenstillstand anpassen"
 zhuge_danx_hd_01_desc:0 "Einseitig (erhalten)"
 zhuge_danx_give_01_desc:0 "Einseitig (gewähren)"
 zhuge_danx_sx_01_desc:0 "Beidseitig"
 zhuge_danx_sx_02_desc:0 "Waffenstillstand aufheben"
 ZHUGE_TRUCE:0 "#Y Zhuge-Waffenstillstand zur Gesichtswahrung#!"
 zhuge_remove_truce_effect:0 "Dein [truce|E] ist beendet – so viel zum „ewigen Frieden“."

 zhuge_set_authority_inter:0 "Autoritätsstufe festlegen"
 zhuge_set_authority_inter_desc:0 "Bestimme die Macht der Krone – von kaum wahrnehmbar bis hin zum unumstößlichen Willen des Herrschers."
 zhuge_set_authority_title:0 "Autoritätsstufe festlegen"
 zhuge_set_authority_desc:0 "Wähle die gewünschte Autoritätsstufe:"
 zhuge_set_authority_0:0 "Autonome Vasallen"
 zhuge_set_authority_1:0 "Begrenzte Autorität"
 zhuge_set_authority_2:0 "Hohe Autorität"
 zhuge_set_authority_3:0 "Absolute Autorität"
 zhuge_set_authority_cancel:0 "Abbrechen"

 zhuge_set_artifact_interaction:0 "Glänzendes Artefakt beschwören"
 zhuge_set_artifact_interaction_desc:0 "Siehe da! Ein Relikt erscheint. Hinterfrage dein Glück besser nicht."

 zhuge_kill_xingzh_house_interaction:0 "Dem Adel einen kleinen Schubs geben (von der Klippe)"
 zhuge_kill_xingzh_house_interaction_desc:0 "Diese edlen Häuser sind träge und selbstzufrieden geworden. Zeit für einen kleinen Frühjahrsputz ... direkt an der Klippe."

 zhuge_huoqu_artifact_interaction:0 "Königliche Leihgabe (natürlich nur vorübergehend)"
 zhuge_huoqu_artifact_interaction_desc:0 "Ein wahrlich prachtvoller Schatz. Ich werde ihn eine Weile für dich aufbewahren."

 zhuge_jiequ_artifact_player:0 "Schöner Schatz. Den nehme ich."

 zhuge_liuguan_interaction:0 "Befrieden und eingliedern"
 zhuge_liuguan_interaction_desc:0 "„Du bist ein treuer Untertan“, verkündet die Krone. Nun werde Teil meines Reiches."

 zhuge_select_succeed:0 "Das Geschlecht des Kindes ist durch Schicksal und Erlass besiegelt!"

 zhuge_great_steppe:0 " #bold Steppensaison ändern#!"
 zhuge_great_steppe_desc:0 "Bestimme die Jahreszeit der Steppe – Schnee, Frühling oder Sommer."

 zhuge_ymbuff_02:0 "Mandat der Nomaden"
 zhuge_ymbuff_02_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] gilt als vom Himmel gesandt."

 zhuge_mpo_qiyue:0 "Tributvertrag ändern"
 zhuge_mpo_qiyue_desc:0 "Passe die Bedingungen des Tributvertrags mit [recipient.GetShortUINameNoTooltip] nach Belieben an – geschickt wie ein Jarl beim Feilschen um das letzte Fass Met."

 zhuge_lifexp_all_xp:0 "Lebensstil-Fertigkeiten verbessern"
 zhuge_lifexp_all_xp_desc:0 "#bold #P Schalte sämtliche Lebensstil-Fertigkeiten und Talente frei.#!#!"