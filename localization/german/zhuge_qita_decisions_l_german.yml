  # Entscheidung: Amulett des Kreuzzugs
  zhuge_huangzu_add:0 "Das Amulett des Kreuzzugs"
  zhuge_huangzu_add_desc:0 "Als der Himmel leise flüsterte, trat Barbara die Gesalbte sanft zurück. Ihre Gestalt schimmerte wie das letzte Flackern einer Kerze im Morgengrauen. Ihre Gewänder wurden leichter, ihr Haar löste sich in weiche silberne Strähnen, und der gütige Ausdruck ihres Gesichts erblühte aufs Neue. Als dein Blick sich klärte, stand vor dir nicht länger die entschlossene Prophetin, sondern eine sanfte Gestalt – strahlend, voller Hoffnung und Güte.\n„Auserwählter Pilger“, sprach Barbara die Gesalbte leise, „ich bin durch viele Ströme der Zeit gereist. Die Bürde ruht nicht länger auf meinen Schultern. Das Licht muss nun in einem anderen wohnen – geboren aus der Erde und doch bereit zu leuchten.“\n„Jahwe ist das ewige Licht. Jeschua ist die nie verlöschende Flamme“, sagte sie sanft. „Nun gehe ich über euer Zeitalter hinaus, denn in einem anderen Strom der Zeit ruft mich eine weitere stille Nacht.“\nSie lächelte – warm und rein, ihr Lachen erklang wie zarte Glockenspiele im Wind. „Das Feuer gehört nun dir. Ich bin frei, zu den ewigen Strömen zurückzukehren und muss nicht länger jedes Leid der Welt mit ansehen. Hüte das Licht mit Sorgfalt, und es wird auch dich behüten.“\nDann trat ihre Gestalt in einen Glanz, sanfter als die Sonne, und löste sich in Licht ohne Schatten auf, in Freude ohne Abschied. An der Stelle, an der sie gestanden hatte, spürtest du die Wärme des Lebens in deinen Adern und das Amulett, das sanft gegen dein Herz schlug.\nBarbara die Gesalbte war fort. Doch ihr Licht lebte weiter – in dir."

