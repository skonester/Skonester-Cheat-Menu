  # Erbstück
  chuanguoyuxi_cn:0 "Amulett des Kreuzzugs"
  chuanguoyuxi_cn_description:0 "Geschmiedet von einer Frau an den Ufern des Sees Genezareth im alten Judäa, zum Gedenken an ihre eigene Erlösung. Dieses wundersame Amulett wurde mit einer Kunstfertigkeit geschaffen, die das Vermögen gewöhnlicher Sterblicher überstieg. Es wurde durch viele Länder getragen, bis es schließlich den Dienern der Heiligen Kirche übergeben wurde. Diese erkannten darin eine Reliquie verborgener göttlicher Vorsehung und spendeten ihr ihren feierlichen Segen. Von da an galt es nicht länger als bloßes Schmuckstück, sondern als Gefäß göttlicher Autorität.\n\nDie Chronisten berichten, dass seine Oberfläche mit geheimnisvollen Zeichen bedeckt sei, deren Bedeutung allein den Weisen bekannt ist, und dass es in einem sanften Licht schimmerte, als atme der Himmel selbst in seinem Inneren. So wurde das Amulett zum Sinnbild dafür, dass das #YHimmlische Mandat#! auf jenen Herrschern ruht, die berufen sind, Priester und Könige gleichermaßen zu schützen und Ost wie West unter dem Schatten des heiligen Rechts zu vereinen."

  # Modifikator
  zhuge_huangzu:0 "Kaiserliche Blutlinie"
  zhuge_huangzu_desc:0 "Diese Dynastie gilt als #Ygöttlich auserwähltes Kaiserhaus#! und rechtmäßiger Träger des Himmlischen Mandats.\nIhre Blutlinie gebietet über alles unter dem Himmel und steht über allen anderen Adelsgeschlechtern des Ostens wie des Westens."