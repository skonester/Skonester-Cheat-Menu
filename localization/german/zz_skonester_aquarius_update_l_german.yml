# Artefakt-Entscheidung (christlich-gnostischer Stil)
  cheat_decition_artifact:0 "Die Gaben wiedererlangen"
  cheat_description_artifact:0 "Die Welt, die wir sehen, ist nur der Schatten eines blinden Schöpfers. Diese Relikte sind Fragmente des Wahren Lichts, aus dem Pleroma entsandt, um den Kindern des Geistes den Weg in ihre wahre Heimat zu weisen."
  Artifact_1000_tooltip:0 "Erhalte die Fragmente des Pleromas."
