 game_concept_sol_unrestricted_adventurer_conquest:0 "Grenzenloses Abenteuer"
 game_concept_sol_unrestricted_adventurer_conquest_desc:0 "Wer diesen Krieg führt, lässt alles zurück und schmiedet sein Schicksal in fremden Landen neu."
 sol_unrestricted_adventurer_conquest:0 "[sol_expansion|E] – Abenteurerkrieg"
