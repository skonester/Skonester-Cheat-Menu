 sol_expansion_war_empire:0 "[sol_expansion|E] – Kaiserreichs-Feldzug"
 sol_expansion_war_empire_desc:0 "Greift zum Schwert für den größten aller Kriege – die Eroberung eines Kaiserreichs."

