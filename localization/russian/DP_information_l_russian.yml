l_russian:
  daddy_pika_information:0 "Skonester Cheat Menu Gold - Pre Chapter V"
  information_desc:0 "Это тестовая сборка Skonester Cheat Menu Gold - Pre Chapter V с GitHub. Некоторые функции могут быть незавершёнными или нестабильными. Сообщайте обо всех ошибках и ошибках скриптов на GitHub, приложив файл CK3 error.log, порядок загрузки модов и шаги для воспроизведения."
  information_TT:0 "Нажмите, чтобы просмотреть информацию о тестовой GitHub-сборке Pre Chapter V."
  
  dp_information.changelog.t:0 "Skonester Cheat Menu Gold - Pre Chapter V"
  dp_information.changelog.d:0 "Тестовая GitHub-сборка перед Chapter V. Эта версия предназначена для публичного тестирования. Сообщайте на GitHub о сломанных меню, отсутствующей локализации, ошибках событий, вылетах и неожиданном поведении."
  dp_information.useful_tips.t:0 "Полезные советы"
  dp_information.useful_tips.d:0 "Меню функций\n- Нажмите один раз, чтобы добавить, нажмите еще раз, чтобы удалить.\n- Если функция не появляется, это не значит, что мод сломан; это может указывать на жестко закодированную перезапись от Paradox или на то, что AGOT и т.д. перезаписали базовый игровой фактор. Вот почему некоторые решения не работают.\n- Из-за факторов DLC некоторые взаимодействия могут не появляться у определенных персонажей.\n- Протестируйте этот мод только с базовой игрой и этим модом, активным, например, за герцогиню Матильду, чтобы увидеть, вызывает ли этот мод ваши проблемы."
  dp_information.locations.t:0 "Тестовая сборка GitHub — отчёты об ошибках"
  dp_information.locations.d:0 "Сообщайте об ошибках на GitHub. Укажите, что вы нажали, что произошло, какой результат ожидался, порядок загрузки модов и соответствующие строки из Documents/Paradox Interactive/Crusader Kings III/logs/error.log."
  
  use_new_system:0 "Новая система"
  use_new_system_desc:0 "Старая система была заменена на новую. Хотите попробовать её?"
  use_new_system_tooltip:0 "Нажатие на это вызовет событие."
