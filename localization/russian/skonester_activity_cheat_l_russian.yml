l_russian:
 skonester_cheat_menu_activity_cheat_menu_interaction: "Деятельность / Образ жизни"
 skonester_cheat_menu_activity_cheat_menu_interaction_desc: "Принудительные праздники, охоты, турниры; пропуск расходов на пир; пропуск или мгновенное завершение этапов деятельности."
 skonester_cheat_menu.3091.t: "Читы для деятельности"
 skonester_cheat_menu.3091.desc: "Контроль деятельности и образа жизни [skonester_cheat_menu_target.GetShortUIName]. При размещении сначала добавляются золото и престиж; стандартные требования (ранг, культура, DLC) всё ещё могут блокировать некоторые типы."
 skonester_cheat_menu.3092.t: "Развлекательная деятельность"
 skonester_cheat_menu.3092.desc: "Проведение от [skonester_cheat_menu_target.GetShortUIName]. ИИ попытается провести деятельность с предварительным добавлением ресурсов. Если меню не открывается, проверьте уведомления или список действий; попробуйте переключить пропуск расходов."
 skonester_cheat_menu.3097.t: "Провести другие мероприятия"
 skonester_cheat_menu.3097.desc: "Туры, свадьбы, паломничества и другие специальные мероприятия; могут действовать более строгие стандартные ограничения."
 skonester_activity_cheat_toast_toggle_title: "Читы · Расходы на праздник"
 skonester_activity_cheat_toast_toggle_desc: "Эффект игнорирования расходов на пир применён к персонажу."
 skonester_activity_cheat_toast_host_title: "Читы для деятельности · Попытка проведения"
 skonester_activity_cheat_toast_host_desc: "Ресурсы добавлены, деятельность запущена в столице/локации; проверьте список деятельности или уведомления."
 skonester_activity_cheat_toast_skip_phase_title: "Фаза деятельности пропущена"
 skonester_activity_cheat_toast_complete_title: "Деятельность завершена"
 skonester_activity_cheat_toast_cancel_title: "Деятельность аннулирована"
 skonester_activity_cheat_toast_Fast_phase_title: ""
