l_russian:
 skonester_cheat_menu_ai_ai_interaction: "Близость"
 skonester_cheat_menu_ai_ai_interaction_desc: "Уединённая ночь с [recipient.GetShortUIName]. Тусклые свечи, плотно задёрнутые занавески — предайтесь чувствам полностью или остановитесь, пока не стало слишком поздно."
 skonester_cheat_menu.0010.t: "~ Близость ~ Весенняя ночь"
 skonester_cheat_menu.0010.desc: "Слуги разошлись. Вы и [skonester_cheat_menu_target.GetShortUIName] скрыты от мира за шелковыми занавесками. Дыхание [skonester_cheat_menu_target.GetHerHis] наполняет воздух, а свечи мягко мерцают. Войны и государственные дела могут подождать."
 skonester_cheat_menu.0010.desc_lover: "Рядом с возлюбленным [skonester_cheat_menu_target.GetShortUIName]. Каждое прикосновение хранит тепло прошлых встреч. Аромат благовоний смешивается с запахом кожи, словно сама ночь соединяет вас воедино."
 skonester_cheat_menu.0010.desc_spouse: "Ваш супруг [skonester_cheat_menu_target.GetShortUIName] плавно снимает одежду, в глазах горит привычная страсть. Сегодня вечером [skonester_cheat_menu_target.GetSheHe] напомнит вам, что связывает вас."
 skonester_cheat_menu.0010.desc_concubine: "Ваша наложница [skonester_cheat_menu_target.GetShortUIName] опускает взгляд и медленно снимает халат. Она отлично знает, как себя вести, и манит вас на диван тихими словами и лёгкими касаниями пальцев."
 skonester_cheat_menu.0010.desc_camp: "Снаружи палатки воет ветер, а внутри царит тепло и тонкий аромат. [skonester_cheat_menu_target.GetShortUIName] лежит на походной койке — постель ещё хранит тепло, а тело пылает жаром. Украденный час спокойствия на войне слаще любых победных криков."
 skonester_cheat_menu.0010.continue: "Предаться соблазну..."
 skonester_cheat_menu.0010.cancel: "Отступить назад"
 skonester_cheat_menu.0012.t: "Мгновения близости..."
 skonester_cheat_menu.0012.desc: "Ночь подошла к концу, но вы всё ещё лежите в одной постели. Щёки [skonester_cheat_menu_target.GetShortUIName] покраснели, а пальцы нежно лежат на вашем запястье. За занавесками стемнело, но тепло между вами не угасает."
 skonester_cheat_menu.0012.ok: "Помочь ей одеться"
