l_russian:
 SKONESTER_CROZIER_CHEATS_B_auto_ascension_OFF:0 "выкл  ·  Авто: каждый новый правитель — лучшие гены и +5 к навыкам"
 SKONESTER_CROZIER_CHEATS_B_auto_ascension_ON:0 "ВКЛ  ·  Авто: каждый новый правитель — лучшие гены и +5 к навыкам"
 SKONESTER_CROZIER_CHEATS_B_auto_ascension_TT:0 "Персонаж, за которого ты играешь, получает «Гениальность», «Геракл» и «Прелесть», а также +5 ко всем шести навыкам. Каждый персонаж получает это лишь один раз, так что и каждый наследник, за которого ты продолжишь игру, тоже это получит.\nПроверяется при включении и затем при каждой проверке авто-режимов (по умолчанию раз в месяц, см. кнопки частоты ниже)."
 SKONESTER_CROZIER_CHEATS_B_auto_forever_young_OFF:0 "выкл  ·  Авто: вечная молодость — мне всегда не больше 30"
 SKONESTER_CROZIER_CHEATS_B_auto_forever_young_ON:0 "ВКЛ  ·  Авто: вечная молодость — мне всегда не больше 30"
 SKONESTER_CROZIER_CHEATS_B_auto_forever_young_TT:0 "Всякий раз, когда тебе больше 30 лет, твой возраст снова становится 30.\nПроверяется при включении и затем при каждой проверке авто-режимов (по умолчанию раз в месяц, см. кнопки частоты ниже)."
 SKONESTER_CROZIER_CHEATS_B_auto_gold_floor_OFF:0 "выкл  ·  Неисчерпаемая казна: золото не ниже 1000"
 SKONESTER_CROZIER_CHEATS_B_auto_gold_floor_ON:0 "ВКЛ  ·  Неисчерпаемая казна: золото не ниже 1000"
 SKONESTER_CROZIER_CHEATS_B_auto_gold_floor_TT:0 "Всякий раз, когда у тебя меньше 1 000 золота (включая долг), казна пополняется ровно до 1 000.\nПроверяется при включении и затем при каждой проверке авто-режимов (по умолчанию раз в месяц, см. кнопки частоты ниже)."
 SKONESTER_CROZIER_CHEATS_B_auto_no_prison_OFF:0 "выкл  ·  Мгновенно: меня невозможно заключить в темницу"
 SKONESTER_CROZIER_CHEATS_B_auto_no_prison_ON:0 "ВКЛ  ·  Мгновенно: меня невозможно заключить в темницу"
 SKONESTER_CROZIER_CHEATS_B_auto_no_prison_TT:0 "Как только тебя заключают в темницу, ты оказываешься на свободе.\nТакже проверяется при включении и при каждой проверке авто-режимов."
 SKONESTER_CROZIER_CHEATS_B_auto_prestige_floor_OFF:0 "выкл  ·  Авто: престиж и благочестие не ниже 1000"
 SKONESTER_CROZIER_CHEATS_B_auto_prestige_floor_ON:0 "ВКЛ  ·  Авто: престиж и благочестие не ниже 1000"
 SKONESTER_CROZIER_CHEATS_B_auto_prestige_floor_TT:0 "Всякий раз, когда твой престиж или благочестие ниже 1 000, они пополняются ровно до 1 000.\nПроверяется при включении и затем при каждой проверке авто-режимов (по умолчанию раз в месяц, см. кнопки частоты ниже)."
 SKONESTER_CROZIER_CHEATS_B_child_now:0 "Мгновенно родить ребёнка от супруга (гений, геркулес, красавец)"
 SKONESTER_CROZIER_CHEATS_B_child_now_TT:0 "Новорождённый ребёнок от тебя и одного из твоих супругов появляется при твоём дворе с чертами «Гениальность», «Геракл» и «Прелесть». Нужен супруг. Ребёнок входит в твою династию."
 SKONESTER_CROZIER_CHEATS_B_combo_army:0 "Армия мечты: полки больше и полны, ополчение, 5 рыцарей, полководцы-гении"
 SKONESTER_CROZIER_CHEATS_B_combo_army_TT:0 "По порядку: каждый полк профессионалов увеличивается (+1 / +2 / +5 на полк, настройка «Кол-во») и пополняется до полной численности; ополчение и гарнизоны в твоих провинциях восстанавливаются; к твоему двору присоединяются 5 сильных рыцарей (доблесть 40, военное дело 18); ты, твои рыцари и командиры армий получаете черты «Логист», «Военная инженерия», «Организованность» и «Агрессивная атака»."
 SKONESTER_CROZIER_CHEATS_B_combo_emergency:0 "Экстренная помощь: исцеление, свобода, оборонительные войны выиграны, долг погашен"
 SKONESTER_CROZIER_CHEATS_B_combo_emergency_TT:0 "По порядку: излечение твоих болезней и ран; освобождение из темницы; победа во всех войнах, где ты главный обороняющийся; погашение долга; срыв всех интриг против тебя; возвращение домой твоих родственников, удерживаемых в заложниках."
 SKONESTER_CROZIER_CHEATS_B_combo_family:0 "Идеальная семья: исцеление, идеальный наследник, образование детей"
 SKONESTER_CROZIER_CHEATS_B_combo_family_TT:0 "По порядку: ты, твои супруги и дети излечиваетесь от всех болезней, ран и дефектов; твой наследник получает «Гениальность», «Геракл», «Прелесть» и +10 ко всем навыкам; каждый твой живой ребёнок со свойством образования получает его высший уровень."
 SKONESTER_CROZIER_CHEATS_B_combo_golden_age:0 "Золотой век: долги погашены, золото ×2, всё построено, развитие"
 SKONESTER_CROZIER_CHEATS_B_combo_golden_age_TT:0 "По порядку: погасить весь долг, удвоить золото, построить все возможные здания во всей державе, повысить развитие графств (+1 / +5 / +20, настройки «Кол-во» и «Охват») и развитие столицы (+5 / +20 / +50, настройка «Кол-во»)."
 SKONESTER_CROZIER_CHEATS_B_combo_rise:0 "Восхождение: независимость, своё королевство и все свободные титулы"
 SKONESTER_CROZIER_CHEATS_B_combo_rise_TT:0 "По порядку: ты становишься независимым от сюзерена; если твой высший титул ниже королевства, для тебя создаётся новое королевство; для тебя создаются все свободные титулы герцогств, королевств и империй над твоими графствами."
 SKONESTER_CROZIER_CHEATS_B_combo_throne:0 "Путь к трону: сюзерен любит, назначает наследником, выборщики за меня, претензия на его титул"
 SKONESTER_CROZIER_CHEATS_B_combo_throne_TT:0 "Для вассала: сюзерен получает +100 мнения о тебе и назначает тебя предопределённым наследником, все его остальные вассалы обязаны голосовать за тебя 10 лет, а ты получаешь обоснованную претензию на главный титул сюзерена."
 SKONESTER_CROZIER_CHEATS_B_cooldowns_reset:0 "Без перезарядки: сбросить кулдауны всех решений и взаимодействий"
 SKONESTER_CROZIER_CHEATS_B_cooldowns_reset_TT:0 "Снимает твои перезарядки с 501 решения и 558 взаимодействий, так что всё, что помечено как «ещё не готово», снова можно использовать."
 SKONESTER_CROZIER_CHEATS_B_disease_player_OFF:0 "выкл  ·  Без болезней: иммунитет и очистка"
 SKONESTER_CROZIER_CHEATS_B_disease_player_ON:0 "ВКЛ  ·  Без болезней: иммунитет и очистка"
 SKONESTER_CROZIER_CHEATS_B_disease_player_TT:0 "Даёт тебе черту «Защита от болезней» (+50 к здоровью, не даёт заразиться обычными болезнями, не являющимися поветриями) и излечивает все твои болезни, включая чуму, оспу и рак. Болезни снова излечиваются при каждой проверке авто-режимов.\nСобытия всё ещё могут напрямую наградить тебя болезнью.\nЕсли ты переключишься на другого персонажа, бонус перейдёт к нему при следующей проверке авто-режимов."
 SKONESTER_CROZIER_CHEATS_B_domain_OFF:0 "выкл  ·  Лимит домена +50"
 SKONESTER_CROZIER_CHEATS_B_domain_ON:0 "ВКЛ  ·  Лимит домена +50"
 SKONESTER_CROZIER_CHEATS_B_domain_TT:0 "Позволяет лично владеть без штрафа на +50 графств больше за каждый шаг силы.\nСила — множитель, выбранный вверху панели в момент включения. Чтобы изменить её позже, выключи переключатель, выбери новую силу и включи его снова.\nЕсли ты переключишься на другого персонажа, бонус перейдёт к нему при следующей проверке авто-режимов."
 SKONESTER_CROZIER_CHEATS_B_enemy_commander:0 "Снять командиров с армий цели"
 SKONESTER_CROZIER_CHEATS_B_enemy_commander_TT:0 "Снимает командира с каждой армии цели. ИИ может назначить новых."
 SKONESTER_CROZIER_CHEATS_B_enemy_deplete:0 "Убрать выбранный процент войск цели (25% / 50% / 90%)"
 SKONESTER_CROZIER_CHEATS_B_enemy_deplete_TT:0 "Поднятые армии цели безвозвратно теряют часть солдат.\nКоличество зависит от настройки «Кол-во» вверху панели «Читы Skonester»: мало 25%, средне 50%, много 90%."
 SKONESTER_CROZIER_CHEATS_B_enemy_supply:0 "Обнулить снабжение армий цели"
 SKONESTER_CROZIER_CHEATS_B_enemy_supply_TT:0 "Каждая поднятая армия цели теряет все припасы."
 SKONESTER_CROZIER_CHEATS_B_forge_crown:0 "Создать легендарный артефакт: Корона владыки"
 SKONESTER_CROZIER_CHEATS_B_forge_crown_TT:0 "Добавляет в твой инвентарь новую легендарную корону: +10 к дипломатии, +5 престижа в месяц, +25 к мнению вассалов и +10 к общему мнению. Никогда не изнашивается."
 SKONESTER_CROZIER_CHEATS_B_freq_month:0 "Авто-режимы работают раз в месяц"
 SKONESTER_CROZIER_CHEATS_B_freq_month_TT:0 "Авто-режимы и обновление бонусов срабатывают раз в 30 дн. Это настройка по умолчанию. Вступает в силу после следующей проверки."
 SKONESTER_CROZIER_CHEATS_B_freq_quarter:0 "Авто-режимы работают раз в квартал"
 SKONESTER_CROZIER_CHEATS_B_freq_quarter_TT:0 "Авто-режимы и обновление бонусов срабатывают раз в 90 дн. Меньше нагружает игру. Вступает в силу после следующей проверки."
 SKONESTER_CROZIER_CHEATS_B_freq_week:0 "Авто-режимы работают раз в неделю"
 SKONESTER_CROZIER_CHEATS_B_freq_week_TT:0 "Авто-режимы и обновление бонусов срабатывают раз в 7 дн. Вступает в силу после следующей проверки."
 SKONESTER_CROZIER_CHEATS_B_gold:0 "Добавить золото (1 000 / 10 000 / 100 000)"
 SKONESTER_CROZIER_CHEATS_B_gold_TT:0 "Добавляет золото в твою казну.\nКоличество зависит от настройки «Кол-во» вверху панели «Читы Skonester»: мало 1 000, средне 10 000, много 100 000."
 SKONESTER_CROZIER_CHEATS_B_gold_double:0 "Удвоить моё золото"
 SKONESTER_CROZIER_CHEATS_B_gold_double_TT:0 "Добавляет столько золота, сколько у тебя есть сейчас. Не работает, пока у тебя долг."
 SKONESTER_CROZIER_CHEATS_B_good_traits_me:0 "Мне: лучшие врождённые черты (Гений, Красота, Геркулес, Сильный, Проницательный, Плодовитый, Чистая кровь)"
 SKONESTER_CROZIER_CHEATS_B_good_traits_me_TT:0 "Добавляет «Гениальность», «Прелесть», «Геракл», «Сила», «Проницательность», «Плодовитость» и «Чистая кровь»."
 SKONESTER_CROZIER_CHEATS_B_gp_complete:0 "Великие проекты: мгновенно завершить все мои"
 SKONESTER_CROZIER_CHEATS_B_gp_complete_TT:0 "Все твои грандиозные проекты сразу завершаются, вклады не нужны."
 SKONESTER_CROZIER_CHEATS_B_grandeur_max:0 "Величие двора: максимум"
 SKONESTER_CROZIER_CHEATS_B_grandeur_max_TT:0 "Устанавливает величие двора на 100. Работает только при наличии монаршего двора."
 SKONESTER_CROZIER_CHEATS_B_health_OFF:0 "выкл  ·  Здоровье +50"
 SKONESTER_CROZIER_CHEATS_B_health_ON:0 "ВКЛ  ·  Здоровье +50"
 SKONESTER_CROZIER_CHEATS_B_health_TT:0 "Добавляет +50 к здоровью за каждый шаг силы. Обычное здоровье — однозначное число, так что даже при ×1 ты практически никогда не умрёшь от плохого здоровья.\nСила — множитель, выбранный вверху панели в момент включения. Чтобы изменить её позже, выключи переключатель, выбери новую силу и включи его снова.\nЕсли ты переключишься на другого персонажа, бонус перейдёт к нему при следующей проверке авто-режимов."
 SKONESTER_CROZIER_CHEATS_B_immortal_player_OFF:0 "выкл  ·  Бессмертие от старости"
 SKONESTER_CROZIER_CHEATS_B_immortal_player_ON:0 "ВКЛ  ·  Бессмертие от старости"
 SKONESTER_CROZIER_CHEATS_B_immortal_player_TT:0 "Даёт тебе штатную черту «Бессмертие»: ты перестаёшь стареть внешне и не можешь умереть от старости. Тебя всё ещё можно убить, казнить, сразить в бою или погубить событием. Также излечивает возрастные недуги «Угасающий разум», «Помутненное зрение», «Слабое сердце», «Хрупкие кости» и «Немощь», а если тебе больше 25 лет, твоя внешность застывает на 25 (указанный возраст продолжает расти).\nПри выключении черта снимается, но только если её добавил этот переключатель.\nЕсли ты переключишься на другого персонажа, бонус перейдёт к нему при следующей проверке авто-режимов."
 SKONESTER_CROZIER_CHEATS_B_income_OFF:0 "выкл  ·  Личные доходы ×5"
 SKONESTER_CROZIER_CHEATS_B_income_ON:0 "ВКЛ  ·  Личные доходы ×5"
 SKONESTER_CROZIER_CHEATS_B_income_TT:0 "Увеличивает весь твой ежемесячный доход на +400% за каждый шаг силы (×1 — в пять раз больше обычного дохода).\nСила — множитель, выбранный вверху панели в момент включения. Чтобы изменить её позже, выключи переключатель, выбери новую силу и включи его снова.\nЕсли ты переключишься на другого персонажа, бонус перейдёт к нему при следующей проверке авто-режимов."
 SKONESTER_CROZIER_CHEATS_B_income_year:0 "Доход за год вперёд — прямо сейчас"
 SKONESTER_CROZIER_CHEATS_B_income_year_TT:0 "Мгновенно добавляет золото, равное твоему текущему годовому доходу. Обычный доход не затрагивается."
 SKONESTER_CROZIER_CHEATS_B_influence_OFF:0 "выкл  ·  Влияние: +5 в месяц × сила"
 SKONESTER_CROZIER_CHEATS_B_influence_ON:0 "ВКЛ  ·  Влияние: +5 в месяц × сила"
 SKONESTER_CROZIER_CHEATS_B_influence_TT:0 "Ты получаешь +5 влияния каждый месяц за каждый шаг силы. Влияние используется только бюрократическими правительствами.\nСила — множитель, выбранный вверху панели в момент включения. Чтобы изменить её позже, выключи переключатель, выбери новую силу и включи его снова.\nЕсли ты переключишься на другого персонажа, бонус перейдёт к нему при следующей проверке авто-режимов."
 SKONESTER_CROZIER_CHEATS_B_innovation_OFF:0 "выкл  ·  Нововведения культуры: скорость +100% × сила"
 SKONESTER_CROZIER_CHEATS_B_innovation_ON:0 "ВКЛ  ·  Нововведения культуры: скорость +100% × сила"
 SKONESTER_CROZIER_CHEATS_B_innovation_TT:0 "Твоя культура открывает инновации на +100% быстрее за каждый шаг силы. Работает, только пока ты — культурный идеолог своей культуры.\nСила — множитель, выбранный вверху панели в момент включения. Чтобы изменить её позже, выключи переключатель, выбери новую силу и включи его снова.\nЕсли ты переключишься на другого персонажа, бонус перейдёт к нему при следующей проверке авто-режимов."
 SKONESTER_CROZIER_CHEATS_B_instant_empire:0 "Мгновенная империя: титулы, де-юре, соседи и императорская корона"
 SKONESTER_CROZIER_CHEATS_B_instant_empire_TT:0 "По порядку: для тебя создаются все свободные титулы герцогств, королевств и империй над твоими графствами; ты получаешь новый имперский титул, если его нет; независимые правители в твоих де-юре землях и все соседние независимые правители приносят тебе присягу, если они ниже тебя по рангу; ты забираешь все де-юре графства своих герцогств и высших титулов (создавая все титулы, которые это открывает); все уровни — на максимум."
 SKONESTER_CROZIER_CHEATS_B_legend_spread_OFF:0 "выкл  ·  Мои легенды распространяются быстрее +100% × сила"
 SKONESTER_CROZIER_CHEATS_B_legend_spread_ON:0 "ВКЛ  ·  Мои легенды распространяются быстрее +100% × сила"
 SKONESTER_CROZIER_CHEATS_B_legend_spread_TT:0 "Твои легенды распространяются на +100% быстрее за каждый шаг силы.\nСила — множитель, выбранный вверху панели в момент включения. Чтобы изменить её позже, выключи переключатель, выбери новую силу и включи его снова.\nЕсли ты переключишься на другого персонажа, бонус перейдёт к нему при следующей проверке авто-режимов."
 SKONESTER_CROZIER_CHEATS_B_legit_gain_OFF:0 "выкл  ·  Легитимность: +1 в месяц и прирост +100% × сила"
 SKONESTER_CROZIER_CHEATS_B_legit_gain_ON:0 "ВКЛ  ·  Легитимность: +1 в месяц и прирост +100% × сила"
 SKONESTER_CROZIER_CHEATS_B_legit_gain_TT:0 "Ты получаешь +1 легитимности каждый месяц, а вся получаемая легитимность увеличивается на +100% — за каждый шаг силы.\nСила — множитель, выбранный вверху панели в момент включения. Чтобы изменить её позже, выключи переключатель, выбери новую силу и включи его снова.\nЕсли ты переключишься на другого персонажа, бонус перейдёт к нему при следующей проверке авто-режимов."
 SKONESTER_CROZIER_CHEATS_B_legit_level:0 "Легитимность: +1 уровень"
 SKONESTER_CROZIER_CHEATS_B_legit_level_TT:0 "Повышает легитимность на один уровень. Работает, только если твой персонаж использует легитимность (правители — да, большинство безземельных персонажей — нет)."
 SKONESTER_CROZIER_CHEATS_B_levels_max_all:0 "Все уровни на максимум (престиж, благочестие, легитимность, величие)"
 SKONESTER_CROZIER_CHEATS_B_levels_max_all_TT:0 "Уровень престижа и благочестия — 5, легитимность +5 уровней, если твой персонаж её использует, и величие двора — 100 при наличии монаршего двора."
 SKONESTER_CROZIER_CHEATS_B_levy_OFF:0 "выкл  ·  Размер ополчения: +100% × сила"
 SKONESTER_CROZIER_CHEATS_B_levy_ON:0 "ВКЛ  ·  Размер ополчения: +100% × сила"
 SKONESTER_CROZIER_CHEATS_B_levy_TT:0 "Все твои владения дают на +100% больше ополчения за каждый шаг силы.\nСила — множитель, выбранный вверху панели в момент включения. Чтобы изменить её позже, выключи переключатель, выбери новую силу и включи его снова.\nЕсли ты переключишься на другого персонажа, бонус перейдёт к нему при следующей проверке авто-режимов."
 SKONESTER_CROZIER_CHEATS_B_life_OFF:0 "выкл  ·  Семья: продолжительность жизни +10 лет × сила"
 SKONESTER_CROZIER_CHEATS_B_life_ON:0 "ВКЛ  ·  Семья: продолжительность жизни +10 лет × сила"
 SKONESTER_CROZIER_CHEATS_B_life_TT:0 "Ты, твои супруги и дети получаете +10 лет к продолжительности жизни за каждый шаг силы.\nСила — множитель, выбранный вверху панели в момент включения. Чтобы изменить её позже, выключи переключатель, выбери новую силу и включи его снова.\nЕсли ты переключишься на другого персонажа, бонус перейдёт к нему при следующей проверке авто-режимов."
 SKONESTER_CROZIER_CHEATS_B_lifestyle_xp_OFF:0 "выкл  ·  Опыт образа жизни: +100% × сила"
 SKONESTER_CROZIER_CHEATS_B_lifestyle_xp_ON:0 "ВКЛ  ·  Опыт образа жизни: +100% × сила"
 SKONESTER_CROZIER_CHEATS_B_lifestyle_xp_TT:0 "Опыт образа жизни растёт на +100% быстрее за каждый шаг силы, так что перки открываются раньше.\nСила — множитель, выбранный вверху панели в момент включения. Чтобы изменить её позже, выключи переключатель, выбери новую силу и включи его снова.\nЕсли ты переключишься на другого персонажа, бонус перейдёт к нему при следующей проверке авто-режимов."
 SKONESTER_CROZIER_CHEATS_B_lifestyle_xp_all:0 "Опыт всех образов жизни (500 / 2 000 / 10 000)"
 SKONESTER_CROZIER_CHEATS_B_lifestyle_xp_all_TT:0 "Добавляет опыт во все шесть образов жизни (дипломатия, военное дело, управление, интрига, учёность, странствия).\nКоличество зависит от настройки «Кол-во» вверху панели «Читы Skonester»: мало 500, средне 2 000, много 10 000 на образ жизни."
 SKONESTER_CROZIER_CHEATS_B_long_reign_OFF:0 "выкл  ·  Бонус долгого правления +100% × сила"
 SKONESTER_CROZIER_CHEATS_B_long_reign_ON:0 "ВКЛ  ·  Бонус долгого правления +100% × сила"
 SKONESTER_CROZIER_CHEATS_B_long_reign_TT:0 "Бонус за долгое правление накапливается на +100% быстрее за каждый шаг силы.\nСила — множитель, выбранный вверху панели в момент включения. Чтобы изменить её позже, выключи переключатель, выбери новую силу и включи его снова.\nЕсли ты переключишься на другого персонажа, бонус перейдёт к нему при следующей проверке авто-режимов."
 SKONESTER_CROZIER_CHEATS_B_me_cure:0 "Мне: убрать все врождённые и полученные дефекты"
 SKONESTER_CROZIER_CHEATS_B_me_cure_TT:0 "Убирает врождённые и приобретённые дефекты: слепота, один глаз, обезображенное лицо, серьёзное увечье, заикание, косолапие, горб, карликовость, плод кровосмешения, хрипы, гемофилия, долговязость, псориаз, альбинизм, слабость, тупость, низкий интеллект, некрасивость, слабое телосложение, бездетность, депрессия, помешательство, одержимость, проказа, болезненность, немощь и недееспособность."
 SKONESTER_CROZIER_CHEATS_B_me_fit:0 "Идеальная фигура (вес в норму)"
 SKONESTER_CROZIER_CHEATS_B_me_fit_TT:0 "Устанавливает нормальный вес и закрепляет его как целевой, убирая штрафы за полноту или худобу."
 SKONESTER_CROZIER_CHEATS_B_me_heal_all:0 "Исцелиться от всех болезней и ран"
 SKONESTER_CROZIER_CHEATS_B_me_heal_all_TT:0 "Снимает все болезни (болезнь, лёгочная болезнь, чума, оспа, рак, чахотка, сифилис, тиф, дизентерия, корь, проказа, подагра и другие), все раны и недееспособность."
 SKONESTER_CROZIER_CHEATS_B_me_immortal_trait:0 "Мне: бессмертие от старости (навсегда, без переключателя)"
 SKONESTER_CROZIER_CHEATS_B_me_immortal_trait_TT:0 "Навсегда даёт тебе черту «Бессмертие». В отличие от переключателя бессмертия выше, выключение переключателей её не снимает. Также излечивает возрастные недуги «Угасающий разум», «Помутненное зрение», «Слабое сердце», «Хрупкие кости» и «Немощь», а если тебе больше 25 лет, твоя внешность застывает на 25 (указанный возраст продолжает расти)."
 SKONESTER_CROZIER_CHEATS_B_me_take_culture:0 "Принять культуру цели (только я)"
 SKONESTER_CROZIER_CHEATS_B_me_take_culture_TT:0 "Ты лично принимаешь культуру цели. Твои земли не меняются."
 SKONESTER_CROZIER_CHEATS_B_me_take_faith:0 "Принять веру цели (только я)"
 SKONESTER_CROZIER_CHEATS_B_me_take_faith_TT:0 "Ты лично принимаешь веру цели. Твои земли не меняются."
 SKONESTER_CROZIER_CHEATS_B_me_young:0 "Омолодить меня до 25 лет"
 SKONESTER_CROZIER_CHEATS_B_me_young_TT:0 "Если тебе больше 25 лет, твой возраст становится 25."
 SKONESTER_CROZIER_CHEATS_B_merit_gain_OFF:0 "выкл  ·  Заслуги (администрация): прирост +100% × сила"
 SKONESTER_CROZIER_CHEATS_B_merit_gain_ON:0 "ВКЛ  ·  Заслуги (администрация): прирост +100% × сила"
 SKONESTER_CROZIER_CHEATS_B_merit_gain_TT:0 "Ты получаешь заслуги на +100% быстрее за каждый шаг силы. Заслуги используются только бюрократическими правительствами.\nСила — множитель, выбранный вверху панели в момент включения. Чтобы изменить её позже, выключи переключатель, выбери новую силу и включи его снова.\nЕсли ты переключишься на другого персонажа, бонус перейдёт к нему при следующей проверке авто-режимов."
 SKONESTER_CROZIER_CHEATS_B_monthly_gold_OFF:0 "выкл  ·  Ежемесячный доход: +10 золота × сила"
 SKONESTER_CROZIER_CHEATS_B_monthly_gold_ON:0 "ВКЛ  ·  Ежемесячный доход: +10 золота × сила"
 SKONESTER_CROZIER_CHEATS_B_monthly_gold_TT:0 "Добавляет к ежемесячному доходу фиксированные +10 золота за каждый шаг силы (×1 = +10, ×100 = +1 000, ×1000 = +10 000).\nСила — множитель, выбранный вверху панели в момент включения. Чтобы изменить её позже, выключи переключатель, выбери новую силу и включи его снова.\nЕсли ты переключишься на другого персонажа, бонус перейдёт к нему при следующей проверке авто-режимов."
 SKONESTER_CROZIER_CHEATS_B_perks_all:0 "Перки: ВСЕ деревья всех образов жизни"
 SKONESTER_CROZIER_CHEATS_B_perks_all_TT:0 "Открывает сразу все 162 перка образов жизни."
 SKONESTER_CROZIER_CHEATS_B_piety_OFF:0 "выкл  ·  Благочестие: +100 в месяц"
 SKONESTER_CROZIER_CHEATS_B_piety_ON:0 "ВКЛ  ·  Благочестие: +100 в месяц"
 SKONESTER_CROZIER_CHEATS_B_piety_TT:0 "Ты получаешь +100 благочестия каждый месяц за каждый шаг силы.\nСила — множитель, выбранный вверху панели в момент включения. Чтобы изменить её позже, выключи переключатель, выбери новую силу и включи его снова.\nЕсли ты переключишься на другого персонажа, бонус перейдёт к нему при следующей проверке авто-режимов."
 SKONESTER_CROZIER_CHEATS_B_piety_add:0 "Добавить благочестие (1 000 / 10 000 / 100 000)"
 SKONESTER_CROZIER_CHEATS_B_piety_add_TT:0 "Добавляет благочестие.\nКоличество зависит от настройки «Кол-во» вверху панели «Читы Skonester»: мало 1 000, средне 10 000, много 100 000."
 SKONESTER_CROZIER_CHEATS_B_piety_level_max:0 "Уровень благочестия: максимум"
 SKONESTER_CROZIER_CHEATS_B_piety_level_max_TT:0 "Устанавливает уровень благочестия на высший (5)."
 SKONESTER_CROZIER_CHEATS_B_play_heir:0 "Играть за наследника сейчас"
 SKONESTER_CROZIER_CHEATS_B_play_heir_TT:0 "Ты переходишь к игре за своего наследника. Текущий персонаж остаётся жив и переходит под управление ИИ. Чтобы вернуться, используй «Вернуться к прежнему персонажу»."
 SKONESTER_CROZIER_CHEATS_B_play_prev:0 "Вернуться к прежнему персонажу"
 SKONESTER_CROZIER_CHEATS_B_play_prev_TT:0 "Возвращает тебя к персонажу, за которого ты играл до «Играть за наследника сейчас» или «ИГРАТЬ ЗА ЭТОГО ПЕРСОНАЖА». Работает, только если тот персонаж ещё жив."
 SKONESTER_CROZIER_CHEATS_B_prestige_OFF:0 "выкл  ·  Престиж: +100 в месяц"
 SKONESTER_CROZIER_CHEATS_B_prestige_ON:0 "ВКЛ  ·  Престиж: +100 в месяц"
 SKONESTER_CROZIER_CHEATS_B_prestige_TT:0 "Ты получаешь +100 престижа каждый месяц за каждый шаг силы.\nСила — множитель, выбранный вверху панели в момент включения. Чтобы изменить её позже, выключи переключатель, выбери новую силу и включи его снова.\nЕсли ты переключишься на другого персонажа, бонус перейдёт к нему при следующей проверке авто-режимов."
 SKONESTER_CROZIER_CHEATS_B_prestige_add:0 "Добавить престиж (1 000 / 10 000 / 100 000)"
 SKONESTER_CROZIER_CHEATS_B_prestige_add_TT:0 "Добавляет престиж.\nКоличество зависит от настройки «Кол-во» вверху панели «Читы Skonester»: мало 1 000, средне 10 000, много 100 000."
 SKONESTER_CROZIER_CHEATS_B_prestige_level_max:0 "Уровень престижа: максимум"
 SKONESTER_CROZIER_CHEATS_B_prestige_level_max_TT:0 "Устанавливает уровень престижа на высший (5)."
 SKONESTER_CROZIER_CHEATS_B_prestige_mult_OFF:0 "выкл  ·  Прирост престижа и благочестия +100% × сила"
 SKONESTER_CROZIER_CHEATS_B_prestige_mult_ON:0 "ВКЛ  ·  Прирост престижа и благочестия +100% × сила"
 SKONESTER_CROZIER_CHEATS_B_prestige_mult_TT:0 "Весь получаемый тобой престиж и благочестие увеличиваются на +100% за каждый шаг силы.\nСила — множитель, выбранный вверху панели в момент включения. Чтобы изменить её позже, выключи переключатель, выбери новую силу и включи его снова.\nЕсли ты переключишься на другого персонажа, бонус перейдёт к нему при следующей проверке авто-режимов."
 SKONESTER_CROZIER_CHEATS_B_realm_take_culture:0 "Мои графства (охват) — культура цели"
 SKONESTER_CROZIER_CHEATS_B_realm_take_culture_TT:0 "Твои графства переходят на культуру цели.\nИспользуется настройка «Охват» вверху панели «Читы Skonester»: только графства, которыми ты владеешь лично, или вся держава вместе с вассалами."
 SKONESTER_CROZIER_CHEATS_B_realm_take_faith:0 "Мои графства (охват) — вера цели"
 SKONESTER_CROZIER_CHEATS_B_realm_take_faith_TT:0 "Твои графства переходят в веру цели.\nИспользуется настройка «Охват» вверху панели «Читы Skonester»: только графства, которыми ты владеешь лично, или вся держава вместе с вассалами."
 SKONESTER_CROZIER_CHEATS_B_renown_OFF:0 "выкл  ·  Признание династии: +5 в месяц × сила"
 SKONESTER_CROZIER_CHEATS_B_renown_ON:0 "ВКЛ  ·  Признание династии: +5 в месяц × сила"
 SKONESTER_CROZIER_CHEATS_B_renown_TT:0 "Твоя династия получает +5 признания каждый месяц за каждый шаг силы.\nСила — множитель, выбранный вверху панели в момент включения. Чтобы изменить её позже, выключи переключатель, выбери новую силу и включи его снова.\nЕсли ты переключишься на другого персонажа, бонус перейдёт к нему при следующей проверке авто-режимов."
 SKONESTER_CROZIER_CHEATS_B_renown_mult_OFF:0 "выкл  ·  Прирост признания династии +100% × сила"
 SKONESTER_CROZIER_CHEATS_B_renown_mult_ON:0 "ВКЛ  ·  Прирост признания династии +100% × сила"
 SKONESTER_CROZIER_CHEATS_B_renown_mult_TT:0 "Всё признание, получаемое твоей династией, увеличивается на +100% за каждый шаг силы.\nСила — множитель, выбранный вверху панели в момент включения. Чтобы изменить её позже, выключи переключатель, выбери новую силу и включи его снова.\nЕсли ты переключишься на другого персонажа, бонус перейдёт к нему при следующей проверке авто-режимов."
 SKONESTER_CROZIER_CHEATS_B_skills_OFF:0 "выкл  ·  Все основные навыки +50"
 SKONESTER_CROZIER_CHEATS_B_skills_ON:0 "ВКЛ  ·  Все основные навыки +50"
 SKONESTER_CROZIER_CHEATS_B_skills_TT:0 "Добавляет +50 к дипломатии, военному делу, управлению, интриге, учёности и доблести за каждый шаг силы.\nСила — множитель, выбранный вверху панели в момент включения. Чтобы изменить её позже, выключи переключатель, выбери новую силу и включи его снова.\nЕсли ты переключишься на другого персонажа, бонус перейдёт к нему при следующей проверке авто-режимов."
 SKONESTER_CROZIER_CHEATS_B_skills_mult_OFF:0 "выкл  ·  Все навыки +50% × сила (процентом от текущих)"
 SKONESTER_CROZIER_CHEATS_B_skills_mult_ON:0 "ВКЛ  ·  Все навыки +50% × сила (процентом от текущих)"
 SKONESTER_CROZIER_CHEATS_B_skills_mult_TT:0 "Все шесть твоих навыков увеличиваются на +50% от текущего значения за каждый шаг силы (×2 удваивает их).\nСила — множитель, выбранный вверху панели в момент включения. Чтобы изменить её позже, выключи переключатель, выбери новую силу и включи его снова.\nЕсли ты переключишься на другого персонажа, бонус перейдёт к нему при следующей проверке авто-режимов."
 SKONESTER_CROZIER_CHEATS_B_slots_OFF:0 "выкл  ·  Доп. слоты зданий: +1 × сила (я и вассалы — по охвату)"
 SKONESTER_CROZIER_CHEATS_B_slots_ON:0 "ВКЛ  ·  Доп. слоты зданий: +1 × сила (я и вассалы — по охвату)"
 SKONESTER_CROZIER_CHEATS_B_slots_TT:0 "Каждое твоё владение получает +1 дополнительный слот здания за каждый шаг силы.\nЕсли «Охват» установлен на «вся держава», слоты получают и все твои вассалы.\nСила — множитель, выбранный вверху панели в момент включения. Чтобы изменить её позже, выключи переключатель, выбери новую силу и включи его снова.\nЕсли ты переключишься на другого персонажа, бонус перейдёт к нему при следующей проверке авто-режимов."
 SKONESTER_CROZIER_CHEATS_B_stress_OFF:0 "выкл  ·  Стресс почти не растёт"
 SKONESTER_CROZIER_CHEATS_B_stress_ON:0 "ВКЛ  ·  Стресс почти не растёт"
 SKONESTER_CROZIER_CHEATS_B_stress_TT:0 "Ты получаешь лишь 1% от обычного стресса. Сила на этот переключатель не влияет.\nЕсли ты переключишься на другого персонажа, бонус перейдёт к нему при следующей проверке авто-режимов."
 SKONESTER_CROZIER_CHEATS_B_stress_zero:0 "Снять стресс"
 SKONESTER_CROZIER_CHEATS_B_stress_zero_TT:0 "Снимает весь твой стресс."
 SKONESTER_CROZIER_CHEATS_B_t_adopt:0 "Усыновить (сделать моим ребёнком)"
 SKONESTER_CROZIER_CHEATS_B_t_adopt_TT:0 "Ты усыновляешь цель как своего ребёнка."
 SKONESTER_CROZIER_CHEATS_B_t_armies_to:0 "Телепорт: все мои армии — к столице цели"
 SKONESTER_CROZIER_CHEATS_B_t_armies_to_TT:0 "Каждая твоя армия, не участвующая в битве, мгновенно перемещается в провинцию столицы цели. Если там враги, сразу начинается битва."
 SKONESTER_CROZIER_CHEATS_B_t_artifact_claims:0 "Родовые претензии моего дома на все артефакты цели"
 SKONESTER_CROZIER_CHEATS_B_t_artifact_claims_TT:0 "Твой дом получает претензию на каждый артефакт, принадлежащий цели."
 SKONESTER_CROZIER_CHEATS_B_t_banish:0 "Изгнать цель из моего двора"
 SKONESTER_CROZIER_CHEATS_B_t_banish_TT:0 "Изгоняет цель из двора, при котором она находится."
 SKONESTER_CROZIER_CHEATS_B_t_bind:0 "Привязать цель: вассал, обожание и сильный крючок"
 SKONESTER_CROZIER_CHEATS_B_t_bind_TT:0 "По порядку: цель становится твоим вассалом со всеми своими землями (только если её высший титул ниже твоего), получает +100 мнения о тебе, а ты получаешь на неё сильный крючок."
 SKONESTER_CROZIER_CHEATS_B_t_blackmail_all:0 "Шантаж: крючки по всем известным мне тайнам цели"
 SKONESTER_CROZIER_CHEATS_B_t_blackmail_all_TT:0 "Ты получаешь сильный крючок-шантаж на цель за каждый известный тебе её секрет. Чтобы получить больше крючков, сначала используй «Узнать все секреты цели»."
 SKONESTER_CROZIER_CHEATS_B_t_blind:0 "Ослепить цель"
 SKONESTER_CROZIER_CHEATS_B_t_blind_TT:0 "Даёт цели черту «Слепота»."
 SKONESTER_CROZIER_CHEATS_B_t_child_me:0 "Ребёнок от меня и цели (беременность)"
 SKONESTER_CROZIER_CHEATS_B_t_child_me_TT:0 "Та из вас, кто женщина, беременеет вашим ребёнком. Нужны разные полы, и женщина не должна быть уже беременна."
 SKONESTER_CROZIER_CHEATS_B_t_child_now:0 "Мгновенно родить ребёнка с целью (гений, геркулес, красавец)"
 SKONESTER_CROZIER_CHEATS_B_t_child_now_TT:0 "Новорождённый ребёнок от тебя и цели появляется при твоём дворе с чертами «Гениальность», «Геракл» и «Прелесть». Нужны разные полы."
 SKONESTER_CROZIER_CHEATS_B_t_claim_all:0 "Мне: претензии на все титулы цели"
 SKONESTER_CROZIER_CHEATS_B_t_claim_all_TT:0 "Ты получаешь обоснованную претензию на каждый титул цели."
 SKONESTER_CROZIER_CHEATS_B_t_claim_primary:0 "Мне: претензия на главный титул цели"
 SKONESTER_CROZIER_CHEATS_B_t_claim_primary_TT:0 "Ты получаешь обоснованную претензию на главный титул цели."
 SKONESTER_CROZIER_CHEATS_B_t_concubine:0 "Взять цель в наложницы (наложники)"
 SKONESTER_CROZIER_CHEATS_B_t_concubine_TT:0 "Цель становится твоей наложницей (наложником). Работает только на не состоящих в браке взрослых, не находящихся в заключении."
 SKONESTER_CROZIER_CHEATS_B_t_copy_look:0 "Скопировать его внешность мне"
 SKONESTER_CROZIER_CHEATS_B_t_copy_look_TT:0 "Твои гены внешности заменяются генами цели, так что ты выглядишь как она. Твои будущие дети унаследуют новые гены."
 SKONESTER_CROZIER_CHEATS_B_t_councillor_chancellor:0 "Назначить цель канцлером"
 SKONESTER_CROZIER_CHEATS_B_t_councillor_chancellor_TT:0 "Цель занимает место канцлера в твоём совете. Прежний советник остаётся при твоём дворе.\nЦель должна подходить для должности: обычно это твой придворный или вассал."
 SKONESTER_CROZIER_CHEATS_B_t_councillor_court_chaplain:0 "Назначить цель духовником"
 SKONESTER_CROZIER_CHEATS_B_t_councillor_court_chaplain_TT:0 "Цель занимает место духовника в твоём совете. Прежний советник остаётся при твоём дворе.\nЦель должна подходить для должности: обычно это твой придворный или вассал."
 SKONESTER_CROZIER_CHEATS_B_t_councillor_marshal:0 "Назначить цель маршалом"
 SKONESTER_CROZIER_CHEATS_B_t_councillor_marshal_TT:0 "Цель занимает место маршала в твоём совете. Прежний советник остаётся при твоём дворе.\nЦель должна подходить для должности: обычно это твой придворный или вассал."
 SKONESTER_CROZIER_CHEATS_B_t_councillor_spymaster:0 "Назначить цель тайным советником"
 SKONESTER_CROZIER_CHEATS_B_t_councillor_spymaster_TT:0 "Цель занимает место тайного советника в твоём совете. Прежний советник остаётся при твоём дворе.\nЦель должна подходить для должности: обычно это твой придворный или вассал."
 SKONESTER_CROZIER_CHEATS_B_t_councillor_steward:0 "Назначить цель казначеем"
 SKONESTER_CROZIER_CHEATS_B_t_councillor_steward_TT:0 "Цель занимает место казначея в твоём совете. Прежний советник остаётся при твоём дворе.\nЦель должна подходить для должности: обычно это твой придворный или вассал."
 SKONESTER_CROZIER_CHEATS_B_t_cp_bodyguard:0 "Назначить цель телохранителем"
 SKONESTER_CROZIER_CHEATS_B_t_cp_bodyguard_TT:0 "Цель назначается на должность телохранителя при твоём дворе.\nЦель должна подходить для должности: обычно это твой придворный или вассал."
 SKONESTER_CROZIER_CHEATS_B_t_cp_champion:0 "Назначить цель поборником (чемпионом)"
 SKONESTER_CROZIER_CHEATS_B_t_cp_champion_TT:0 "Цель назначается на должность поборника при твоём дворе.\nЦель должна подходить для должности: обычно это твой придворный или вассал."
 SKONESTER_CROZIER_CHEATS_B_t_cp_court_physician:0 "Назначить цель придворным врачом"
 SKONESTER_CROZIER_CHEATS_B_t_cp_court_physician_TT:0 "Цель назначается на должность придворного врача при твоём дворе.\nЦель должна подходить для должности: обычно это твой придворный или вассал."
 SKONESTER_CROZIER_CHEATS_B_t_cp_court_tutor:0 "Назначить цель наставником"
 SKONESTER_CROZIER_CHEATS_B_t_cp_court_tutor_TT:0 "Цель назначается на должность наставника при твоём дворе.\nЦель должна подходить для должности: обычно это твой придворный или вассал."
 SKONESTER_CROZIER_CHEATS_B_t_cp_master_assassin:0 "Назначить цель мастером-убийцей"
 SKONESTER_CROZIER_CHEATS_B_t_cp_master_assassin_TT:0 "Цель назначается на должность мастера-убийцы при твоём дворе.\nЦель должна подходить для должности: обычно это твой придворный или вассал."
 SKONESTER_CROZIER_CHEATS_B_t_cp_royal_architect:0 "Назначить цель королевским архитектором"
 SKONESTER_CROZIER_CHEATS_B_t_cp_royal_architect_TT:0 "Цель назначается на должность королевского архитектора при твоём дворе.\nЦель должна подходить для должности: обычно это твой придворный или вассал."
 SKONESTER_CROZIER_CHEATS_B_t_crush:0 "Сокрушить цель: отнять золото, артефакты, все титулы и в темницу"
 SKONESTER_CROZIER_CHEATS_B_t_crush_TT:0 "По порядку: отнять у цели всё золото, все артефакты и все титулы от графства и выше (кроме титула главы конфессии), затем бросить её в твою темницу."
 SKONESTER_CROZIER_CHEATS_B_t_culture_innovations:0 "Перенять все нововведения культуры цели"
 SKONESTER_CROZIER_CHEATS_B_t_culture_innovations_TT:0 "Твоя культура получает все инновации, открытые культурой цели."
 SKONESTER_CROZIER_CHEATS_B_t_culture_traditions:0 "Скопировать традиции культуры цели (заменить свои)"
 SKONESTER_CROZIER_CHEATS_B_t_culture_traditions_TT:0 "Традиции твоей культуры заменяются традициями культуры цели."
 SKONESTER_CROZIER_CHEATS_B_t_cure:0 "Убрать цели все дефекты"
 SKONESTER_CROZIER_CHEATS_B_t_cure_TT:0 "Убирает у цели врождённые и приобретённые дефекты: слепота, один глаз, обезображенное лицо, серьёзное увечье, заикание, косолапие, горб, карликовость, плод кровосмешения, хрипы, гемофилия, долговязость, псориаз, альбинизм, слабость, тупость, низкий интеллект, некрасивость, слабое телосложение, бездетность, депрессия, помешательство, одержимость, проказа, болезненность, немощь и недееспособность."
 SKONESTER_CROZIER_CHEATS_B_t_depose:0 "Свергнуть цель (лишить всех титулов в пользу наследника)"
 SKONESTER_CROZIER_CHEATS_B_t_depose_TT:0 "Цель теряет все титулы, которые переходят к её наследнику."
 SKONESTER_CROZIER_CHEATS_B_t_disfigure:0 "Изуродовать цель"
 SKONESTER_CROZIER_CHEATS_B_t_disfigure_TT:0 "Даёт цели черту «Обезображенное лицо»."
 SKONESTER_CROZIER_CHEATS_B_t_elevate:0 "Возвысить цель: протеже, лучшие черты, навыки и золото"
 SKONESTER_CROZIER_CHEATS_B_t_elevate_TT:0 "Даёт цели «Гениальность», «Прелесть», «Геракл», «Сила», «Проницательность», «Плодовитость» и «Чистая кровь», +5 ко всем навыкам и золото.\nКоличество зависит от настройки «Кол-во» вверху панели «Читы Skonester»: мало 100, средне 1 000, много 10 000 золота."
 SKONESTER_CROZIER_CHEATS_B_t_epidemic_bubonic_plague:0 "Наслать чуму на столицу цели"
 SKONESTER_CROZIER_CHEATS_B_t_epidemic_bubonic_plague_TT:0 "Вызывает сильную вспышку болезни «Бубонная чума» в провинции столицы цели. Оно может распространиться, как любое поветрие, в том числе и на тебя."
 SKONESTER_CROZIER_CHEATS_B_t_epidemic_consumption:0 "Наслать чахотку на столицу цели"
 SKONESTER_CROZIER_CHEATS_B_t_epidemic_consumption_TT:0 "Вызывает сильную вспышку болезни «Чахотка» в провинции столицы цели. Оно может распространиться, как любое поветрие, в том числе и на тебя."
 SKONESTER_CROZIER_CHEATS_B_t_epidemic_dysentery:0 "Наслать дизентерию на столицу цели"
 SKONESTER_CROZIER_CHEATS_B_t_epidemic_dysentery_TT:0 "Вызывает сильную вспышку болезни «Дизентерия» в провинции столицы цели. Оно может распространиться, как любое поветрие, в том числе и на тебя."
 SKONESTER_CROZIER_CHEATS_B_t_epidemic_ergotism:0 "Наслать огонь святого Антония на столицу цели"
 SKONESTER_CROZIER_CHEATS_B_t_epidemic_ergotism_TT:0 "Вызывает сильную вспышку огня святого Антония (эрготизма) в провинции столицы цели. Оно может распространиться, как любое поветрие, в том числе и на тебя."
 SKONESTER_CROZIER_CHEATS_B_t_epidemic_measles:0 "Наслать корь на столицу цели"
 SKONESTER_CROZIER_CHEATS_B_t_epidemic_measles_TT:0 "Вызывает сильную вспышку болезни «Корь» в провинции столицы цели. Оно может распространиться, как любое поветрие, в том числе и на тебя."
 SKONESTER_CROZIER_CHEATS_B_t_epidemic_smallpox:0 "Наслать оспу на столицу цели"
 SKONESTER_CROZIER_CHEATS_B_t_epidemic_smallpox_TT:0 "Вызывает сильную вспышку болезни «Оспа» в провинции столицы цели. Оно может распространиться, как любое поветрие, в том числе и на тебя."
 SKONESTER_CROZIER_CHEATS_B_t_epidemic_typhus:0 "Наслать тиф на столицу цели"
 SKONESTER_CROZIER_CHEATS_B_t_epidemic_typhus_TT:0 "Вызывает сильную вспышку болезни «Тиф» в провинции столицы цели. Оно может распространиться, как любое поветрие, в том числе и на тебя."
 SKONESTER_CROZIER_CHEATS_B_t_excommunicate:0 "Отлучить цель от церкви"
 SKONESTER_CROZIER_CHEATS_B_t_excommunicate_TT:0 "Даёт цели черту «В отлучении»."
 SKONESTER_CROZIER_CHEATS_B_t_execute:0 "Казнить цель (я — палач)"
 SKONESTER_CROZIER_CHEATS_B_t_execute_TT:0 "Цель немедленно умирает — казнена, палачом записан ты."
 SKONESTER_CROZIER_CHEATS_B_t_faith_fervor_down:0 "Рвение веры цели −100 (её вера слабеет)"
 SKONESTER_CROZIER_CHEATS_B_t_faith_fervor_down_TT:0 "Вера цели теряет 100 рвения: её последователей легче обратить, а ереси становятся вероятнее."
 SKONESTER_CROZIER_CHEATS_B_t_faith_fervor_up:0 "Рвение веры цели +100"
 SKONESTER_CROZIER_CHEATS_B_t_faith_fervor_up_TT:0 "Вера цели получает 100 рвения."
 SKONESTER_CROZIER_CHEATS_B_t_faith_holy_sites:0 "Святые места веры цели — святые и для моей веры"
 SKONESTER_CROZIER_CHEATS_B_t_faith_holy_sites_TT:0 "Каждое святое место веры цели становится святым местом и для твоей веры."
 SKONESTER_CROZIER_CHEATS_B_t_family_hostages:0 "Взять в заложники всех детей цели"
 SKONESTER_CROZIER_CHEATS_B_t_family_hostages_TT:0 "Каждый живой ребёнок цели, который не является правителем и ещё не в заложниках, отправляется к твоему двору заложником."
 SKONESTER_CROZIER_CHEATS_B_t_forget:0 "Забыть второго персонажа"
 SKONESTER_CROZIER_CHEATS_B_t_forget_TT:0 "Очищает сохранённого второго персонажа."
 SKONESTER_CROZIER_CHEATS_B_t_ghw:0 "Объявить великую священную войну против цели (за её главный титул)"
 SKONESTER_CROZIER_CHEATS_B_t_ghw_TT:0 "Твоя вера объявляет великую священную войну за главный титул цели. Армии выступают через 30 дней. Работает, только если у твоей веры нет текущей великой священной войны, а у цели есть земли."
 SKONESTER_CROZIER_CHEATS_B_t_good_traits:0 "Дать цели лучшие врождённые черты"
 SKONESTER_CROZIER_CHEATS_B_t_good_traits_TT:0 "Добавляет цели «Гениальность», «Прелесть», «Геракл», «Сила», «Проницательность», «Плодовитость» и «Чистая кровь»."
 SKONESTER_CROZIER_CHEATS_B_t_guest:0 "Пригласить цель гостем ко мне двор"
 SKONESTER_CROZIER_CHEATS_B_t_guest_TT:0 "Цель отправляется гостем к твоему двору, где её можно завербовать или выдать замуж (женить)."
 SKONESTER_CROZIER_CHEATS_B_t_heal_all:0 "Исцелить цель от всех болезней и ран"
 SKONESTER_CROZIER_CHEATS_B_t_heal_all_TT:0 "Снимает с цели все болезни, все раны и недееспособность."
 SKONESTER_CROZIER_CHEATS_B_t_hook:0 "Сильный крючок на цель"
 SKONESTER_CROZIER_CHEATS_B_t_hook_TT:0 "Ты получаешь сильный крючок на цель."
 SKONESTER_CROZIER_CHEATS_B_t_hostage:0 "Взять цель в заложники ко мне"
 SKONESTER_CROZIER_CHEATS_B_t_hostage_TT:0 "Цель отправляется к твоему двору заложником. Не работает на правителей и на тех, кто уже в заложниках."
 SKONESTER_CROZIER_CHEATS_B_t_hostage_free:0 "Отпустить заложника домой"
 SKONESTER_CROZIER_CHEATS_B_t_hostage_free_TT:0 "Если цель — заложник, она возвращается домой."
 SKONESTER_CROZIER_CHEATS_B_t_house_name:0 "Назвать мой дом так же, как дом цели"
 SKONESTER_CROZIER_CHEATS_B_t_house_name_TT:0 "Твой дом переименовывается по названию дома цели. Вы оба должны принадлежать к какому-либо дому."
 SKONESTER_CROZIER_CHEATS_B_t_hybrid_culture:0 "Гибрид моей культуры с культурой цели"
 SKONESTER_CROZIER_CHEATS_B_t_hybrid_culture_TT:0 "Создаёт новую гибридную культуру из твоей культуры и культуры цели — точно так же, как обычное действие создания гибридной культуры, включая обычную стоимость в престиже. Ничего не делает, если у вас одна культура."
 SKONESTER_CROZIER_CHEATS_B_t_ill:0 "Наслать болезнь (простуда)"
 SKONESTER_CROZIER_CHEATS_B_t_ill_TT:0 "Даёт цели черту «Болезнь» (лёгкое недомогание)."
 SKONESTER_CROZIER_CHEATS_B_t_immortal:0 "Бессмертие от старости для цели"
 SKONESTER_CROZIER_CHEATS_B_t_immortal_TT:0 "Даёт цели черту «Бессмертие»: она перестаёт стареть внешне и не может умереть от старости. Также излечивает возрастные недуги «Угасающий разум», «Помутненное зрение», «Слабое сердце», «Хрупкие кости» и «Немощь», а если цели больше 25 лет, её внешность застывает на 25 (указанный возраст продолжает расти)."
 SKONESTER_CROZIER_CHEATS_B_t_incapable:0 "Сделать недееспособным"
 SKONESTER_CROZIER_CHEATS_B_t_incapable_TT:0 "Даёт цели черту «Недееспособность»: она не может править, и управление переходит к регенту."
 SKONESTER_CROZIER_CHEATS_B_t_independent:0 "Сделать цель независимой"
 SKONESTER_CROZIER_CHEATS_B_t_independent_TT:0 "Цель выходит из-под власти сюзерена и становится независимой."
 SKONESTER_CROZIER_CHEATS_B_t_infertile:0 "Сделать цель бесплодной"
 SKONESTER_CROZIER_CHEATS_B_t_infertile_TT:0 "Даёт цели черту «Бездетность»."
 SKONESTER_CROZIER_CHEATS_B_t_knight_force:0 "Сделать моим рыцарем (всегда)"
 SKONESTER_CROZIER_CHEATS_B_t_knight_force_TT:0 "Устанавливает рыцарский статус цели на «всегда», так что она всегда служит рыцарем своему сюзерену. Работает, только если цель может быть рыцарем при своём нынешнем дворе."
 SKONESTER_CROZIER_CHEATS_B_t_knight_off:0 "Запретить быть рыцарем"
 SKONESTER_CROZIER_CHEATS_B_t_knight_off_TT:0 "Устанавливает рыцарский статус цели на «никогда», так что она не служит рыцарем."
 SKONESTER_CROZIER_CHEATS_B_t_lands_faith:0 "Земли цели — моя вера и культура"
 SKONESTER_CROZIER_CHEATS_B_t_lands_faith_TT:0 "Каждое графство в державе цели, включая графства её вассалов, переходит в твою веру и культуру."
 SKONESTER_CROZIER_CHEATS_B_t_language:0 "Выучить язык цели"
 SKONESTER_CROZIER_CHEATS_B_t_language_TT:0 "Ты выучиваешь язык культуры цели."
 SKONESTER_CROZIER_CHEATS_B_t_legitimize:0 "Узаконить цель (если бастард)"
 SKONESTER_CROZIER_CHEATS_B_t_legitimize_TT:0 "Заменяет черту цели «Бастард» на «Признанный бастард»."
 SKONESTER_CROZIER_CHEATS_B_t_lowborn:0 "Лишить цель династии (сделать низкорождённой)"
 SKONESTER_CROZIER_CHEATS_B_t_lowborn_TT:0 "Исключает цель из её династии и дома."
 SKONESTER_CROZIER_CHEATS_B_t_marry_me:0 "Вступить в брак с целью (я)"
 SKONESTER_CROZIER_CHEATS_B_t_marry_me_TT:0 "Ты немедленно вступаешь в брак с целью."
 SKONESTER_CROZIER_CHEATS_B_t_mortal:0 "Снять бессмертие с цели"
 SKONESTER_CROZIER_CHEATS_B_t_mortal_TT:0 "Снимает с цели черту «Бессмертие»."
 SKONESTER_CROZIER_CHEATS_B_t_old:0 "Состарить цель до 75 лет"
 SKONESTER_CROZIER_CHEATS_B_t_old_TT:0 "Если цели меньше 75 лет, её возраст становится 75."
 SKONESTER_CROZIER_CHEATS_B_t_opinion:0 "Цель меня обожает (мнение +100)"
 SKONESTER_CROZIER_CHEATS_B_t_opinion_TT:0 "Цель получает +100 мнения о тебе."
 SKONESTER_CROZIER_CHEATS_B_t_play_as:0 "ИГРАТЬ ЗА ЭТОГО ПЕРСОНАЖА"
 SKONESTER_CROZIER_CHEATS_B_t_play_as_TT:0 "Ты немедленно переходишь к игре за этого персонажа. Текущий персонаж остаётся жив и переходит под управление ИИ. Чтобы вернуться, используй «Вернуться к прежнему персонажу» в панели «Читы Skonester»."
 SKONESTER_CROZIER_CHEATS_B_t_pneumonic:0 "Наслать тяжёлую болезнь (пневмония)"
 SKONESTER_CROZIER_CHEATS_B_t_pneumonic_TT:0 "Даёт цели «Лёгочную болезнь» — тяжёлое и часто смертельное заболевание."
 SKONESTER_CROZIER_CHEATS_B_t_prestige_zero:0 "Отнять у цели престиж и благочестие"
 SKONESTER_CROZIER_CHEATS_B_t_prestige_zero_TT:0 "Отнимает у цели 10 000 престижа и 10 000 благочестия, что может загнать её глубоко в минус."
 SKONESTER_CROZIER_CHEATS_B_t_primary_spouse:0 "Сделать цель моей главной супругой (супругом)"
 SKONESTER_CROZIER_CHEATS_B_t_primary_spouse_TT:0 "Цель (уже твой супруг) становится твоим главным супругом."
 SKONESTER_CROZIER_CHEATS_B_t_rel_best_friend:0 "Сделать моим лучшим другом"
 SKONESTER_CROZIER_CHEATS_B_t_rel_best_friend_TT:0 "Цель становится твоим лучшим другом."
