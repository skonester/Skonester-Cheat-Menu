 SKONESTER_CROZIER_CHEATS_B_t_rel_rival:0 "Сделать моим соперником"
 SKONESTER_CROZIER_CHEATS_B_t_rel_rival_TT:0 "Цель становится твоим соперником."
 SKONESTER_CROZIER_CHEATS_B_t_rel_soulmate:0 "Сделать моей родственной душой"
 SKONESTER_CROZIER_CHEATS_B_t_rel_soulmate_TT:0 "Цель становится твоей родственной душой."
 SKONESTER_CROZIER_CHEATS_B_t_remember:0 "Запомнить цель как второго персонажа (для брака и отцовства)"
 SKONESTER_CROZIER_CHEATS_B_t_remember_TT:0 "Сохраняет этого персонажа как второго персонажа. Он используется кнопками «Женить два выбранных персонажа», «Матрилинейный брак двух целей» и «Беременность выбранной женщины» у другого персонажа."
 SKONESTER_CROZIER_CHEATS_B_t_rob_artifacts:0 "Забрать все артефакты цели себе"
 SKONESTER_CROZIER_CHEATS_B_t_rob_artifacts_TT:0 "Переносит все артефакты цели в твой инвентарь."
 SKONESTER_CROZIER_CHEATS_B_t_rob_gold:0 "Забрать всё золото цели себе"
 SKONESTER_CROZIER_CHEATS_B_t_rob_gold_TT:0 "Переводит всё золото цели тебе."
 SKONESTER_CROZIER_CHEATS_B_t_saint:0 "Сделать цель святым (черта «Святой»)"
 SKONESTER_CROZIER_CHEATS_B_t_saint_TT:0 "Даёт цели черту «Святость»."
 SKONESTER_CROZIER_CHEATS_B_t_schemes_end:0 "Сорвать все интриги цели"
 SKONESTER_CROZIER_CHEATS_B_t_schemes_end_TT:0 "Прекращает все интриги, которые ведёт цель."
 SKONESTER_CROZIER_CHEATS_B_t_schemes_expose:0 "Раскрыть все интриги цели"
 SKONESTER_CROZIER_CHEATS_B_t_schemes_expose_TT:0 "Раскрывает все тайные интриги, которые ведёт цель."
 SKONESTER_CROZIER_CHEATS_B_t_secret_cannibal:0 "Компромат на цель: каннибализм (известен мне)"
 SKONESTER_CROZIER_CHEATS_B_t_secret_cannibal_TT:0 "Цель получает секрет «Каннибал», который тебе уже известен, так что её можно шантажировать или разоблачить. Ничего не делает, если цель открыто каннибал."
 SKONESTER_CROZIER_CHEATS_B_t_secret_deviant:0 "Компромат на цель: извращения (известен мне)"
 SKONESTER_CROZIER_CHEATS_B_t_secret_deviant_TT:0 "Цель получает секрет «Тяга к извращениям», который тебе уже известен, так что её можно шантажировать или разоблачить. Работает только на взрослых, у которых эта черта ещё не открыта."
 SKONESTER_CROZIER_CHEATS_B_t_secret_homosexual:0 "Компромат на цель: содомия (известен мне)"
 SKONESTER_CROZIER_CHEATS_B_t_secret_homosexual_TT:0 "Цель получает секрет «Содомия», который тебе уже известен, так что её можно шантажировать или разоблачить. Работает только на взрослых мужчин, у которых эта черта ещё не открыта."
 SKONESTER_CROZIER_CHEATS_B_t_secret_witch:0 "Компромат на цель: колдовство (известен мне)"
 SKONESTER_CROZIER_CHEATS_B_t_secret_witch_TT:0 "Цель получает секрет «Ведовство», который тебе уже известен, так что её можно шантажировать или разоблачить. Ничего не делает, если цель открыто практикует ведовство."
 SKONESTER_CROZIER_CHEATS_B_t_secrets:0 "Узнать все секреты цели"
 SKONESTER_CROZIER_CHEATS_B_t_secrets_TT:0 "Тебе раскрываются все секреты цели."
 SKONESTER_CROZIER_CHEATS_B_t_secrets_erase:0 "Стереть все тайны цели"
 SKONESTER_CROZIER_CHEATS_B_t_secrets_erase_TT:0 "Удаляет все секреты цели, так что никто не сможет её шантажировать или разоблачить."
 SKONESTER_CROZIER_CHEATS_B_t_sex_asexual:0 "Ориентация цели: асексуальность"
 SKONESTER_CROZIER_CHEATS_B_t_sex_asexual_TT:0 "Устанавливает ориентацию цели: асексуальность."
 SKONESTER_CROZIER_CHEATS_B_t_sex_bisexual:0 "Ориентация цели: би"
 SKONESTER_CROZIER_CHEATS_B_t_sex_bisexual_TT:0 "Устанавливает ориентацию цели: бисексуальность."
 SKONESTER_CROZIER_CHEATS_B_t_sex_heterosexual:0 "Ориентация цели: гетеро"
 SKONESTER_CROZIER_CHEATS_B_t_sex_heterosexual_TT:0 "Устанавливает ориентацию цели: гетеросексуальность."
 SKONESTER_CROZIER_CHEATS_B_t_sex_homosexual:0 "Ориентация цели: гомо"
 SKONESTER_CROZIER_CHEATS_B_t_sex_homosexual_TT:0 "Устанавливает ориентацию цели: гомосексуальность."
 SKONESTER_CROZIER_CHEATS_B_t_skills_down:0 "Навыки цели: −5 ко всем"
 SKONESTER_CROZIER_CHEATS_B_t_skills_down_TT:0 "Снижает все шесть навыков цели на 5."
 SKONESTER_CROZIER_CHEATS_B_t_skills_up:0 "Навыки цели: +5 ко всем"
 SKONESTER_CROZIER_CHEATS_B_t_skills_up_TT:0 "Повышает все шесть навыков цели на 5."
 SKONESTER_CROZIER_CHEATS_B_t_take_all:0 "Забрать ВСЕ титулы и земли цели себе"
 SKONESTER_CROZIER_CHEATS_B_t_take_all_TT:0 "Ты забираешь все титулы цели от графства и выше, как при завоевании. Баронства переходят вместе со своим графством. Титул главы конфессии не забирается никогда."
 SKONESTER_CROZIER_CHEATS_B_t_take_primary:0 "Забрать главный титул цели себе"
 SKONESTER_CROZIER_CHEATS_B_t_take_primary_TT:0 "Ты забираешь главный титул цели, как при узурпации."
 SKONESTER_CROZIER_CHEATS_B_t_trait_tracks_max:0 "Черты с опытом цели на максимум"
 SKONESTER_CROZIER_CHEATS_B_t_trait_tracks_max_TT:0 "Добавляет +100 опыта к каждой черте с опытом, которая уже есть у цели («Мастерство клинка», «Охотник», черты полководца и другие)."
 SKONESTER_CROZIER_CHEATS_B_t_tributary:0 "Сделать цель моим данником (навсегда)"
 SKONESTER_CROZIER_CHEATS_B_t_tributary_TT:0 "Цель становится твоим покорённым данником и платит тебе дань. Работает, только если цель — независимый правитель."
 SKONESTER_CROZIER_CHEATS_B_t_tributary_free:0 "Освободить цель от дани"
 SKONESTER_CROZIER_CHEATS_B_t_tributary_free_TT:0 "Прекращает статус данника цели."
 SKONESTER_CROZIER_CHEATS_B_t_truce:0 "Перемирие с целью на 10 лет"
 SKONESTER_CROZIER_CHEATS_B_t_truce_TT:0 "Устанавливает перемирие на 10 лет между тобой и целью в обе стороны, заменяя любое существующее перемирие."
 SKONESTER_CROZIER_CHEATS_B_t_truce_break:0 "Разорвать перемирие с целью"
 SKONESTER_CROZIER_CHEATS_B_t_truce_break_TT:0 "Убирает любое перемирие между тобой и целью в обе стороны."
 SKONESTER_CROZIER_CHEATS_B_t_unexcommunicate:0 "Снять отлучение с цели"
 SKONESTER_CROZIER_CHEATS_B_t_unexcommunicate_TT:0 "Снимает с цели черту «В отлучении»."
 SKONESTER_CROZIER_CHEATS_B_t_unrel_best_friend:0 "Убрать лучшую дружбу со мной"
 SKONESTER_CROZIER_CHEATS_B_t_unrel_best_friend_TT:0 "Убирает отношение «лучший друг» между тобой и целью."
 SKONESTER_CROZIER_CHEATS_B_t_unrel_friend:0 "Убрать дружбу со мной"
 SKONESTER_CROZIER_CHEATS_B_t_unrel_friend_TT:0 "Убирает отношение «друг» между тобой и целью."
 SKONESTER_CROZIER_CHEATS_B_t_unrel_lover:0 "Убрать любовную связь со мной"
 SKONESTER_CROZIER_CHEATS_B_t_unrel_lover_TT:0 "Убирает отношение «любовник» между тобой и целью."
 SKONESTER_CROZIER_CHEATS_B_t_unrel_soulmate:0 "Убрать родственную душу со мной"
 SKONESTER_CROZIER_CHEATS_B_t_unrel_soulmate_TT:0 "Убирает отношение «родственная душа» между тобой и целью."
 SKONESTER_CROZIER_CHEATS_B_t_vassalize:0 "Сделать цель моим вассалом (со всеми землями)"
 SKONESTER_CROZIER_CHEATS_B_t_vassalize_TT:0 "Цель приносит тебе присягу и становится твоим вассалом со всеми своими землями и вассалами. Работает, только если её высший титул ниже твоего."
 SKONESTER_CROZIER_CHEATS_B_t_war_claim:0 "Объявить цели войну за её главный титул (претензия выдаётся)"
 SKONESTER_CROZIER_CHEATS_B_t_war_claim_TT:0 "Ты получаешь обоснованную претензию на главный титул цели и сразу объявляешь за него войну по претензии. Работает, только если у цели есть земли."
 SKONESTER_CROZIER_CHEATS_B_t_young:0 "Омолодить цель до 20 лет"
 SKONESTER_CROZIER_CHEATS_B_t_young_TT:0 "Если цели больше 20 лет, её возраст становится 20."
 SKONESTER_CROZIER_CHEATS_B_target_alliance:0 "Заключить союз с целью"
 SKONESTER_CROZIER_CHEATS_B_target_alliance_TT:0 "Ты и цель становитесь союзниками."
 SKONESTER_CROZIER_CHEATS_B_target_court:0 "Привести цель к моему двору"
 SKONESTER_CROZIER_CHEATS_B_target_court_TT:0 "Цель присоединяется к твоему двору как придворный."
 SKONESTER_CROZIER_CHEATS_B_target_culture:0 "Обратить цель в мою культуру"
 SKONESTER_CROZIER_CHEATS_B_target_culture_TT:0 "Цель принимает твою культуру."
 SKONESTER_CROZIER_CHEATS_B_target_divorce:0 "Развести цель со всеми супругами"
 SKONESTER_CROZIER_CHEATS_B_target_divorce_TT:0 "Цель разводится со всеми своими супругами."
 SKONESTER_CROZIER_CHEATS_B_target_faith:0 "Обратить цель в мою веру"
 SKONESTER_CROZIER_CHEATS_B_target_faith_TT:0 "Цель принимает твою веру."
 SKONESTER_CROZIER_CHEATS_B_target_garrison:0 "Пополнить гарнизоны проверенного правителя"
 SKONESTER_CROZIER_CHEATS_B_target_garrison_TT:0 "Пополняет гарнизоны всех провинций в державе цели, включая её вассалов."
 SKONESTER_CROZIER_CHEATS_B_target_gold_add:0 "Дать цели золото (100 / 1 000 / 10 000)"
 SKONESTER_CROZIER_CHEATS_B_target_gold_add_TT:0 "Даёт цели новое золото (не из твоей казны).\nКоличество зависит от настройки «Кол-во» вверху панели «Читы Skonester»: мало 100, средне 1 000, много 10 000."
 SKONESTER_CROZIER_CHEATS_B_target_gold_take:0 "Отнять у цели золото (100 / 1 000 / 10 000)"
 SKONESTER_CROZIER_CHEATS_B_target_gold_take_TT:0 "Отнимает золото у цели (оно уничтожается, а не достаётся тебе).\nКоличество зависит от настройки «Кол-во» вверху панели «Читы Skonester»: мало 100, средне 1 000, много 10 000."
 SKONESTER_CROZIER_CHEATS_B_target_heal:0 "Вылечить выбранную цель"
 SKONESTER_CROZIER_CHEATS_B_target_heal_TT:0 "Снимает с цели «Болезнь», «Лёгочную болезнь» и все раны. Для тяжёлых болезней используй «Исцелить цель от всех болезней и ран»."
 SKONESTER_CROZIER_CHEATS_B_target_heir:0 "Назначить цель наследником игрока"
 SKONESTER_CROZIER_CHEATS_B_target_heir_TT:0 "Назначает цель твоим предопределённым наследником."
 SKONESTER_CROZIER_CHEATS_B_target_imprison:0 "Заключить цель в мою темницу"
 SKONESTER_CROZIER_CHEATS_B_target_imprison_TT:0 "Бросает цель в твою темницу. Ничего не делает, если она уже в заключении."
 SKONESTER_CROZIER_CHEATS_B_target_kill:0 "Убить выбранного персонажа"
 SKONESTER_CROZIER_CHEATS_B_target_kill_TT:0 "Цель немедленно умирает — убита, убийцей записан ты."
 SKONESTER_CROZIER_CHEATS_B_target_maa_empty:0 "Обнулить численность профессиональных полков цели"
 SKONESTER_CROZIER_CHEATS_B_target_maa_empty_TT:0 "Убирает всех солдат из полков профессионалов цели. Сами полки остаются и, как обычно, медленно пополняются."
 SKONESTER_CROZIER_CHEATS_B_target_maa_resize:0 "Изменить размеры профессиональных полков цели (-1 / -2 / -5)"
 SKONESTER_CROZIER_CHEATS_B_target_maa_resize_TT:0 "Каждый полк профессионалов цели навсегда уменьшается в размере.\nКоличество зависит от настройки «Кол-во» вверху панели «Читы Skonester»: мало −1, средне −2, много −5 на полк."
 SKONESTER_CROZIER_CHEATS_B_target_marry:0 "Женить два выбранных персонажа"
 SKONESTER_CROZIER_CHEATS_B_target_marry_TT:0 "Заключает брак цели с запомненным вторым персонажем.\nСначала открой другого персонажа и нажми «Запомнить цель как второго персонажа (для брака и отцовства)», затем вернись сюда."
 SKONESTER_CROZIER_CHEATS_B_target_matrilineal:0 "Матрилинейный брак двух целей"
 SKONESTER_CROZIER_CHEATS_B_target_matrilineal_TT:0 "Заключает брак цели с запомненным вторым персонажем, дети входят в дом матери.\nСначала открой другого персонажа и нажми «Запомнить цель как второго персонажа (для брака и отцовства)», затем вернись сюда."
 SKONESTER_CROZIER_CHEATS_B_target_pregnancy:0 "Беременность выбранной женщины"
 SKONESTER_CROZIER_CHEATS_B_target_pregnancy_TT:0 "Цель беременеет от запомненного второго персонажа. Цель должна быть небеременной женщиной от 18 лет, а второй персонаж — живым мужчиной от 18 лет.\nСначала открой другого персонажа и нажми «Запомнить цель как второго персонажа (для брака и отцовства)», затем вернись сюда."
 SKONESTER_CROZIER_CHEATS_B_target_release:0 "Освободить выбранную цель"
 SKONESTER_CROZIER_CHEATS_B_target_release_TT:0 "Освобождает цель от того, кто её удерживает."
 SKONESTER_CROZIER_CHEATS_B_target_stress:0 "Добавить цели стресс (50 / 100 / 300)"
 SKONESTER_CROZIER_CHEATS_B_target_stress_TT:0 "Добавляет цели стресс.\nКоличество зависит от настройки «Кол-во» вверху панели «Читы Skonester»: мало 50, средне 100, много 300."
 SKONESTER_CROZIER_CHEATS_B_target_weak:0 "Ослабить навыки цели"
 SKONESTER_CROZIER_CHEATS_B_target_weak_TT:0 "Снижает все шесть навыков цели на 100, что на практике опускает их до 0."
 SKONESTER_CROZIER_CHEATS_B_toasts_toggle:0 "Уведомления «Чит: …» после разовых читов — вкл/выкл"
 SKONESTER_CROZIER_CHEATS_B_toasts_toggle_TT:0 "Включает или выключает маленькие всплывающие уведомления «Чит: …», «Включено: …» и «Выключено: …»."
 SKONESTER_CROZIER_CHEATS_B_trait_tracks_max:0 "Черты с опытом на максимум (клинок, охотник, путешественник, полководец…)"
 SKONESTER_CROZIER_CHEATS_B_trait_tracks_max_TT:0 "Добавляет +100 опыта к каждой черте с опытом, которая у тебя уже есть («Мастерство клинка», «Охотник», «Путешественник», «Гуляка», «Мистицизм», «Врач», «Паломничество», черты полководца, турнирные черты и другие). Новых черт не даёт."
 SKONESTER_CROZIER_CHEATS_B_travel_arrive:0 "Мгновенно прибыть (завершить путешествие)"
 SKONESTER_CROZIER_CHEATS_B_travel_arrive_TT:0 "Если ты в путешествии, текущее путешествие немедленно завершается в пункте назначения."
 SKONESTER_CROZIER_CHEATS_B_travel_safe_OFF:0 "выкл  ·  Путешествия: безопасность и скорость +100% × сила"
 SKONESTER_CROZIER_CHEATS_B_travel_safe_ON:0 "ВКЛ  ·  Путешествия: безопасность и скорость +100% × сила"
 SKONESTER_CROZIER_CHEATS_B_travel_safe_TT:0 "Твои путешествия на +100% быстрее и на +100% безопаснее за каждый шаг силы.\nСила — множитель, выбранный вверху панели в момент включения. Чтобы изменить её позже, выключи переключатель, выбери новую силу и включи его снова.\nЕсли ты переключишься на другого персонажа, бонус перейдёт к нему при следующей проверке авто-режимов."
 SKONESTER_CROZIER_CHEATS_B_tt_enemy_army:0 "Ослабить армии выбранного правителя: включить"
 SKONESTER_CROZIER_CHEATS_B_tt_enemy_army_TT:0 "Цель получает длительный модификатор: урон армий −95%, стойкость армий −95% и −100 к боевому преимуществу. Действует, пока ты не выключишь его следующей кнопкой."
 SKONESTER_CROZIER_CHEATS_B_tt_enemy_health:0 "Ослабить здоровье выбранной цели: включить"
 SKONESTER_CROZIER_CHEATS_B_tt_enemy_health_TT:0 "Цель получает длительный модификатор здоровья −3, который действует, пока ты не выключишь его следующей кнопкой."
 SKONESTER_CROZIER_CHEATS_B_tt_enemy_money:0 "Снизить доходы выбранного правителя: включить"
 SKONESTER_CROZIER_CHEATS_B_tt_enemy_money_TT:0 "Цель получает длительный модификатор ежемесячного дохода −95%, который действует, пока ты не выключишь его следующей кнопкой."
 SKONESTER_CROZIER_CHEATS_B_tt_enemy_speed:0 "Замедлить армии выбранного правителя: включить"
 SKONESTER_CROZIER_CHEATS_B_tt_enemy_speed_TT:0 "Цель получает длительный модификатор скорости передвижения армий −90%, который действует, пока ты не выключишь его следующей кнопкой."
 SKONESTER_CROZIER_CHEATS_B_tt_off_enemy_army:0 "Ослабить армии выбранного правителя: выключить"
 SKONESTER_CROZIER_CHEATS_B_tt_off_enemy_army_TT:0 "Снимает с цели модификатор ослабления армий."
