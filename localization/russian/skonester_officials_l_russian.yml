 skonester_cheat_menu_force_pregnancy_interaction_desc: "Цель — любая живая женщина, кроме вас. Если она не является вашей супругой, любовницей, родственницей или наложницей, она забеременеет от вас. Ребёнок будет считаться незаконнорожденным: если у женщины есть муж, он будет указан официальным отцом (чтобы скрыть прелюбодеяние), иначе отцом будете вы. Проверки на фертильность отсутствуют, тайны прелюбодеяния не создаются. Несовершеннолетние и персонажи, не способные вынашивать плод, не могут забеременеть."
