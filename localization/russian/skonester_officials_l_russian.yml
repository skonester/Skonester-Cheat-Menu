 skonester_seduce_blocked_player_consort_tt: "Пока #bold бдительность #! включена, #bold все, включая ИИ #!, не могут соблазнить [scheme|E] супругов или наложниц вашего правителя, за исключением случаев, когда супруг или правитель является целью или владельцем схемы. Также ежедневно прерываются романтические, похищающие и побегающие схемы против членов семьи и очищаются любовные связи. Новые игры по умолчанию бдительны; после отключения правителем один раз в этом решении, оно не включится автоматически снова."
 skonester_seduce_blocked_harem_outgoing_tt: "Пока #bold бдительность #! включена, ваши супруги и наложницы #bold не могут #! соблазнить [scheme|E] других, #bold кроме того #!, бдительность ежедневно прерывает исходящие романтические, похищающие и побегающие схемы, инициированные супругами или наложницами."
