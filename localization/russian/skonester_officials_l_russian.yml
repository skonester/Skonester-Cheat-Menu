 skonester_ai_yearly_admin_conversion_toggle_effect_disabled_tt: "Отключено: ежегодная автоматическая смена строя для ИИ остановлена"
 skonester_ai_yearly_admin_conversion_toggle_effect_enabled_tt: "Включено: подходящие независимые ИИ переходят в административный строй ежегодно(нужен EP3)"
 skonester_ai_yearly_pulse_toggle_title_on: "#bold 【ВКЛ】#! Годовой глобальный импульс (Главный переключатель)"
 skonester_ai_yearly_pulse_toggle_title_off: "#bold 【ВЫКЛ】#! Годовой глобальный импульс (Главный переключатель)"
 skonester_ai_yearly_pulse_toggle_desc_on: "Включен по умолчанию. Каждый год все независимые ИИ получают бонусы расширения, войны, рост вассальных податей и обновление антигегемонистических коалиций. Подпункты: автореформа администрации вкл, законный перенос вассалов выкл. Первый год новой кампании пропускает весь импульс. При отключении главного переключателя все подменю скрываются, скрипты останавливаются. Не связано с месячным автоусилением ИИ Нажмите отключить"
 skonester_ai_yearly_pulse_toggle_desc_off: "Отключен, событие9200 остановлено, ежегодное обновление антигегемонии модуля прекращено(квартальные и месячные проверки работают). Нажмите включить снова"
 skonester_ai_yearly_pulse_toggle_tooltip_on: "Стандарт активен, клик для отключения главного переключателя"
 skonester_ai_yearly_pulse_toggle_tooltip_off: "Все годовые импульсы остановлены, клик для активации"
 skonester_ai_yearly_pulse_toggle_confirm_disable: "Отключить главный переключатель годового импульса"
 skonester_ai_yearly_pulse_toggle_confirm_enable: "Включить главный переключатель годового импульса"
 skonester_ai_yearly_pulse_toggle_effect_disabled_tt: "Отключено: событие9200 и ежегодное обновление антигегемонистических коалиций остановлены"
 skonester_ai_yearly_pulse_toggle_effect_enabled_tt: "Включено: годовой импульс работает согласно поднастройкам"
 skonester_ai_yearly_de_jure_transfer_toggle_title_on: "#bold 【ВКЛ】#! Годовой импульс: Автоперенос вассалов по закону ИИ"
 skonester_ai_yearly_de_jure_transfer_toggle_title_off: "#bold 【ВЫКЛ】#! Годовой импульс: Автоперенос вассалов по закону ИИ"
 skonester_ai_yearly_de_jure_transfer_toggle_desc_on: "Включен. Ежегодно независимые ИИ переносят вассалов по юридической принадлежности как игрок. По умолчанию выкл, изменяет стартовые границы оригинала(Хэси, Гоби и т.д.) При отключении бонусы расширения, податей и автореформа сохраняются, ручной перенос законных вассалов доступен. Нажмите отключить"
 skonester_ai_yearly_de_jure_transfer_toggle_desc_off: "По умолчанию выкл Годовой скрипт не перераспределяет вассалов для сохранения оригинальной карты. В первый год новой игры весь годовой импульс пропускается. Нажмите включить"
 skonester_ai_yearly_de_jure_transfer_toggle_tooltip_on: "Активно: ежегодный законный перенос вассалов ИИ, клик отключить"
 skonester_ai_yearly_de_jure_transfer_toggle_tooltip_off: "Неактивно: нет автопереноса, клик включить"
