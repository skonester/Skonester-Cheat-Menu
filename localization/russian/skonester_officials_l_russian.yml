 skonester_ai_yearly_de_jure_transfer_toggle_effect_disabled_tt: "Отключено: ежегодный автоматический перенос вассалов прекращен"
 skonester_ai_yearly_de_jure_transfer_toggle_effect_enabled_tt: "Включено: независимые ИИ перераспределяют вассалов по закону каждый год"
