 skonester_officials.9084.t: "Один ребёнок на семью и правила династии игроков"
 skonester_officials.9084.desc: "#bold Один ребёнок на семью#!: действует на #bold всех отцов-ИИ#!. Считается число #bold живых#! детей — если у отца уже есть #bold 1 живой ребёнок#!, новоророждённый устраняется. #bold Умершие дети не занимают квоту#!; после смерти единственного живого ребёнка можно снова оставить одного. Устраняются только #bold дети ИИ#! от #bold отцов ИИ#!; если отец — игрок-человек, правило не срабатывает. Можно включить защиту династии игрока. Взаимоисключающе с правилом «мужчины династии: один ребёнок»."
 skonester_officials.9084.enable: "Включить (один ребёнок на семью)"
