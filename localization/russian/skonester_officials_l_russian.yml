 skonester_boost_world_ai_rulers_effect_tt: "#boldВсе правители ИИ с землями#! получают модификатор «Поддержка управления» на #bold15 лет#, ежегодные бонусы строительства и дружин сохраняются весь срок действия."
 skonester_ai_yearly_admin_conversion_toggle_title_on: "#bold 【ВКЛ】#! Годовой триггер: Автореформа административного строя ИИ"
 skonester_ai_yearly_admin_conversion_toggle_title_off: "#bold 【ВЫКЛ】#! Годовой триггер: Автореформа административного строя ИИ"
 skonester_ai_yearly_admin_conversion_toggle_desc_on: "Сейчас включен. Требуется «Путь к власти»(EP3). Каждый год все независимые правители ИИ и их вассалы переводятся в административное государственное устройство. Включено по умолчанию, отдельно от ручного усиления ИИ. Кочевые и племенные владыки больше не переводят вассалов массово во избежание отделения. При отключении повышаются обязательства вассалов и бонусы расширения сохраняются. Нажмите для отключения"
 skonester_ai_yearly_admin_conversion_toggle_desc_off: "Сейчас отключен, ежегодная автоматическая смена строя прекращена. Бонусы податей и расширения остаются, ручная смена строя доступна в меню форм правления. Нажмите для повторного включения"
 skonester_ai_yearly_admin_conversion_toggle_tooltip_on: "Активно: ежегодная автореформа ИИ(требуется EP3), клик для отключения"
 skonester_ai_yearly_admin_conversion_toggle_tooltip_off: "Неактивно: нет автоматической реформы, клик для включения"
 skonester_ai_yearly_admin_conversion_toggle_confirm_disable: "Отключить ежегодную автореформу администрации"
