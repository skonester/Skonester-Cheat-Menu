 skonester_foreman_realm_unified_decision: "Массовое строительство: всё королевство"
 skonester_foreman_realm_unified_decision_desc: "Умно достраивает и максимизирует главные постройки и слоты во всех графствах вашего домена по типу владения (тот же результат, что у прежней однокадровой версии). Чтобы избежать лагов в больших владениях, работа выполняется ежедневными партиями (~10 графств за партию, одна партия за игровой день); повторно решение недоступно, пока не завершится — чем больше владение, тем больше игровых дней потребуется."
