 skonester_boost_world_ai_rulers_decision: "Усилить все царства ИИ"
 skonester_boost_world_ai_rulers_decision_desc: "Дарует военные, экономические и дипломатические бонусы всем правителям с владениями для стимулирования войн и экспансии. При чрезмерном усилении игрока правители формируют коалиции для сохранения сложности игры."
