 skonester_trait_yannian_dan_mid_desc: "Утончённый эликсир, закрепляющий молодость и значительно продлевающий жизнь, отпугивая болезни."
 skonester_trait_yannian_dan_best: "Пилюля долголетия (высшая)"
 skonester_trait_yannian_dan_best_desc: "Несравненный эликсир, закрепляющий молодость и бросающий вызов пределам смертной жизни, отпугивая болезни."
 skonester_trait_baidubuqin: "Иммунитет к ядам"
 skonester_trait_baidubuqin_desc: "Иммунитет к болезням и чуме; чрезвычайно устойчив. Любая текущая болезнь излечивается сразу же после обретения этой черты."
 skonester_trait_xinwuguai: "Безмятежный ум"
 skonester_trait_xinwuguai_desc: "Ясный ум без тягот: стресс остаётся на нуле и почти не накапливается; при получении снимает весь накопленный стресс."
 skonester_trait_marriage_ban: "Запрет на брак"
 skonester_trait_marriage_ban_desc: "Не может жениться или обручиться на всю жизнь; любой брак или обручение немедленно нарушается. Существующие супруги или обручения заканчиваются при получении черты. Нажмите снова, чтобы удалить."
 skonester_trait_stats_100_locked: "Фиксация характеристик на 100"
 skonester_trait_stats_100_locked_desc: "Дипломатия, военное дело, управление, интрига, учёность и доблесть зафиксированы на 100 и не могут быть изменены событиями, возрастом или другими источниками."
 trait_skonester_cheat_menu: "Травма"
 trait_warlord_eternal: "Вечный военачальник"
 trait_warlord_eternal_desc: "Вершина командования: закалённые в боях солдаты, ужасающие рыцари и неустанный натиск. Скорость марша парит, местность перестаёт иметь значение, а осады рушатся перед неудержимым войском."
 trait_wealth_sovereign_max: "Суверенное богатство"
 trait_wealth_sovereign_max_desc: "Мастер денег и торговли: налоги растут, вассальные взносы растут, а казначейство, кажется, никогда не иссякает."
 trait_ultimate_intrigue_master: "Многоликий провидец"
 trait_ultimate_intrigue_master_desc: "Непревзойдённый ткач теней: враждебные схемы против вас увядают, в то время как ваши собственные заговоры остаются невидимыми и почти гарантированно преуспевают."
 trait_great_builder_god: "Божественный строитель"
 trait_great_builder_god_desc: "Первозданное мастерство в строительстве: владения и здания по всему миру растут с минимальными затратами времени и золота; управление, налоги, престиж, развитие, укрепления и сборы — всё это растёт."
 trait_nether_conspiracy_lord: "Повелитель преисподней (заговор)"
 trait_nether_conspiracy_lord_desc: "Мастер завуалированной интриги: ваши враждебные схемы становятся всё более скрытными и вероятными, в то время как вражеские заговоры против вас медленны и непостоянны; страх поднимается, и придворные склоняются в вашу пользу."
 trait_eternal_nether_lord: "Вечный повелитель преисподней"
 trait_eternal_nether_lord_desc: "Воля, застывшая на эоны: стресс едва касается вас, страх нарастает и держится, интрига огромна, и враждебные схемы против вас с трудом добиваются успеха, в то время как вассалы и придворные изгибаются в трепете."
 trait_the_wake: "Пробуждение"
 trait_the_wake_desc: "Вершина следопыта — всегда бдительный, всегда вызывающий страх в пустошах и набегах, сильный на болотах; нормандская культура смотрит на вас с открытой ненавистью."
 trait_lifestyle_traveler: "Путешественник"
 trait_lifestyle_traveler_desc: "Черта из бродячего образа жизни: растёт с путешествиями, прибытиями и достопримечательностями — наряду с более безопасными дорогами или смелыми объездами."
 trait_child_of_concubine_female: "Дочь наложницы"
 trait_child_of_concubine_female_desc: "Рождённая наложницей или вторичной супругой; семейное право и престолонаследие могут относиться к ней иначе, чем к детям главной супруги."
 trait_child_of_concubine_male: "Сын наложницы"
 trait_child_of_concubine_male_desc: "Рождённый наложницей или вторичной супругой; семейное право и престолонаследие могут относиться к нему иначе, чем к детям главной супруги."
 trait_hajjaj: "Хаджи"
 trait_shieldmaiden: "Дева-щитоносец"
 trait_viking: "Викинг"
 trait_skonester_trait_immortal_ageless: "Бессмертный"
 trait_skonester_trait_immortal_ageless_desc: "Время не властно над вами: вы не стареете, не можете стать немощным, обладаете огромной устойчивостью к болезням и почти невосприимчивы к убийствам и другим враждебным схемам."
 trait_skonester_trait_yannian_dan: "Пилюля долголетия"
