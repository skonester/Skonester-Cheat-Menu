 skonester_seduce_shield_for_consorts_decision_title_on: "#bold 【ВКЛ】#! Бдительность"
 skonester_seduce_shield_for_consorts_decision_title_off: "#bold 【ВЫКЛ】#! Бдительность"
 skonester_seduce_shield_for_consorts_decision_desc_on: "Бдительность включена : посторонние не могут соблазнять ваших супругов или наложниц; они не могут соблазнять (включая ИИ); глобальные правила для ИИ; романтические, похищающие и побегающие схемы ежедневно очищаются; любовники, не являющиеся вами, удаляются; черты Честный или Лояльный обновляются ежедневно и ежегодно. Выключите ."
 skonester_seduce_shield_for_consorts_decision_desc_off: "Бдительность выключена . В новой игре человеческие правители по умолчанию включают бдительность. Когда включена, посторонние не могут соблазнять супругов или наложниц; применяются глобальные правила против ИИ; романтические, похищающие и побегающие схемы ежедневно очищаются; любовники, не являющиеся вами, удаляются; черты Честный или Лояльный обновляются ежедневно."
 skonester_seduce_shield_for_consorts_decision_tooltip_on: "Бдительность включена; нажмите, чтобы выключить."
