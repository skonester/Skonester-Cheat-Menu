 skonester_adopted_son_interaction: "Приёмный ребёнок"
 skonester_adopted_son_interaction_desc: "Сделать их своим ребёнком (отцом, если вы мужчина, матерью, если женщина), перевести в свой дом, лишить черт бастарда. Требует принадлежности к дому. Заблокировано для супруга, существующих детей или родителей. Если они старше или того же возраста, их возраст кратковременно понижается, чтобы связь могла быть установлена, затем восстанавливается."
