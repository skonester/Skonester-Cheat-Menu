 skonester_officials.9087.t: "В вашем игровом клане мужчины: только один ребёнок"
 skonester_officials.9087.desc: "#bold В вашей [dynasty|E] у каждого мужчины-ИИ может быть не более одного живого ребёнка#!. Правило срабатывает, только если в [dynasty|E] новорождённого есть #bold человек, играбельный#! (в одиночной игре — ваша династия). Считается число #bold живых#! детей этого отца-ИИ: если уже есть #bold 1 живой ребёнок#!, новоророждённый устраняется. #bold Умершие не занимают квоту#! — после смерти единственного живого ребёнка можно снова оставить одного. Если также включён «один ребёнок на семью», для таких династий сначала действует это правило, а для полностью ИИ-династий — правило «один ребёнок на семью». Устраняются только дети ИИ от отцов ИИ. Если биологический отец — игрок-человек, правило неактивно. Выключено — слой не работает."
