 skonester_cheat_menu_add_concubine_interaction: "Взять в наложницы"
 skonester_cheat_menu_add_concubine_interaction_desc: "Сделать выбранного персонажа вашей наложницей"
 skonester_cheat_menu_join_court_interaction: "Призвать во двор"
 skonester_cheat_menu_join_court_interaction_desc: "Принудить безземельного персонажа присоединиться к вашему двору"
 skonester_cheat_menu_make_my_vassal_interaction: "Сделать прямым вассалом"
 skonester_cheat_menu_make_my_vassal_interaction_desc: "Заставить цель принести присягу и стать вашим прямым вассалом. Работает с любыми владеющими землями персонажами. Не действует, если цель уже является вашим вассалом. Оба персонажа должны владеть землями; основной титул цели не может быть выше вашего. Цель не может быть вашим сюзереном. Стандартные игровые правила могут блокировать это действие."
 skonester_cheat_menu_declare_war_interaction: "Объявить войну"
 skonester_cheat_menu_declare_war_interaction_desc: "Война против независимого правителя: принудить к уплате дани или полностью завоевать его государство. Все действующие перемирия будут отменены."
