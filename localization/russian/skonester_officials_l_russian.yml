 skonester_ai_boost_toggle_effect_disabled_tt: "Отключено: автоматическое начисление бонусов прекращено"
 skonester_ai_realm_governance_support: "Поддержка управления"
 skonester_ai_realm_governance_support_desc: "Содержание войск снижено примерно на 50%, лимит и численность дружин сильно повышены. Ускорено строительство, рост доходов, улучшена дипломатия и воинственность. ИИ становится алчнее, снижена доброта и честь, лимит домена +2. Все независимые царства получают ежегодные бонусы расширения с накоплением, рост вассальных податей и преимущества EP3. Автоперенос вассалов по закону всегда активен."
 skonester_ai_expansion_push: "Годовой толчок к экспансии"
 skonester_ai_expansion_push_desc: "Годовой модификатор: строительство +60%, содержание дружин -70%. Повышено желание ИИ воевать за претензии, принудительных войн нет."
 skonester_ai_stable_surge: "Крупный ежегодный всплеск экспансии"
 skonester_ai_stable_surge_desc: "Ежегодный дополнительный рост воинственности, смелости и амбиций ИИ поверх базового бонуса, правила войны следуют оригиналу игры."
 skonester_ai_counter_player_pressure: "Антигегемонистическая коалиция"
 skonester_ai_counter_player_pressure_desc: "Срабатывает при владении империей или более 80 графств: все независимые ИИ получают бонус дальности дипломатии, общения, интриг и войны для формирования союзов против сильного игрока. Войны, похищения и браки по оригинальным правилам ИИ."
