 trait_warlord_god_desc: "#bold Чит-черта для полководцев#!. Значительно повышает [martial|e] и #bold мастерство#! ($game_concept_prowess$), увеличивает лимит и боевую эффективность #bold рыцарей#!, урон и стойкость #bold армий#!, а также силу #bold осад#!. Повышает базовый #bold страх#!, ускоряет пополнение #bold ополчения#! и снижает #bold содержание войск#!; скорость #bold марша#! и бонусы от местности реализованы через модификаторы характера. #bold Не наследуется#!, отсутствует в редакторе правителей и случайном наборе черт; нет специального флага «неуязвимость». Черту можно выдать через главное меню Skonester по #bold правому клику#! на персонаже или командой #bold add_trait = warlord_god#!. #bold Суммируется отдельно#! с чертой #bold «Небесный бессмертный»#!. Значок: #bold золотой шлем с мечами#! (стиль [commander|e])."
