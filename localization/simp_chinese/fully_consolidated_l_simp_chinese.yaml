 ### 来自：event_localization\water_of_life_events_l_english.yml
 water_of_life_header:0 "百夫长日记："
 water_of_life.1001.t:0 "$water_of_life_header$ 未死之人。"
 water_of_life.1001.desc:0 "卷轴并非藏在图书馆，而是藏在一把在犹地亚发现的锈蚀西班牙短剑的剑柄内。拉丁文粗陋，充满军事术语——是一位名叫克拉维乌斯的护民官的报告。它提到了一个从密封坟墓中失踪的身体，一位知道真相的红发女子，以及一杯能停止生命时钟的圣杯。\n\n最后的条目不是日期，而是一个誓言：#'我杀不死不会死之物。我只能侍奉它。我去旷野守望。'#!\n\n传说他还在那里。一个等待救援的士兵。如果我找到他，我就找到了圣杯。"
 water_of_life.1001.a:0 "护民官在等待。我会找到他。"
 water_of_life.1001.b:0 "追捕罗马士兵，必须做好准备。"
 water_of_life_header_1:0 "追猎："
 water_of_life.1002.t:1 "$water_of_life_header_1$ 雄鹰之影。"
 water_of_life.1002.desc:0 "我离开我的王冠。要找到克拉维乌斯，我必须走流亡者之路。我用天鹅绒换粗羊毛，用权杖换行路杖。他日记中的线索指引我离开人烟，走向帝国影响力崩塌的寂静之地。我在追踪一个花了几个世纪掩盖踪迹的幽灵。"
 water_of_life.1002.a:0 "道路漫长，但我的意志如铁。"
 water_of_life.1002.b:0 "最后看一眼我的王国，然后消失。"
 water_of_life_header_2:0 "荒野："
 water_of_life.1003.t:1 "$water_of_life_header_2$ 七种力量。"
 water_of_life.1003.desc:0 "荒野将一个[ROOT.Char.GetWomanMan] 剥至骨髓。正如《玛利亚福音》所警告的，灵魂被七种愤怒的力量所困：黑暗、欲望和无知。独自在篝火旁，我与它们搏斗。我不怕强盗；我怕的是克拉维乌斯找到他的上帝的寂静。我的思想——神圣心智——必须像坟墓一样寂静，直到石头被滚开。"
 water_of_life.1003.a:0 "我征服了回头的冲动。"
 water_of_life_header_3:0 "耐力试炼："
 water_of_life.1004.t:1 "$water_of_life_header_3$ 士兵的口粮。"
 water_of_life.1004.desc:0 "补给不足。这 landscape 是无情的岩石和荆棘。我现在明白他为什么选择这个地方：它是一座天然堡垒。饥饿折磨着我的肚子。我是像领主一样狩猎，还是像朝圣者一样乞求？护民官会尊重纪律，但抹大拉教导谦卑。"
 water_of_life.1004.a:0 "我会狩猎。纪律滋养身体。"
 water_of_life.1004.b:0 "我会寻找当地人。谦卑滋养灵魂。"
 water_of_life_header_4:0 "狩猎："
 water_of_life.1005.t:1 "$water_of_life_header_4$ 军团的标志。"
 water_of_life.1005.desc:0 "我发现一个 marker——一个以军事 precision 堆叠的石冢。然后又一个。我不是在 wander；我是在被引导。或者也许...被驱赶。在一条溪边，我看到一只雄鹿。它没有跑。它看着我，无所畏惧，仿佛受强大守护者的保护。我没有放箭。在这里杀戮感觉像是违反了休战协议。"
 water_of_life.1005.a:0 "我放下弓。我是这里的客人。"
 water_of_life_header_5:0 "村庄："
 water_of_life.1006.t:1 "$water_of_life_header_5$ 山中的老人。"
 water_of_life.1006.desc:0 "一个小村庄依附在山腰上。当我问起罗马人时，村民们画了鱼符。一位长者低语：“那位陌生人？从我曾祖父的曾祖父起他就在这里。他穿着旧世界的铁甲。他保护我们免受狼群和强盗的侵害，但他从不说话。他在等一个人。”长者看着我。“也许是你。”"
 water_of_life.1006.a:0 "他知道我要来。"
 water_of_life_header_6:0 "接近："
 water_of_life.1007.t:1 "$water_of_life_header_6$ 第十军团。"
 water_of_life.1007.desc:0 "小径变窄为羊肠小道，通向一个用古石加固的洞穴入口。我感到有目光注视着我——那是见证了帝国兴衰化为尘埃的目光的重压。我停下，举起空手。“护民官！”我喊道。“我寻找永生者！”\n\n寂静回应。然后，石头 grinding 的声音。"
 water_of_life.1007.a:0 "进入狮穴。"
 water_of_life_header_8:0 "护民官："
 water_of_life.1008.t:1 "$water_of_life_header_8$ 克拉维乌斯·阿奎拉。"
 water_of_life.1008.desc:0 "他坐在简陋的篝火旁，擦拭着一把仍闪耀如新的西班牙短剑。他穿着罗马护民官的 tunic，尽管皮革被万古岁月磨损得光滑。克拉维乌斯抬起头，他的眼睛沉重地承载着一千年的记忆。\n\n“我见过两件无法和解之事，”他说道，声音如砾石。“一个无疑已死的人，和那个同样的人又活了过来。我答应玛利亚我会守望，直到一个 worthy 的继承人到来。”\n\n他深深凝视火焰。“我 advise 过许多国王。我站在麻风国王鲍德温身边，听他命令：#P *‘不要虐待犹太人或穆斯林。在这个王国里，没有种族，只有上帝的子民。’*#! 你现在必须承载那份公正。”\n\n他递出一个简单的陶杯，几个世纪来已镶嵌满珠宝。“《福音》说：*物质产生了一种无与伦比的情感。* 饮下它，情感就死了。只有责任 remain。你准备好接我的班了吗，[ROOT.GetCharacter.GetTitledFirstNameNoTooltip]？”"
 water_of_life.1008.a:0 "“我接替你，护民官。去安息吧。”"
 water_of_life_header_9:0 "回归："
 water_of_life.1009.t:1 "$water_of_life_header_9$ 新的哨卫。"
 water_of_life.1009.desc:0 "圣杯触及我嘴唇的那一刻，克拉维乌斯化为了尘土——终于 peace。我带着他的重担和他的血液回到我的王国。我的臣民欢呼，但他们不明白。他们看到一个统治者；我看到了肉体的 transient 本质。\n\n[one_loyal_subject_character.GetFirstNameNoTooltip]：我的[ROOT.Char.GetLadyLord]，你回来了！\n\n[second_loyal_subject_character.GetFirstNameNoTooltip]：我们担心你迷失在荒野中！\n\n[third_loyal_subject_character.GetFirstNameNoTooltip]：你看...令人恐惧地平静。\n\n[fourth_loyal_subject_character.GetFirstNameNoTooltip]：欢迎回家，守护者。"
 water_of_life.1009.a:0 "我再也无法和从前一样。"

