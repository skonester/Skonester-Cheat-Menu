 set_immortal_interaction:0 "赐予不朽"
 set_immortal_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] 将被赐予永生，容颜永远保持在二十五岁之龄。"
 set_mortal_interaction:0 "剥夺不朽"
 set_mortal_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] 将从无尽生命的锁链中解脱。也许[recipient.GetSheHe]渴望坟墓的安息。"
 set_super_interaction:0 "受膏为完人"
 set_super_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] 将被提升至远超凡人的境界：智慧、力量、生育力、活力、声望、财富和恐怖值无与伦比。真正是领主中的完人。"
