 set_unsuper_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] 将被剥夺所有崇高的恩赐。[recipient.GetSheHe|U] 可能会觉得这个负担非常沉重。"
 set_super_governor_interaction:0 "赐予管家之令"
 set_super_governor_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] 将被授予治理王国的大师能力：更多的征召兵、明智的管理、快速建造厅堂、繁荣昌盛以及平民的爱戴。"
 set_unsuper_governor_interaction:0 "撤销管家之令"
 set_unsuper_governor_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] 将失去这些治理的祝福，回归凡人的局限。"
 set_super_general_interaction:0 "祝福为战争领主"
 set_super_general_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] 将成为无与伦比的军队统帅：勇武、军事才能、战略和耐力无双；在战斗中令人恐惧，在围攻中迅捷无比。"
 set_unsuper_general_interaction:0 "撤销战争领主祝福"
 set_unsuper_general_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] 将被剥夺所有战争中的神圣眷顾，可能在曾经凯旋的地方步履蹒跚。"
 set_all_in_one_interaction:0 "加冕为典范"
 set_all_in_one_interaction_desc:0 "对于[recipient.GetShortUINameNoTooltip|U]，所有祝福皆予之：完人、管家之令、战争领主，合于一身。实乃 Skonester 秘术的奇观。"
 set_unall_in_one_interaction:0 "回归凡人位阶"
 set_unall_in_one_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] 将失去完人、管家和战争领主的所有恩赐，再次作为凡人行走。"

