 special_gift_interaction_desc_2:0 "与[recipient.GetShortUINameNoTooltip]共享圣杯——将你们的灵魂结合，超越统治这个世界的势力所能触及的范围。"
 special_gift_interaction_tooltip_2:0 "我亲爱的[recipient.GetFirstNameNoTooltip]，“两件无法和解之事”在我们之中找到了它们的结合。饮下此杯，让我们永远共同居于静默之中。"
 special_gift_interaction_3:0 "#bold #X 生#!#N 命#!#X 之#!#N 水#! #!"
 special_gift_interaction_desc_3:0 "将守望的重任传递给[recipient.GetShortUINameNoTooltip]——确保玛利亚的血脉超越自然的消解而崛起。"
 special_gift_interaction_tooltip_3:0 "我的孩子，#E 人子#! 就在你之内。跟随他！饮下此杯，成为对抗时间潮汐的锚。"
 special_gift_interaction_4:0 "#bold #X 生#!#N 命#!#X 之#!#N 水#! #!"
 special_gift_interaction_desc_4:0 "授予[recipient.GetShortUINameNoTooltip]第十军团的活力——一种并非以黄金，而是以圣灵的永恒锻造的忠诚。"
 special_gift_interaction_tooltip_4:0 "战友[recipient.GetShortUINameNoTooltip]——饮下此杯。战争漫长，死亡是我们再也无法承受的沉睡。与我一起坚守战线。"
 trait_water_of_life:0 "圣言哨卫"
