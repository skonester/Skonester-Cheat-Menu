 ### 来自：water_of_life_decisions_l_english.yml
 start_searching_for_water_of_life_decision:0 "无死之日"
 start_searching_for_water_of_life_decision_tooltip:1 "克拉维乌斯在罗马之外，在玛利亚的#E 神圣心智#！中找到了他所寻求的平静。他永远确保了他们的血统。"
 start_searching_for_water_of_life_decision_desc:0 "#F“我见过两件无法和解之事：一个无疑已死的人，和那个同样的人又活了过来。”#!\n\n当护民官克拉维乌斯·阿奎拉逃离罗马的疯狂时，他追随了那个被其他人拒绝的人。正如《玛利亚福音》所记载的，彼得质问她：“他真的在我们不知情的情况下单独与一个女人说话吗？”但利未回答说：“如果救主认为她配得上，你又是谁，竟能拒绝她？”\n\n克拉维乌斯成为了那种配得上的利剑。为了保护玛利亚——她将头发染成罗马黏土般的红色以作伪装——以及他们的秘密子女，他饮下了圣杯。他成为了对抗物质消解的锚，守护着她所教导的真理：#'人子在你之内。跟随他！'#!\n\n#P 护民官从未死去。他仍然行走于世间，是诺斯替教义的永恒哨卫。#!\n\n#X #bold ~ 第十军团护民官，静默的守护者 ~ \n   ~ ‘他爱她胜过我们’ ~ \n~ 重生者芭芭拉，必将崛起 ~ #! #!"
 start_searching_for_water_of_life_decision_start:0 "#Y #bold *“愿你们平安。在你们自己里面获得我的平安。”*#!"
 start_searching_for_water_of_life_decision_proceed:0 "坟墓上的封印被打破了，死亡的掌控也被打破了。克拉维乌斯隐匿在阴影中，等待着他所爱的玛利亚的#E 神圣心智#！的后裔。接受加入#P 芭芭拉之脉#！——抹大拉的转世。获得#Z 护民官的庇护#！和#E 对圣杯的宣称#！，但要警惕正统教会的嫉妒。"
 start_searching_for_water_of_life_decision_stress:0 "玛利亚教导说：“因为心智在哪里，宝藏就在哪里。”然而克拉维乌斯在肉体中徘徊了数个世纪，而她却升天在静默中安息。我能承受这分离吗？"
 start_searching_for_water_of_life_decision_stress_lazy:0 "#N“提防，免得有人误导你们。”守护者不能睡觉。带着[GetTrait('lazy').GetName( GetPlayer )]，寻找#E 内在人子#！所需的纪律将化为尘土。#!"
 start_searching_for_water_of_life_decision_confirm:0 "万有都复归于其本源。"
