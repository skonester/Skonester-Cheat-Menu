building_type_db_tribal_assembly_01:0 "部落集会"
building_type_db_tribal_assembly_01_desc:0 "#F这是部落决定重要事务的集会场所。在集会上，人们会讨论即将到来的战争、信仰等事宜。#!"
building_db_tribal_assembly_01:0 "部落集会"
building_db_tribal_assembly_01_desc:0 "这是部落决定重要事务的集会场所。在集会上，人们会讨论即将到来的战争、信仰等事宜。"
building_db_tribal_assembly_02:0 "扩大的部落集会"
building_db_tribal_assembly_02_desc:0 "每当部落决定重要事务时，举行集会总是令人疲惫。如果有一个由酋长身边的技术娴熟的战士、萨满组成的顾问团，酋长就能及时处理迫在眉睫的问题。"
building_type_db_shura_council_01:0 "舒拉议会"
building_type_db_shura_council_01_desc:0 "#F舒拉是一个阿拉伯词，意为“协商”。它在早期伊斯兰社区中被用来鼓励在做出重大决定前进行相互协商。#!"
building_db_shura_council_01:0 "非永久性舒拉议会"
building_db_shura_council_01_desc:0 "舒拉议会已经建立。虽然是非永久性的，但苏丹在必要时可以寻求政策建议。"
building_db_shura_council_02:0 "永久性舒拉议会"
building_db_shura_council_02_desc:0 "通过重组舒拉议会，苏丹始终能够获得恰当的建议。"
building_db_shura_council_03:0 "扩大的舒拉议会"
building_db_shura_council_03_desc:0 "通过扩大舒拉议会，苏丹能够在更多领域获得专业建议。"
building_type_db_royal_mosque_01:0 "皇家清真寺"
building_type_db_royal_mosque_01_desc:0 "#F王室成员前往礼拜的清真寺。#!"
building_db_royal_mosque_01:0 "皇家清真寺"
building_db_royal_mosque_01_desc:0 "$building_type_db_royal_mosque_01_desc$"
building_db_royal_mosque_02:0 "皇家伊斯兰学校"
building_db_royal_mosque_02_desc:0 "伊斯兰学校建在皇家清真寺下，用于教授神学等各种学科。"
building_db_royal_mosque_03:0 "皇家墓穴"
building_db_royal_mosque_03_desc:0 "皇家清真寺下建造了一座墓穴，让王室成员得以安息。"
building_type_db_royal_chapel_01:0 "皇家礼拜堂"
building_type_db_royal_chapel_01_desc:0 "#F王室成员前往礼拜的礼拜堂。#!"
building_db_royal_chapel_01:0 "皇家礼拜堂"
building_db_royal_chapel_01_desc:0 "$building_type_db_royal_chapel_01_desc$"
building_db_royal_chapel_02:0 "扩建的皇家礼拜堂"
building_db_royal_chapel_02_desc:0 "通过扩建皇家礼拜堂，各种教育设施得以扩建，学生们可以学习神学等学科。"
building_db_royal_chapel_03:0 "皇家墓穴"
building_db_royal_chapel_03_desc:0 "皇家礼拜堂下建造了一座墓穴，让王室成员得以安息。"
building_type_db_insular_monas_01:0 "海岛修道院"
building_type_db_insular_monas_01_desc:0 "#F在典型的西方教会中，教会组织的基本单位是教区，但爱尔兰并非如此。在爱尔兰，教会是基于各部落酋长建立的修道院组织起来的，并由部落酋长的后代控制。这些修道院不像普通的中世纪修道院那样是巨大的石头建筑，而是一群围绕着小教堂的茅草屋。#!"
building_db_insular_monas_01:0 "海岛修道院"
building_db_insular_monas_01_desc:0 "$building_type_db_insular_monas_01_desc$"
building_db_insular_monas_02:0 "扩建的海岛修道院"
building_db_insular_monas_02_desc:0 "在当地部落酋长的投资下扩建了修道院。将有比以往更多的僧侣在这里过着极度虔诚的生活，并会充满热情地努力学习。"
building_type_db_local_parliament_01:0 "地方议会"
building_type_db_local_parliament_01_desc:0 "#F地方议会是君主寻求治理建议或获得民众同意的地方。#!"
building_db_local_parliament_01:0 "非永久性地方议会"
building_db_local_parliament_01_desc:0 "地方议会已经建立。虽然是非永久性的，但君主在必要时可以咨询政策。"
building_db_local_parliament_02:0 "永久性地方议会"
building_db_local_parliament_02_desc:0 "通过重组地方议会，君主始终能够获得恰当的建议。"
building_db_local_parliament_03:0 "扩大地方议会"
building_db_local_parliament_03_desc:0 "通过扩大地方议会，君主能够在更多领域获得专业建议。"
building_type_db_local_library_01:0 "图书馆"
building_type_db_local_library_01_desc:0 "#F这是一个储存许多书籍的地方。#!"
building_db_local_library_01:0 "小图书馆"
building_db_local_library_01_desc:0 "这是一个小图书馆。虽然藏书量很少，但想从书中学习的人会来到这里。"
building_db_local_library_02:0 "著名地方图书馆"
building_db_local_library_02_desc:0 "由于当地统治者的投资，我们得以扩大藏书并雇佣抄写员来抄写书籍。"
building_db_local_library_03:0 "大图书馆"
building_db_local_library_03_desc:0 "这是一个藏书丰富的图书馆。许多远道而来的人来这里学习。"
building_type_db_artificial_forest_01:0 "人造森林"
building_type_db_artificial_forest_01_desc:0 "#F由于我们王国缺乏森林，我们从邻国购买树木。人工造林不仅能减少这种浪费，还能为建筑、造船和射箭提供稳定的原材料供应。#!"
building_db_artificial_forest_01:0 "小型人造森林"
building_db_artificial_forest_01_desc:0 "我们植树造林，人工创造了小型森林。"
building_db_artificial_forest_02:0 "任命森林看守人"
building_db_artificial_forest_02_desc:0 "我们任命了一名森林看守人来管理人工林。"
building_db_artificial_forest_03:0 "大型人造森林"
building_db_artificial_forest_03_desc:0 "我们人工造林的计划成功了。现在我们可以利用森林进行训练，并轻松获得建筑、造船、制弓等的原材料。"
building_type_db_caravan_sarai_01:0 "商队驿站"
building_type_db_caravan_sarai_01_desc:0 "#F商队驿站是路边客栈，旅行者可以在此休息，从一天的旅程中恢复过来。商队驿站支持了覆盖亚洲、北非和东南欧的贸易路线网络上的商业、信息和人员流动，尤其是丝绸之路。#!"
building_db_caravan_sarai_01:0 "商队驿站"
building_db_caravan_sarai_01_desc:0 "$building_type_db_caravan_sarai_01_desc$"
building_db_caravan_sarai_02:0 "商队驿站"
building_db_caravan_sarai_02_desc:0 "$building_type_db_caravan_sarai_01_desc$"
building_db_caravan_sarai_03:0 "商队驿站"
building_db_caravan_sarai_03_desc:0 "$building_type_db_caravan_sarai_01_desc$"
building_type_db_prison_cell_01:0 "监狱塔"
building_type_db_prison_cell_01_desc:0 "#F这是一个“妥善”对待囚犯的地方。#!"
building_db_prison_cell_01:0 "扩建的监狱"
building_db_prison_cell_01_desc:0 "扩建监狱将有助于让囚犯的生活更加痛苦。"
building_db_prison_cell_02:0 "处刑场"
building_db_prison_cell_02_desc:0 "与其痛苦地活着，不如痛快地结束，不是吗？"
building_db_prison_cell_03:0 "加固的监狱塔"
building_db_prison_cell_03_desc:0 "加固监狱塔将防止因敌人入侵而导致治安恶化。"
building_type_db_court_justice_01:0 "司法法庭"
building_type_db_court_justice_01_desc:0 "#F这是一个根据法律审判罪行并对罪人判刑的地方。#!"
building_db_court_justice_01:0 "百户法庭"
building_db_court_justice_01_desc:0 "在一些百户区，法庭在固定地点举行；而在另一些地方，法庭每次开庭都会移动到不同地点。百户法庭的主要职责是维护十户联保制度。法庭由十二名自由佃农或自由民组成。"
building_db_court_justice_02:0 "郡法庭"
building_db_court_justice_02_desc:0 "郡法庭是一个法律机构，用于在地方层面维护法律和秩序，并履行各种行政职能，包括为中央政府征税。"
building_db_court_justice_03:0 "王座法庭"
building_db_court_justice_03_desc:0 "王座法庭是一个普通法法庭。它创建于12世纪末至13世纪初，源自御前会议，最初随君主巡游。王座法庭最终于1318年与普通诉讼法庭和财政法庭一同落户威斯敏斯特大厅，并于1421年完成了最后一次巡游。"
building_type_db_statue_horse_01:0 "骏马雕像"
building_type_db_statue_horse_01_desc:0 "#F这是一座纪念名为“闪光蹄”的传奇骏马的雕像。#!"
building_db_statue_horse_01:0 "骏马雕像"
building_db_statue_horse_01_desc:0 "$building_type_db_statue_horse_01_desc$"
building_db_statue_horse_02:0 "镀金"
building_db_statue_horse_02_desc:0 "为“闪光蹄”雕像镀金是表达更多敬意的好方法。"
building_db_statue_horse_03:0 "附加动物雕像"
building_db_statue_horse_03_desc:0 "如果在“闪光蹄”雕像旁边添加一个小型动物雕像，它的形态将更加完美。"
building_type_db_kurultai_01:0 "忽里勒台"
building_type_db_kurultai_01_desc:0 "#F忽里勒台是古代蒙古和突厥酋长及汗的政治和军事议会。例如成吉思汗和窝阔台汗等所有蒙古帝国的大汗都在忽里勒台上正式选出；附属蒙古政权（如金帐汗国）的汗则由类似的地区性忽里勒台选出。#!"
building_db_kurultai_01:0 "忽里勒台"
building_db_kurultai_01_desc:0 "忽里勒台已经举行。虽然是非永久性的，但可汗在必要时可以咨询政策。"
building_db_kurultai_02:0 "永久性忽里勒台"
building_db_kurultai_02_desc:0 "通过重组忽里勒台，可汗始终能够获得恰当的建议。"
building_db_kurultai_03:0 "扩大的忽里勒台"
building_db_kurultai_03_desc:0 "通过扩大忽里勒台，可汗能够在更多领域获得专业建议。"
building_type_db_lighthouse_01:0 "灯塔"
building_type_db_lighthouse_01_desc:0 "#F这是一座高塔，保障夜间航行船只的安全。#!"
building_db_lighthouse_01:0 "灯塔"
building_db_lighthouse_01_desc:0 "$building_type_db_lighthouse_01_desc$"
building_db_lighthouse_02:0 "巨型旗帜"
building_db_lighthouse_02_desc:0 "如果在灯塔上安装巨型旗帜，即使在遥远的海上，水手也能辨认出我们的灯塔。"
building_db_lighthouse_03:0 "大灯塔"
building_db_lighthouse_03_desc:0 "我们的灯塔为在附近海域航行的水手所熟知。灯塔建成后，许多船只安全抵达我们的港口。"
building_type_db_mercenary_camp_01:0 "雇佣兵营地"
building_type_db_mercenary_camp_01_desc:0 "#F这是一个愿意为钱卖命的人聚集的地方。#!"
building_db_mercenary_camp_01:0 "雇佣兵营地"
building_db_mercenary_camp_01_desc:0 "$building_type_db_mercenary_camp_01_desc$"
building_db_mercenary_camp_02:0 "扩建的雇佣兵营地"
building_db_mercenary_camp_02_desc:0 "更多闻到王国血腥味的雇佣兵聚集到了营地。更多的雇佣兵争相求职，并从当地商店购买用于下一场战斗的物资。当然，喝醉的雇佣兵和当地人之间的斗殴也增多了。"
building_type_db_things_01:0 "庭集"
building_type_db_things_01_desc:0 "#F庭集是早期日耳曼社会中的治理集会，由自由民组成，由法律宣讲人主持。\n\n在基督教化前斯堪的纳维亚的氏族文化中，氏族成员有义务为其死伤或被残害的亲属报仇。因此，世仇常被视为维京社会中最常见的冲突解决方式。然而，庭集在更普遍的意义上是一种平衡结构，用于减少部落世仇并避免北日耳曼文化中的社会失序。它们在维京社会中作为解决冲突、缔结婚姻联盟、展示力量、维护荣誉和处理继承事务的论坛发挥了重要作用。#!"
building_db_things_01:0 "庭集"
building_db_things_01_desc:0 "$building_type_db_things_01_desc$"
building_db_things_02:0 "永久性庭集"
building_db_things_02_desc:0 "通过重组庭集，领主始终能够获得恰当的建议。"
building_db_things_03:0 "扩大的庭集"
building_db_things_03_desc:0 "通过扩大庭集，领主能够在更多领域获得专业建议。"
building_type_db_fair_01:0 "集市"
building_type_db_fair_01_desc:0 "#F集市是为了各种娱乐或商业活动而聚集的人群。集市通常是临时的，有预定的时间，从下午到几周不等。\n\n在中世纪，许多集市发展为临时市场，对长途和国际贸易尤其重要，因为批发商有时会旅行数天到集市，以确保能见到他们需要买卖的对象。#!"
building_db_fair_01:0 "小型集市"
building_db_fair_01_desc:0 "$building_type_db_fair_01_desc$"
building_db_fair_02:0 "集市"
building_db_fair_02_desc:0 "$building_type_db_fair_01_desc$"
building_db_fair_03:0 "地区性集市"
building_db_fair_03_desc:0 "自从王国举办集市以来，越来越多的人前来。"
building_db_fair_04:0 "盛大集市"
building_db_fair_04_desc:0 "自从王国举办集市以来，越来越多的人前来。集市上有各种可看可吃的东西，还有来自王国的各种物品出售。"
building_type_db_royal_cynagogue_01:0 "皇家犹太会堂"
building_type_db_royal_cynagogue_01_desc:0 "#F王室成员前往礼拜的犹太会堂。#!"
building_db_royal_cynagogue_01:0 "皇家犹太会堂"
building_db_royal_cynagogue_01_desc:0 "$building_type_db_royal_cynagogue_01_desc$"
building_db_royal_cynagogue_02:0 "扩建的皇家犹太会堂"
building_db_royal_cynagogue_02_desc:0 "通过扩建会堂，允许更多信徒前来。"
building_db_royal_cynagogue_03:0 " Torah 圣柜"
building_db_royal_cynagogue_03_desc:0 " Torah 圣柜是存放 Torah 经卷的柜子。会堂中的圣柜几乎总是放置在这样一个位置：面对它的人面朝耶路撒冷。"
building_type_db_royal_hindu_01:0 "皇家神庙"
building_type_db_royal_hindu_01_desc:0 "#F王室成员前往礼拜的印度教神庙。#!"
building_db_royal_hindu_01:0 "皇家神庙"
building_db_royal_hindu_01_desc:0 "$building_type_db_royal_cynagogue_01_desc$"
building_db_royal_hindu_02:0 "卡拉伊学院"
building_db_royal_hindu_02_desc:0 "在神庙中设立卡拉伊学院，学生可以在此学习吠陀经典。在学院中，学者和学生将背诵和学习梵语及吠陀经典。"
building_db_royal_hindu_03:0 "医院"
building_db_royal_hindu_03_desc:0 "在神庙内设立医院，为病人和穷人提供医疗救助。"
building_type_db_statue_ruler_01:0 "英雄雕像"
building_type_db_statue_ruler_01_desc:0 "#F这是一座纪念传奇英雄的雕像。#!"
building_db_statue_ruler_01:0 "英雄雕像"
building_db_statue_ruler_01_desc:0 "$building_type_db_statue_ruler_01_desc$"
building_db_statue_ruler_02:0 "镀金"
building_db_statue_ruler_02_desc:0 "为雕像镀金是表达更多敬意的好方法。"
building_db_statue_ruler_03:0 "附加雕像"
building_db_statue_ruler_03_desc:0 "如果在雕像旁边添加一个小雕像，它的形态将更加完美。"
building_type_db_menagerie_01:0 "皇家动物园"
building_type_db_menagerie_01_desc:0 "#F动物园是一个圈养动物（通常是 exotic 动物）供展示的场所。动物园通常与贵族或王室宫廷相关，位于宫殿的花园或公园内。这些贵族希望展示他们的权力和财富，因为活的、活跃的 exotic 动物更少见、更难获得且维护成本更高。#!"
building_db_menagerie_01:0 "皇家动物园"
building_db_menagerie_01_desc:0 "$building_type_db_menagerie_01_desc$"
building_db_menagerie_02:0 "扩建的皇家动物园"
building_db_menagerie_02_desc:0 "通过扩建动物园，可以饲养比以往更多的动物。现在，更多的贵族会羡慕我们的财富和权力。然而，当地的祭司开始在布道中公开宣讲我们的奢侈。"
building_db_menagerie_03:0 "异域动物园"
building_db_menagerie_03_desc:0 "我们持续收集远方异域动物的努力似乎终于得到了回报。现在，我们饲养着各种异域动物，如大象、骆驼、狮子、豹子和白鹿。"
building_type_db_rabbi_council_01:0 "拉比议会"
building_type_db_rabbi_council_01_desc:0 "#F犹太人被逐出耶路撒冷后，拉比领导犹太人按照 Torah 生活。邀请著名的拉比听取他们的建议，将有助于我们的宫廷按照 Torah 的正确方向运作。#!"
building_db_rabbi_council_01:0 "拉比议会"
building_db_rabbi_council_01_desc:0 "$building_type_db_rabbi_council_01_desc$"
building_db_rabbi_council_02:0 "永久性拉比议会"
building_db_rabbi_council_02_desc:0 "通过重组议会，领主始终能够获得恰当的建议。"
building_db_rabbi_council_03:0 "扩大的拉比议会"
building_db_rabbi_council_03_desc:0 "通过扩大议会，领主能够在更多领域获得专业建议。"

