 sarc_char_design.dyn.choice.event.d:0 "选择是杀死你的宗族成员，还是仅给其中一些添加剥夺继承权特质。\n\n这样做是为了确保你的角色继承统治者的头衔。\n\n杀死他们给你一种从几乎空白的宗族开始奋斗的感觉，而剥夺一些人的继承权则让宗族基本保持完整。\n\n对于多人游戏，我建议选择剥夺继承权选项，以免宗族清除影响到其他玩家。"
