##### For Taurus/theocratic_elective_succession_law:1 "神权选举制"
 theocratic_elective_succession_law_effects:2 "所有[de_jure|E] [vassals|E]可以从他们自己、统治者的[close_family|E]和[claimant|E]s中提名一位[title_heir|E]。此[succession_law|E]中的[voting_power|E]受[elector|E]的[title_tier|E]、[piety_level|E]和[virtuous|E] [traits|E]影响。选举人会青睐[piety_level|E]高和[virtuous|E] [traits|E]高的候选人。"
 theocratic_elective_candidates:0 "近亲、宣称者和法理封臣"
 theocratic_elective_candidates_tooltip:1 "要成为神权选举制下的有效候选人，角色必须满足以下条件之一：\n$EFFECT_LIST_BULLET$是当前统治者的合法[close_family|E]成员，且不属于继承共和制的人。候选人的子女不能被提名\n$EFFECT_LIST_BULLET$是该头衔的[claimant|E]，且不属于继承共和制的人\n$EFFECT_LIST_BULLET$是该头衔的[de_jure|E] [vassal|E]"
 theocratic_elective_electors:0 "法理封臣"
 theocratic_elective_electors_tooltip:0 "要成为神权选举制下的有效[elector|E]，封臣必须满足以下所有条件：\n$EFFECT_LIST_BULLET$是该头衔的[de_jure|E] [vassal|E]\n$EFFECT_LIST_BULLET$是伯爵或更高等级。"
