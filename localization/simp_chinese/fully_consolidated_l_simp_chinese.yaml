 inbreed_marry_desc:0 "被标记的王朝或家族的亲属在可能的情况下将彼此婚配。系统优先选择同父异母/同母异父的兄弟姐妹、堂表亲或舅甥关系，同时遵循宗教规则，并旨在培育纯血后代。"
 males_concubine:0 "为男性指定侍妾"
 males_concubine_desc:0 "来自被标记的王朝或家族的符合条件的男性将被指定侍妾，直至达到信仰和法律允许的上限。"
 females_concubine:0 "为女性指定侍妾"
 females_concubine_desc:0 "来自被标记的王朝或家族的符合条件的女性将被指定侍妾，直至达到允许的最大数量，尊重宗教和文化限制。"
 dynasty_marry:0 "标记整个王朝"
 dynasty_marry_desc:0 "标记整个王朝，其成员将根据设定自动结婚、被指定为侍妾或受优生规则约束。一个可见的王朝修正会跟踪此状态。"
 house_marry:0 "标记整个家族"
 house_marry_desc:0 "标记王朝内的单个家族，以便其成员自动结婚和被指定为侍妾。一个家族修正将识别该家族为已标记。"
 individual_marry_exempt:0 "豁免个体"
 individual_marry_exempt_desc:0 "标记单个角色，使其被自动结婚或侍妾安排跳过。一个修正会将其标记为豁免。"
 males_marry_dynasty:0 "王朝男性将结婚"
 males_marry_dynasty_desc:0 "此王朝的男性每年由系统自动安排婚姻。"
 females_marry_dynasty:0 "王朝女性将结婚"
 females_marry_dynasty_desc:0 "此王朝的女性每年被自动安排为母系婚姻。"
 inbreed_marry_dynasty:0 "王朝受血缘束缚"
 inbreed_marry_dynasty_desc:0 "此王朝鼓励成员之间的近亲婚姻，优先考虑兄弟姐妹、堂表亲或叔舅/姑姨与侄甥之间的结合。"
 males_concubine_dynasty:0 "王朝男性拥有侍妾"
 males_concubine_dynasty_desc:0 "此王朝的男性将根据信仰和法律自动被给予侍妾。"
 females_concubine_dynasty:0 "王朝女性拥有侍妾"
 females_concubine_dynasty_desc:0 "此王朝的女性将根据信仰和习俗自动被给予侍妾。"
 males_marry_house:0 "家族男性将结婚"
 males_marry_house_desc:0 "此家族的男性每年自动安排婚姻。"
 females_marry_house:0 "家族女性将结婚"
 females_marry_house_desc:0 "此家族的女性每年自动安排为母系婚姻。"
 inbreed_marry_house:0 "家族实行亲属婚姻"
 inbreed_marry_house_desc:0 "此家族安排成员之间的近亲婚姻，偏向于加强血统的结合。"
 males_concubine_house:0 "家族男性拥有侍妾"
 males_concubine_house_desc:0 "此家族的男性将自动被指定侍妾。"
 females_concubine_house:0 "家族女性拥有侍妾"
 females_concubine_house_desc:0 "此家族的女性将根据习俗自动被指定侍妾。"
 males_eugenic:0 "男性优生婚姻"
 males_eugenic_desc:0 "被标记的王朝或家族的符合条件的男性将在婚姻中倾向于纯正和强大的血统，优先选择基因上理想的结合。"
 females_eugenic:0 "女性优生婚姻"
 females_eugenic_desc:0 "被标记的王朝或家族的符合条件的女性将结婚（如果可能为母系）以保持或加强血统。"
 males_eugenic_dynasty:0 "王朝追求男性优生"
 males_eugenic_dynasty_desc:0 "此王朝为其男性安排婚姻，意图产生强大、纯血的后代。"
 females_eugenic_dynasty:0 "王朝追求女性优生"
 females_eugenic_dynasty_desc:0 "此王朝为其女性安排婚姻，意图产生强大、纯血的后代。"
 males_eugenic_house:0 "家族追求男性优生"
 males_eugenic_house_desc:0 "此家族为其男性安排婚姻，追求血统纯度和力量。"
 females_eugenic_house:0 "家族追求女性优生"
 females_eugenic_house_desc:0 "此家族为其女性安排婚姻，追求血统纯度和力量。"

