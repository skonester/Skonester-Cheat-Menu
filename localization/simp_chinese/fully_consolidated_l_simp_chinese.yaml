  daddy_pika_information:0 "Skonester Cheat Menu Gold - Pre Chapter V"
  information_desc:0 "这是 Skonester Cheat Menu Gold - Pre Chapter V 的 GitHub 测试版本。部分功能可能尚未完成或不稳定。请在 GitHub 上报告所有错误和脚本错误，并附上 CK3 的 error.log、模组加载顺序和复现步骤。"
  information_TT:0 "点击查看 Pre Chapter V GitHub 测试版本的信息。"
  dp_information.changelog.t:0 "Skonester Cheat Menu Gold - Pre Chapter V"
  dp_information.changelog.d:0 "Chapter V 前的 GitHub 公开测试版本。请在 GitHub 上报告菜单失效、本地化缺失、事件错误、游戏崩溃和其他异常行为。"
  dp_information.useful_tips.t:0 "实用提示"
  dp_information.useful_tips.d:0 "功能菜单\n- 单击添加，再次单击移除。\n- 如果某个功能没有出现，并不意味着模组损坏；这可能是 Paradox 的硬编码覆盖所致。\n- 由于 DLC 因素，某些互动可能不会出现在特定角色上。\n- 骑士血统特质在新游戏开始时以少量随机添加，以赋予随机 NPC 有趣的属性。如果大家不习惯，我会将其移除。\n- 如果你需要降级游戏版本，此模组也支持旧版游戏。"
  dp_information.locations.t:0 "GitHub 测试版本 — 错误报告"
  dp_information.locations.d:0 "请在 GitHub 上报告错误。请说明点击了什么、发生了什么、预期结果、模组加载顺序，并附上 Documents/Paradox Interactive/Crusader Kings III/logs/error.log 中的相关内容。"
