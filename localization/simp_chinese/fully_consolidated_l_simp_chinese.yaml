 special_gift_interaction:0 "#bold #X 生#!#N 命#!#X 之#!#N 水#! #!"
 special_gift_interaction_desc:0 "向[recipient.GetShortUINameNoTooltip]揭示克拉维乌斯在空墓中发现的真相——将圣灵从物质枷锁中分离出来的圣杯。"
