 skonester_cheat_menu.0010.cancel: "就此打住"
 skonester_cheat_menu.0010.continue: "不再克制……"
 skonester_cheat_menu.0010.desc: "屏退侍從，你與 [skonester_cheat_menu_target.GetShortUIName] 獨處一室。羅帷將塵世隔絕在外，[skonester_cheat_menu_target.GetSheHe] 的吐息拂過你頸側，燭火在 [skonester_cheat_menu_target.GetHerHis] 眼底明滅——疆場與朝議，此刻皆不值一提。"
 skonester_cheat_menu.0010.desc_camp: "軍帳外風聲獵獵，帳內卻暖香氤氳。你與 [skonester_cheat_menu_target.GetShortUIName] 在行軍榻上相擁，鎧甲尚溫，肌膚更燙——亂世裡的片刻荒唐，竟比凱旋更令人戰慄。"
 skonester_cheat_menu.0010.desc_concubine: "妾 [skonester_cheat_menu_target.GetShortUIName] 低眉解帶，聲息細若遊絲，卻字字落在心尖。她知自己名分有限，反倒更懂得如何用眼神與指尖，把你牢牢留在這一方繡榻之上。"
 skonester_cheat_menu.0010.desc_lover: "你與情人 [skonester_cheat_menu_target.GetShortUIName] 早已心照不宣。指尖相觸，仍帶著上次幽會的餘溫；帳中薰香與體溫纏在一處，仿佛要把彼此揉進同一輪月色裡。"
 skonester_cheat_menu.0010.desc_spouse: "正妻 [skonester_cheat_menu_target.GetShortUIName] 為你寬衣拂發，眉眼間儘是被寵慣了的從容。榻上錦衾尚涼，[skonester_cheat_menu_target.GetSheHe] 卻已將你攬入懷中——名正言順的溫存，比任何密會都更叫人沉溺。"
 skonester_cheat_menu.0010.t: "親密 · 春宵"
 skonester_cheat_menu.0012.desc: "雲收雨歇，你們仍慵懶地偎在同一張榻上。[skonester_cheat_menu_target.GetShortUIName] 頰染緋色，指尖還停在你腕間；帳外更漏聲遠，而衾枕間的暖意遲遲不肯散去。"
 skonester_cheat_menu.0012.ok: "為她理衣整鬢"
 skonester_cheat_menu.0012.t: "親密 · 餘韻"
 skonester_cheat_menu_ai_ai_interaction: "愛愛"
 skonester_cheat_menu_ai_ai_interaction_desc: "與目標發生親密關係"
