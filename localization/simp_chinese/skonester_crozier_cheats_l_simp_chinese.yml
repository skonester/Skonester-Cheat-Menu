l_simp_chinese:
 SKONESTER_CROZIER_CHEATS_B_auto_ascension_OFF:0 "关闭  ·  我操控的每位统治者：最佳基因并+5能力"
 SKONESTER_CROZIER_CHEATS_B_auto_ascension_ON:0 "开启  ·  我操控的每位统治者：最佳基因并+5能力"
 SKONESTER_CROZIER_CHEATS_B_auto_ascension_TT:0 "你操控的角色获得天才、海格力斯和倾国倾城，并且全部六项能力+5。每个角色只会获得一次，因此你之后继续扮演的每位继承人也会获得。\n开启时会检查一次，之后每次自动模式检查时再次检查（默认每月一次，见下方的频率按钮）。"
 SKONESTER_CROZIER_CHEATS_B_auto_forever_young_OFF:0 "关闭  ·  永远30岁"
 SKONESTER_CROZIER_CHEATS_B_auto_forever_young_ON:0 "开启  ·  永远30岁"
 SKONESTER_CROZIER_CHEATS_B_auto_forever_young_TT:0 "每当你超过30岁时，你的年龄会被重新设为30岁。\n开启时会检查一次，之后每次自动模式检查时再次检查（默认每月一次，见下方的频率按钮）。"
 SKONESTER_CROZIER_CHEATS_B_auto_gold_floor_OFF:0 "关闭  ·  金钱永不低于1,000"
 SKONESTER_CROZIER_CHEATS_B_auto_gold_floor_ON:0 "开启  ·  金钱永不低于1,000"
 SKONESTER_CROZIER_CHEATS_B_auto_gold_floor_TT:0 "每当你的金钱少于1,000（包括负债）时，会被补足到正好1,000。\n开启时会检查一次，之后每次自动模式检查时再次检查（默认每月一次，见下方的频率按钮）。"
 SKONESTER_CROZIER_CHEATS_B_auto_no_prison_OFF:0 "关闭  ·  我不会被囚禁"
 SKONESTER_CROZIER_CHEATS_B_auto_no_prison_ON:0 "开启  ·  我不会被囚禁"
 SKONESTER_CROZIER_CHEATS_B_auto_no_prison_TT:0 "你一旦被囚禁，就会立即获释。\n开启时以及每次自动模式检查时也会检查。"
 SKONESTER_CROZIER_CHEATS_B_auto_prestige_floor_OFF:0 "关闭  ·  威望和虔诚永不低于1,000"
 SKONESTER_CROZIER_CHEATS_B_auto_prestige_floor_ON:0 "开启  ·  威望和虔诚永不低于1,000"
 SKONESTER_CROZIER_CHEATS_B_auto_prestige_floor_TT:0 "每当你的威望或虔诚低于1,000时，会被补足到正好1,000。\n开启时会检查一次，之后每次自动模式检查时再次检查（默认每月一次，见下方的频率按钮）。"
 SKONESTER_CROZIER_CHEATS_B_child_now:0 "立即与我的配偶生一个孩子"
 SKONESTER_CROZIER_CHEATS_B_child_now_TT:0 "你与你的一位配偶的新生孩子出现在你的宫廷中，拥有天才、海格力斯和倾国倾城。需要有配偶。孩子会加入你的宗族。"
 SKONESTER_CROZIER_CHEATS_B_combo_army:0 "梦幻大军"
 SKONESTER_CROZIER_CHEATS_B_combo_army_TT:0 "依次执行：每个兵士军团扩编（每个军团+1 / +2 / +5，取决于“数量”设置）并补满兵力；补满你各省份的征召兵和守军；5名强大的骑士加入你的宫廷（勇武40，军事18）；你、你的骑士和你的陆军将领获得后勤专家、军事工程师、组织者和激进的进攻者。"
 SKONESTER_CROZIER_CHEATS_B_combo_emergency:0 "紧急救援"
 SKONESTER_CROZIER_CHEATS_B_combo_emergency_TT:0 "依次执行：治愈你的疾病和伤势；将你从监狱中释放；赢得你作为主要防守方的所有战争；还清负债；取消所有针对你的计谋；接回你被扣为人质的亲属。"
 SKONESTER_CROZIER_CHEATS_B_combo_family:0 "完美家庭"
 SKONESTER_CROZIER_CHEATS_B_combo_family_TT:0 "依次执行：你、你的配偶和子女的所有疾病、伤势和缺陷都被治愈；你的继承人获得天才、海格力斯、倾国倾城，并且全部能力+10；你每个拥有教育特质的在世子女都获得该特质的最高等级。"
 SKONESTER_CROZIER_CHEATS_B_combo_golden_age:0 "黄金时代"
 SKONESTER_CROZIER_CHEATS_B_combo_golden_age_TT:0 "依次执行：还清所有负债，金钱翻倍，在你的整个领地内建造所有可建的建筑，提升伯爵领发展度（+1 / +5 / +20，取决于“数量”和“作用范围”设置），并提升你首都的发展度（+5 / +20 / +50，取决于“数量”设置）。"
 SKONESTER_CROZIER_CHEATS_B_combo_rise:0 "崛起掌权"
 SKONESTER_CROZIER_CHEATS_B_combo_rise_TT:0 "依次执行：你脱离领主而独立；若你的最高头衔低于王国级，则为你创建一个新王国；为你创建覆盖你伯爵领的所有无人持有的公国、王国和帝国头衔。"
 SKONESTER_CROZIER_CHEATS_B_combo_throne:0 "通往王座之路（封臣适用）"
 SKONESTER_CROZIER_CHEATS_B_combo_throne_TT:0 "适用于你是封臣时：你的领主对你的好感+100并指定你为其指定继承人，其他所有封臣在10年内被迫投票支持你，并且你获得对领主主头衔的强宣称。"
 SKONESTER_CROZIER_CHEATS_B_cooldowns_reset:0 "重置所有冷却时间"
 SKONESTER_CROZIER_CHEATS_B_cooldowns_reset_TT:0 "移除你在501项决议和558种角色互动上的冷却时间，使所有标记为尚未就绪的操作都可以再次使用。"
 SKONESTER_CROZIER_CHEATS_B_disease_player_OFF:0 "关闭  ·  疾病免疫"
 SKONESTER_CROZIER_CHEATS_B_disease_player_ON:0 "开启  ·  疾病免疫"
 SKONESTER_CROZIER_CHEATS_B_disease_player_TT:0 "给予你“疾病防护”特质（健康+50，阻止感染普通的非瘟疫疾病），并治愈你身上的所有疾病，包括腺鼠疫、天花和癌症。每次自动模式检查时都会再次治愈疾病。\n事件仍可能直接让你患病。\n如果你切换到其他角色，加成会在下一次自动模式检查时转移到该角色身上。"
 SKONESTER_CROZIER_CHEATS_B_domain_OFF:0 "关闭  ·  直辖上限+50 × 强度"
 SKONESTER_CROZIER_CHEATS_B_domain_ON:0 "开启  ·  直辖上限+50 × 强度"
 SKONESTER_CROZIER_CHEATS_B_domain_TT:0 "每级强度使你可以无惩罚地多直辖+50个伯爵领。\n强度是开启此项时面板顶部所选的倍率。如需之后更改，请先关闭此开关，选择新的强度，然后重新开启。\n如果你切换到其他角色，加成会在下一次自动模式检查时转移到该角色身上。"
 SKONESTER_CROZIER_CHEATS_B_enemy_commander:0 "移除其陆军将领"
 SKONESTER_CROZIER_CHEATS_B_enemy_commander_TT:0 "移除目标每支军队的将领。AI可能会任命新的将领。"
 SKONESTER_CROZIER_CHEATS_B_enemy_deplete:0 "消灭其25% / 50% / 90%已召集部队"
 SKONESTER_CROZIER_CHEATS_B_enemy_deplete_TT:0 "目标已召集的军队永久损失一部分士兵。\n数值取决于Skonester作弊面板顶部的“数量”设置：低25%，中50%，高90%。"
 SKONESTER_CROZIER_CHEATS_B_enemy_supply:0 "清空其军队补给"
 SKONESTER_CROZIER_CHEATS_B_enemy_supply_TT:0 "目标的每支已召集军队失去全部补给。"
 SKONESTER_CROZIER_CHEATS_B_forge_crown:0 "打造君主之冠"
 SKONESTER_CROZIER_CHEATS_B_forge_crown_TT:0 "在你的库存中添加一顶新的传奇王冠：外交+10，每月威望+5，封臣好感+25，总体好感+10。它永远不会磨损。"
 SKONESTER_CROZIER_CHEATS_B_freq_month:0 "自动模式：每月检查（默认）"
 SKONESTER_CROZIER_CHEATS_B_freq_month_TT:0 "自动模式和开关维护每30天运行一次。这是默认设置。在下一次检查后生效。"
 SKONESTER_CROZIER_CHEATS_B_freq_quarter:0 "自动模式：每季度检查"
 SKONESTER_CROZIER_CHEATS_B_freq_quarter_TT:0 "自动模式和开关维护每90天运行一次。对游戏性能的影响更小。在下一次检查后生效。"
 SKONESTER_CROZIER_CHEATS_B_freq_week:0 "自动模式：每周检查"
 SKONESTER_CROZIER_CHEATS_B_freq_week_TT:0 "自动模式和开关维护每7天运行一次。在下一次检查后生效。"
 SKONESTER_CROZIER_CHEATS_B_gold:0 "增加金钱：1,000 / 10,000 / 100,000"
 SKONESTER_CROZIER_CHEATS_B_gold_TT:0 "向你的国库增加金钱。\n数值取决于Skonester作弊面板顶部的“数量”设置：低1,000，中10,000，高100,000。"
 SKONESTER_CROZIER_CHEATS_B_gold_double:0 "金钱翻倍"
 SKONESTER_CROZIER_CHEATS_B_gold_double_TT:0 "增加与你当前持有数量相同的金钱。负债期间无效。"
 SKONESTER_CROZIER_CHEATS_B_good_traits_me:0 "给我最佳先天特质"
 SKONESTER_CROZIER_CHEATS_B_good_traits_me_TT:0 "添加天才、倾国倾城、海格力斯、强壮、精明、多产和纯血。"
 SKONESTER_CROZIER_CHEATS_B_gp_complete:0 "完成我所有的大型工程"
 SKONESTER_CROZIER_CHEATS_B_gp_complete_TT:0 "你拥有的每个大型工程都会立即完工，无需任何贡献。"
 SKONESTER_CROZIER_CHEATS_B_grandeur_max:0 "宫廷显赫度升至最大"
 SKONESTER_CROZIER_CHEATS_B_grandeur_max_TT:0 "将你的宫廷显赫度设为100。仅在你拥有朝廷时有效。"
 SKONESTER_CROZIER_CHEATS_B_health_OFF:0 "关闭  ·  健康+50 × 强度"
 SKONESTER_CROZIER_CHEATS_B_health_ON:0 "开启  ·  健康+50 × 强度"
 SKONESTER_CROZIER_CHEATS_B_health_TT:0 "每级强度增加+50健康。正常健康值只有个位数，因此即使是×1，你也几乎不会因健康不佳而死亡。\n强度是开启此项时面板顶部所选的倍率。如需之后更改，请先关闭此开关，选择新的强度，然后重新开启。\n如果你切换到其他角色，加成会在下一次自动模式检查时转移到该角色身上。"
 SKONESTER_CROZIER_CHEATS_B_immortal_player_OFF:0 "关闭  ·  永生：不会老死"
 SKONESTER_CROZIER_CHEATS_B_immortal_player_ON:0 "开启  ·  永生：不会老死"
 SKONESTER_CROZIER_CHEATS_B_immortal_player_TT:0 "给予你游戏中的“永生”特质：你的外表停止衰老，且不会老死。你仍可能被谋杀、处决、战死或因事件死亡。同时治愈认知衰退、瞳孔浑浊、心脏衰竭、骨质脆弱和体弱多病等衰老病症；若你年龄超过25岁，外貌将固定在25岁（显示的年龄仍会增长）。\n关闭此项会再次移除该特质，但仅限于由此开关添加的情况。\n如果你切换到其他角色，加成会在下一次自动模式检查时转移到该角色身上。"
 SKONESTER_CROZIER_CHEATS_B_income_OFF:0 "关闭  ·  收入+400% × 强度"
 SKONESTER_CROZIER_CHEATS_B_income_ON:0 "开启  ·  收入+400% × 强度"
 SKONESTER_CROZIER_CHEATS_B_income_TT:0 "每级强度使你的全部月收入增加+400%（×1 = 正常收入的五倍）。\n强度是开启此项时面板顶部所选的倍率。如需之后更改，请先关闭此开关，选择新的强度，然后重新开启。\n如果你切换到其他角色，加成会在下一次自动模式检查时转移到该角色身上。"
 SKONESTER_CROZIER_CHEATS_B_income_year:0 "立即获得一年收入"
 SKONESTER_CROZIER_CHEATS_B_income_year_TT:0 "立即增加相当于你当前年收入的金钱。不影响你的正常收入。"
 SKONESTER_CROZIER_CHEATS_B_influence_OFF:0 "关闭  ·  每月影响力+5 × 强度"
 SKONESTER_CROZIER_CHEATS_B_influence_ON:0 "开启  ·  每月影响力+5 × 强度"
 SKONESTER_CROZIER_CHEATS_B_influence_TT:0 "每级强度使你每月获得+5影响力。影响力仅用于行政制政体。\n强度是开启此项时面板顶部所选的倍率。如需之后更改，请先关闭此开关，选择新的强度，然后重新开启。\n如果你切换到其他角色，加成会在下一次自动模式检查时转移到该角色身上。"
 SKONESTER_CROZIER_CHEATS_B_innovation_OFF:0 "关闭  ·  革新速度+100% × 强度"
 SKONESTER_CROZIER_CHEATS_B_innovation_ON:0 "开启  ·  革新速度+100% × 强度"
 SKONESTER_CROZIER_CHEATS_B_innovation_TT:0 "每级强度使你的文化发现革新的速度加快+100%。仅在你是文化领袖时有效。\n强度是开启此项时面板顶部所选的倍率。如需之后更改，请先关闭此开关，选择新的强度，然后重新开启。\n如果你切换到其他角色，加成会在下一次自动模式检查时转移到该角色身上。"
 SKONESTER_CROZIER_CHEATS_B_instant_empire:0 "瞬间帝国"
 SKONESTER_CROZIER_CHEATS_B_instant_empire_TT:0 "依次执行：为你创建覆盖你伯爵领的所有无人持有的公国、王国和帝国头衔；若你没有帝国头衔，则获得一个新的帝国头衔；你法理领土内的独立统治者以及所有相邻的独立统治者，若地位低于你，则向你宣誓效忠；你获得你的公国及更高头衔下的每个法理伯爵领（并创建由此解锁的其他头衔）；所有等级升至最大。"
 SKONESTER_CROZIER_CHEATS_B_legend_spread_OFF:0 "关闭  ·  传奇传播+100% × 强度"
 SKONESTER_CROZIER_CHEATS_B_legend_spread_ON:0 "开启  ·  传奇传播+100% × 强度"
 SKONESTER_CROZIER_CHEATS_B_legend_spread_TT:0 "每级强度使你拥有的传奇传播速度加快+100%。\n强度是开启此项时面板顶部所选的倍率。如需之后更改，请先关闭此开关，选择新的强度，然后重新开启。\n如果你切换到其他角色，加成会在下一次自动模式检查时转移到该角色身上。"
 SKONESTER_CROZIER_CHEATS_B_legit_gain_OFF:0 "关闭  ·  每月正统性+1，获取+100% × 强度"
 SKONESTER_CROZIER_CHEATS_B_legit_gain_ON:0 "开启  ·  每月正统性+1，获取+100% × 强度"
 SKONESTER_CROZIER_CHEATS_B_legit_gain_TT:0 "每级强度使你每月获得+1正统性，并使你获得的所有正统性增加+100%。\n强度是开启此项时面板顶部所选的倍率。如需之后更改，请先关闭此开关，选择新的强度，然后重新开启。\n如果你切换到其他角色，加成会在下一次自动模式检查时转移到该角色身上。"
 SKONESTER_CROZIER_CHEATS_B_legit_level:0 "正统性+1级"
 SKONESTER_CROZIER_CHEATS_B_legit_level_TT:0 "将你的正统性提升一级。仅在你的角色使用正统性时有效（统治者使用；大多数无领地角色不使用）。"
 SKONESTER_CROZIER_CHEATS_B_levels_max_all:0 "所有等级升至最大"
 SKONESTER_CROZIER_CHEATS_B_levels_max_all_TT:0 "威望等级和虔诚等级升至5，若你的角色使用正统性则正统性+5级，若你拥有朝廷则宫廷显赫度升至100。"
 SKONESTER_CROZIER_CHEATS_B_levy_OFF:0 "关闭  ·  征召兵规模+100% × 强度"
 SKONESTER_CROZIER_CHEATS_B_levy_ON:0 "开启  ·  征召兵规模+100% × 强度"
 SKONESTER_CROZIER_CHEATS_B_levy_TT:0 "每级强度使你的所有地产多提供+100%的征召兵。\n强度是开启此项时面板顶部所选的倍率。如需之后更改，请先关闭此开关，选择新的强度，然后重新开启。\n如果你切换到其他角色，加成会在下一次自动模式检查时转移到该角色身上。"
 SKONESTER_CROZIER_CHEATS_B_life_OFF:0 "关闭  ·  预期寿命+10年 × 强度（家人）"
 SKONESTER_CROZIER_CHEATS_B_life_ON:0 "开启  ·  预期寿命+10年 × 强度（家人）"
 SKONESTER_CROZIER_CHEATS_B_life_TT:0 "每级强度使你、你的配偶和子女的预期寿命+10年。\n强度是开启此项时面板顶部所选的倍率。如需之后更改，请先关闭此开关，选择新的强度，然后重新开启。\n如果你切换到其他角色，加成会在下一次自动模式检查时转移到该角色身上。"
 SKONESTER_CROZIER_CHEATS_B_lifestyle_xp_OFF:0 "关闭  ·  生活方式经验+100% × 强度"
 SKONESTER_CROZIER_CHEATS_B_lifestyle_xp_ON:0 "开启  ·  生活方式经验+100% × 强度"
 SKONESTER_CROZIER_CHEATS_B_lifestyle_xp_TT:0 "每级强度使你的生活方式经验增长加快+100%，让你更早解锁技能。\n强度是开启此项时面板顶部所选的倍率。如需之后更改，请先关闭此开关，选择新的强度，然后重新开启。\n如果你切换到其他角色，加成会在下一次自动模式检查时转移到该角色身上。"
 SKONESTER_CROZIER_CHEATS_B_lifestyle_xp_all:0 "生活方式经验：各500 / 2,000 / 10,000"
 SKONESTER_CROZIER_CHEATS_B_lifestyle_xp_all_TT:0 "为全部六种生活方式（外交、军事、管理、谋略、学识、漫游）增加经验。\n数值取决于Skonester作弊面板顶部的“数量”设置：每种生活方式低500，中2,000，高10,000。"
 SKONESTER_CROZIER_CHEATS_B_long_reign_OFF:0 "关闭  ·  长期统治加成+100% × 强度"
 SKONESTER_CROZIER_CHEATS_B_long_reign_ON:0 "开启  ·  长期统治加成+100% × 强度"
 SKONESTER_CROZIER_CHEATS_B_long_reign_TT:0 "每级强度使长期统治加成的累积速度加快+100%。\n强度是开启此项时面板顶部所选的倍率。如需之后更改，请先关闭此开关，选择新的强度，然后重新开启。\n如果你切换到其他角色，加成会在下一次自动模式检查时转移到该角色身上。"
 SKONESTER_CROZIER_CHEATS_B_me_cure:0 "移除我的缺陷"
 SKONESTER_CROZIER_CHEATS_B_me_cure_TT:0 "移除先天与后天缺陷：失明、独眼、毁容、残废、口吃、足内翻、驼背、侏儒、近亲繁殖、哮喘、血友病、纺锤身形、鱼鳞病、白化病、虚弱、笨拙、智力低下、相貌丑陋、体格孱弱、不孕不育、沮丧消沉、精神错乱、附身、麻风病、多病、体弱多病和无能。"
 SKONESTER_CROZIER_CHEATS_B_me_fit:0 "正常体重"
 SKONESTER_CROZIER_CHEATS_B_me_fit_TT:0 "将你的体重设为正常并保持为目标体重，消除肥胖或体重过轻的惩罚。"
 SKONESTER_CROZIER_CHEATS_B_me_heal_all:0 "治愈我的疾病和伤势"
