 skonester_cheat_menu.3095.t: "庄园编辑"
 skonester_cheat_menu.3095.desc: "对 [skonester_cheat_menu_target.GetShortUIName] 应用独立庄园模板（互不覆盖路线数据）。先升主宅与内建，再按固定路线造满外槽（含剩余空槽自动补齐）。任意制度与文化可用。"
