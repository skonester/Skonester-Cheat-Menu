 skonester_boost_world_ai_rulers_decision: "全域有地AI强化"
 skonester_boost_world_ai_rulers_decision_desc: "强化所有拥有领地的AI领主，提升其内政、军事与经济能力，增强扩张及好战倾向。若玩家势力过于庞大，全体AI还会获得针对玩家的制衡倾向，提升游戏挑战性。"
