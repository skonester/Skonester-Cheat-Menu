l_turkish:
 water_of_life_header:0 "Tribünün Günlüğü:"
 water_of_life.1001.t:0 "$water_of_life_header$ Ölmeyen Adam"
 water_of_life.1001.desc:0 "Parşömen bir kütüphanede değil, Yahudiye'de bulunan paslı bir gladiusun kabzasının içine saklanmıştı. Latince kaba, askeriydi; Clavius adında bir Tribün'ün raporuydu. Mühürlü bir mezardan kaybolan bir cesetten, gerçeği bilen kızıl saçlı bir kadından ve yaşamın saatini durduran bir kupadan bahsediyor.\n\nSon giriş bir tarih değil, bir yemin: #'Ölemeyecek olanı öldüremem. Sadece ona hizmet edebilirim. Gözetlemek için ıssızlığa gidiyorum.'#!\n\nEfsaneler onun hala orada olduğunu söylüyor. Yardım bekleyen bir asker. Onu bulursam, Kaseyi de bulurum."
 water_of_life.1001.a:0 "Tribünün izini sürmek için bedenimi hazırlayacağım."
 water_of_life.1001.b:0 "Yola çıkmadan önce günlüğünü inceleyeceğim."
 water_of_life_header_1:0 "Takip:"
 water_of_life.1002.t:0 "$water_of_life_header_1$ Kartalın Gölgesi"
 water_of_life.1002.desc:0 "Tacımı geride bırakıyorum. Clavius'u bulmak için sürgün yolunda yürümeliyim. Kadifemi yünle, asamı yürüyüş sopasıyla değiştiriyorum. Günlüğündeki ipuçları, insanların şehirlerinden uzaklaşıp İmparatorluğun erişiminin çöktüğü sessiz yerlere doğru gidiyor. İzlerini kapatmak için asırları olan bir hayaleti takip ediyorum."
 water_of_life.1002.a:0 "Yol uzun, ama iradem demirden."
 water_of_life.1002.b:0 "Diyarıma son bir bakış, sonra kayboluyorum."
 water_of_life_header_2:0 "Issızlık:"
 water_of_life.1003.t:0 "$water_of_life_header_2$ Yedi Güç"
 water_of_life.1003.desc:0 "Yaban hayat bir [ROOT.Char.GetWomanMan] kemiğine kadar soyar. *Meryem İncili* uyardığı gibi, ruh Öfkenin Yedi Gücü tarafından kuşatılmıştır: Karanlık, Arzu ve Cehalet. Ateş başında yalnızken onlarla savaşıyorum. Haydutlardan korkmuyorum; Clavius'un Tanrısını bulduğu sessizlikten korkuyorum. Zihnim—*Nous*—taş yuvarlanmadan önce bir mezar kadar hareketsizleşmeli."
 water_of_life.1003.a:0 "Geri dönme isteğini yeniyorum."
 water_of_life_header_3:0 "Dayanıklılık Testi:"
 water_of_life.1004.t:0 "$water_of_life_header_3$ Askerin Azığı"
 water_of_life.1004.desc:0 "Erzağım azalıyor. Manzara acımasız kaya ve dikenlerden ibaret. Şimdi neden burayı seçtiğini anlıyorum: doğadan yapılmış bir kale. Açlık karnımı kemiriyor. Bir lord gibi mi avlanmalıyım, yoksa bir hacı gibi mi dilenmeliyim? Tribün disipline saygı duyardı ama Mecdelli Meryem alçakgönüllülüğü öğretti."
 water_of_life.1004.a:0 "Avlanacağım. Disiplin bedeni ayakta tutar."
 water_of_life.1004.b:0 "Yerlileri arayacağım. Alçakgönüllülük ruhu ayakta tutar."
 water_of_life_header_4:0 "Av:"
 water_of_life.1005.t:0 "$water_of_life_header_4$ Lejyonun İzleri"
 water_of_life.1005.desc:0 "Askerî bir düzenle üst üste yığılmış taşlardan bir işaret buluyorum. Ardından bir başkası. Başıboş dolaşmıyorum; bana yol gösteriliyor. Belki de bir yere sürülüyorum. Bir derenin yanında bir geyik görüyorum. Kaçmıyor. Güçlü bir muhafızın korumasındaymış gibi korkusuzca bana bakıyor. Yayımı indiriyorum. Burada öldürmek, bir ateşkesi bozmak gibi geliyor.\n\nTaşların yanında gizli İncil'den yıpranmış bir parça buluyorum. Onu dikkatle sarıyorum: eve götüreceğim bir tanıklık ve bu yerin gerektirdiği ölçülülüğün hatırası."
 water_of_life.1005.a:0 "Yayımı indiriyorum. Burada bir misafirim."
 water_of_life_header_5:0 "Köy:"
 water_of_life.1006.t:0 "$water_of_life_header_5$ Tepelerin İhtiyarı"
 water_of_life.1006.desc:0 "Dağın yamacına tutunmuş küçük bir köye varıyorum. Romalıyı sorduğumda köylüler balık işareti yapıyor. Bir ihtiyar fısıldıyor: 'Yabancı mı? Büyükbabamın büyükbabasından beri burada. Eski dünyanın demirini kuşanır. Bizi kurtlardan ve haydutlardan korur ama hiç konuşmaz. Birini bekliyor.' İhtiyar bana bakıyor. 'Belki de seni.'\n\nYol için erzak sunuyor. Ödeme yapmam ve köyünün tüccarlarına güvenli geçiş sözü vermem karşılığında ticaretlerini topraklarıma getirecekler."
 water_of_life.1006.a:0 "Erzakın bedelini ödeyeceğim; tüccarlarınız da hoş gelecek."
 water_of_life_header_6:0 "Yaklaşım:"
 water_of_life.1007.t:0 "$water_of_life_header_6$ Onuncu Lejyon"
 water_of_life.1007.desc:0 "Yol, kadim taşlarla tahkim edilmiş bir mağara ağzına çıkan bir keçi yoluna daralıyor. Üzerimde gözler hissediyorum; imparatorlukların yükselişini ve toza dönüşünü izlemiş bir bakışın ağırlığı. Duruyorum ve boş ellerimi kaldırıyorum. 'Tribün!' diye sesleniyorum. 'Diri Olanı arıyorum!' \n\nSessizlik cevap veriyor. Sonra, taşın sürtünme sesi."
 water_of_life.1007.a:0 "Aslanın inine gir."
 water_of_life_header_8:0 "Tribün:"
 water_of_life.1008.t:0 "$water_of_life_header_8$ Clavius Aquila"
 water_of_life.1008.desc:0 "Basit bir ateşin yanında oturmuş, hâlâ yeni gibi parlayan bir gladiusu temizliyor. Derisi çağlar boyunca aşınmış olsa da bir Roma tribününün giysilerini taşıyor. Clavius başını kaldırıyor; gözlerinde bin yıllık hatıraların ağırlığı var.\n\n'Birbiriyle bağdaştıramadığım iki şey gördüm,' diyor. 'Kesinlikle ölmüş bir adam ve aynı adamın yeniden hayatta oluşu. Meryem'e, layık bir halef gelene dek nöbet tutacağıma söz verdim.'\n\nAlevlere bakıyor. 'Nice krala öğüt verdim. Onlara adaletin inanç ya da soy ayırmaması gerektiğini hatırlattım. Şimdi o adaleti sen korumalısın.'\n\nYüzyıllar boyunca mücevherlerle süslenmiş sade bir kâse uzatıyor. 'İç, telaş dinsin. Geriye yalnızca görev kalsın. Nöbetimi devralmaya hazır mısın, [ROOT.GetCharacter.GetTitledFirstNameNoTooltip]?'\n\nKâsenin yanında, nöbetine asker sağlayan hanelerin adları yazılı bir tomar duruyor. Clavius onu ellerime bırakıyor. 'Artık senin çağrına karşılık verecekler. Onlara verdiğin sözü tut.'\n\nKutsal Kâse de bende kalacak; birazdan edeceğim yeminin kalıcı tanığı olacak."
 water_of_life.1008.a:0 "Nöbetini devralıyorum, Tribün. Artık dinlen."
 water_of_life_header_9:0 "Dönüş:"
 water_of_life.1009.t:0 "$water_of_life_header_9$ Yeni Muhafız"
 water_of_life.1009.desc:0 "Kupa dudaklarıma değdiği an Clavius toza dönüştü; sonunda huzura erdi. Onun yükünü ve O'nun kanını taşıyarak diyarıma dönüyorum. Tebaa tezahürat yapıyor ama anlamıyorlar. Onlar bir hükümdar görüyorlar; ben ise etin geçici doğasını.\n\n[one_loyal_subject_character.GetFirstNameNoTooltip]: [ROOT.Char.GetLadyLord], döndünüz! \n\n[second_loyal_subject_character.GetFirstNameNoTooltip]: Yabanda kaybolduğunuzdan korkmuştuk! \n\n[third_loyal_subject_character.GetFirstNameNoTooltip]: Görünüşünüz... korkutucu derecede sakin. \n\n[fourth_loyal_subject_character.GetFirstNameNoTooltip]: Evine hoş geldin, Muhafız."
 water_of_life.1009.a:0 "Yanımda durun. Nöbetimiz başlıyor."
 water_of_life.1003.martial_preparation:0 "\n\nYola çıkmadan önce edindiğim disiplin adımlarımı sağlamlaştırıyor. Araziyi bir asker gibi okuyarak gücümü önümdeki tırmanışa saklıyorum."
 water_of_life.1003.scholarly_preparation:0 "\n\nClavius'un günlüğünü inceleyerek geçirdiğim saatler meyvesini veriyor. Sözleri sessizliğe anlam katıyor; bu ıssızlığı neden seçtiğini anlamaya başlıyorum."
