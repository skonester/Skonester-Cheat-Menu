l_turkish:
 skonester_clavius_grail_name:0 "Ebedî Muhafız'ın Kutsal Kâsesi"
 skonester_clavius_grail_description:0 "Tribün Clavius Aquila'ya emanet edilen bu kâsenin sade kökeni, sayısız kuşağın sunduğu armağanların altında gizlidir. Uzun nöbeti sona ermeden önce Clavius onu halefinin ellerine bıraktı. Bu, ölümün artık acele ettiremediği birinin sabrıyla yaşayanları koruma sözüdür."
 skonester_clavius_grail_modifier:0 "Clavius'un Son Emaneti"
 skonester_clavius_grail_modifier_desc:0 "Tribünün kâsesi, sahibini bilgeliğe, bağlılığa ve her tebaasına adalet göstermeye çağırıyor."
 skonester_clavius_handover_memory:0 "Clavius'un Son Nöbeti"
 skonester_clavius_handover_memory_desc:0 "Clavius Aquila'nın Kutsal Kâsesi'nden içtim ve Ebedî Muhafız olarak görevini devraldım. Tribünün uzun nöbeti sonunda bitti."
 skonester_clavius_handover_memory_desc_second_perspective:0 "Clavius Aquila'nın Kutsal Kâsesi'nden içtin ve Ebedî Muhafız olarak görevini devraldın. Tribünün uzun nöbeti sonunda bitti."
 skonester_clavius_handover_memory_desc_third_perspective:0 "Bu kişi Clavius Aquila'nın Kutsal Kâsesi'nden içti ve Ebedî Muhafız olarak görevini devraldı. Tribünün uzun nöbeti sonunda bitti."
