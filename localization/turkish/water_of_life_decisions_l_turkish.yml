l_turkish:
 start_searching_for_water_of_life_decision:0 "Ölümün Uğramadığı Bir Gün"
 start_searching_for_water_of_life_decision_tooltip:0 "Tribün Clavius Aquila'nın izini sür ve bitmeyen nöbetinin sırrını öğren."
 start_searching_for_water_of_life_decision_desc:0 "#F 'Kesinlikle ölmüş bir adam ve aynı adamın yeniden hayatta oluşu. Bu iki şeyi unutamadım.'#!\n\nRoma'dan ayrılan Tribün Clavius Aquila, Meryem'in öğretilerini ve koruduğu sırrı izledi. Kâse'den içti ve ölümün erişemediği bir muhafıza dönüştü.\n\nYüzyıllardır ıssızlıkta nöbet tutuyor. Onu bulmak, yalnızca sonsuz yaşamı aramak değil; taşıdığı emaneti ve yaşayanları koruma görevini devralmaktır.\n\n#P Clavius hâlâ bekliyor. Nöbetini devralacak kişi ben olabilir miyim?#!"
 start_searching_for_water_of_life_decision_start:0 "Clavius'un günlüğünü çözmek için en az 25 öğrenime sahip olmalısın."
 start_searching_for_water_of_life_decision_proceed:0 "Clavius'un izini sürmek üzere yola çık. Yolun sonunda Kutsal Kâse ve Ebedî Muhafız'ın görevi seni bekliyor."
 start_searching_for_water_of_life_decision_stress:0 "Yolculuk, mizacına göre zihnini rahatlatabilir ya da seni zorlayabilir."
 start_searching_for_water_of_life_decision_stress_lazy:0 "Tembellik, Clavius'un izini sürmek için gereken disipline engel oluyor."
 start_searching_for_water_of_life_decision_confirm:0 "Tribünün izini süreceğim."
 water_of_life_modifier_knight_and_maa_limit_and_cap_increased:0 "Clavius'un Nöbetçileri"
 water_of_life_modifier_hunting_trophy:0 "Gizli İncil"
 water_of_life_modifier_good_deal:0 "Gizli Köyle Ticaret"
 water_of_life_modifier_hunting_trophy_desc:0 "Gizli İncil'den kurtarılan bir parça, bu hükümdarın yolculuğuna ve ıssızlıktaki ölçülülüğüne tanıklık ediyor."
 water_of_life_modifier_good_deal_desc:0 "Tribünün gizli köyünden gelen tüccarlar bu hükümdarın topraklarına düzenli gelir getiriyor."
 water_of_life_modifier_knight_and_maa_limit_and_cap_increased_desc:0 "Tribünün uzun nöbetine asker sağlayan haneler artık onun halefine bağlılık sunuyor."
